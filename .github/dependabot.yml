version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /docker
      - /samples/aspnetcore/samples/DemoSite
      - /tools/e2e
      - /tools/packaging/docker
      - /tools/packaging/rig
      - /tools/production-tests
      - /tools/production-tests/origin
      - /website
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
