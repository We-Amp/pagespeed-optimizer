version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /docker
      - /samples/aspnetcore/samples/DemoSite
      - /tools/e2e
      - /tools/packaging/docker
      - /tools/packaging/rig
      - /tools/production-tests
      - /tools/production-tests/origin
      - /website
    schedule:
      interval: weekly
    ignore:
      # Base images move between long-term-support releases on purpose.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
