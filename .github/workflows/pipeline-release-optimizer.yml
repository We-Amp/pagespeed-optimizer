#
# pipeline-release-optimizer.yml -- the optimizer host-package release lane,
# as a reusable workflow. The caller (release.yml) holds the triggers and the
# concurrency group; this file holds the jobs. See docs/ci/release.md and
# docs/ci/pipelines.md.
#
# Produces, for a tag `optimizer-v<upstream>` (e.g. optimizer-v1.16.0), a
# GitHub release with exactly this asset set (the serving-module release
# lane downloads these by name and verifies them against SHA256SUMS):
#   pagespeed-optimizer-<upstream>-1.x86_64.rpm
#   pagespeed-optimizer-<upstream>-1.aarch64.rpm
#   pagespeed-optimizer_<upstream>_amd64.deb
#   pagespeed-optimizer_<upstream>_arm64.deb
#   pagespeed-optimizer-<upstream>-win-x64.zip
#   SHA256SUMS
#   SHA256SUMS.asc   (real runs; the release signing key, see docs/ci/release.md)
# Asset NAMES carry the upstream SemVer spelling (`-rc.N`): GitHub sanitizes
# asset names, replacing '~' with '.', which would break `sha256sum -c` for
# every downloader. The package-internal Version keeps the dpkg/rpm tilde
# pre-release form (`1.16.0~rc.1`, derived here, never hand-typed).
#
# Runs:
#   * push of a tag matching optimizer-v*          -> REAL run
#   * workflow_dispatch { tag, dry_run: true  }    -> build + validate only
#   * workflow_dispatch { tag, dry_run: false }    -> REAL run
# A dry run builds all five packages, validates the asset set and
# SHA256SUMS fail-closed, and uploads them as a workflow artifact; it
# creates NO release and NO tag and never enters the `release` environment.
# A real run REQUIRES the tag to already exist on the remote (it never
# creates the tag itself; cutting the GA tag is the owner's act), passes the
# ref guard, and publishes the release from inside the `release` environment.
#
# Runners: the amd64 package and the Windows zip build on the fleet
# (fleet-heavy, fleet-windows) when FLEET_ENABLED is 'true', and on a hosted
# twin job with identical steps otherwise, so the kill switch never blocks a
# release. arm64 always builds on a hosted arm64 runner (a native build: the
# packaging scripts take --binary/--library and are arch-agnostic, and no
# cross toolchain exists for this tree). Everything that writes to GitHub
# runs hosted.
#
# The daemon binary MUST be built in the jammy-based pagespeed2-dev image
# (docker/Dockerfile), never on the runner host: jammy's static libc++
# archives keep the binary at a GLIBC_2.34 floor (the RHEL 9 / Debian 12
# contract; a noble build advertises GLIBC_2.38 and the resulting packages
# refuse to install there). The build therefore vendors on the host (so the
# in-container build needs no network), then runs bazel inside the
# content-hashed dev image with --vendor_dir.
#
# The release configs chain build:remote-cache. With BAZEL_CACHE_HOST in the
# runner environment (docs/ci/runner-environment.md) the build container
# reaches that cache; without it a trailing empty --remote_cache= disables
# it (later command-line flags win over the config chain) and hosted runners
# carry the repository cache and the in-container output base in
# actions/cache instead.
#
# The cyclone pin fetch: MODULE.bazel pins We-Amp/cyclone-cache, which is
# public, so Bazel's git fetch is anonymous and needs no credentials.

name: pipeline-release-optimizer

on:
  workflow_call:
    inputs:
      tag:
        description: Optimizer tag to build (optimizer-v<version>); empty on a tag push.
        type: string
        default: ''
      dry_run:
        description: Dispatch only. Build + validate, create no release. Ignored on a tag push.
        type: boolean
        default: true
    # Declared per secret and passed explicitly by the caller. They are
    # environment secrets of `release`: a job that runs in that environment
    # reads the environment's value. None is required, so a dry run needs
    # none of them; only `sign-checksums` reads them.
    secrets:
      RELEASE_GPG_KEY:
        required: false
      RELEASE_GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

jobs:
  event-guard:
    name: Event guard (refuses merge_group, unexpected events, refs and actors)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse events, refs and actors this pipeline must never run on
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ALLOWED: "push workflow_dispatch"
          ALLOWED_REFS: "refs/tags/* refs/heads/main"
        run: |
          set -euo pipefail
          set -f
          case " ${ALLOWED} " in *" ${EVENT} "*) ;; *) echo "::error::event ${EVENT} is not allowed in this pipeline"; exit 1;; esac
          case "${REF}" in refs/heads/gh-readonly-queue/*) echo "::error::merge queue refs never run this pipeline"; exit 1;; esac
          ok=no
          # shellcheck disable=SC2254  # the allowed refs are globs on purpose
          for r in ${ALLOWED_REFS}; do case "${REF}" in ${r}) ok=yes;; esac; done
          [ "${ok}" = yes ] || { echo "::error::ref ${REF} is not allowed in this pipeline"; exit 1; }
          if [ "${EVENT}" = workflow_dispatch ] && [ "${ACTOR}" = "github-actions[bot]" ]; then echo "::error::dispatches made with a workflow token are not allowed"; exit 1; fi
          if [ "${EVENT}" = pull_request ] && { [ "${PR_FORK}" = true ] || [ "${PR_HEAD_REPO}" != "${REPOSITORY}" ]; }; then echo "::error::pull requests from forks are not allowed in this pipeline"; exit 1; fi
          echo "event ${EVENT} on ${REF} accepted"
  ref-guard:
    name: Ref guard
    needs: event-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      guard_sha: ${{ steps.guard.outputs.sha }}
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - name: Checkout main (guard code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none

      - name: Real run or dry run
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "::error::event '$EVENT_NAME' may not run the release lane"; exit 1 ;;
          esac
          REAL=false
          if [ "$EVENT_NAME" = push ] || [ "$DRY_RUN_INPUT" = false ]; then
            REAL=true
          fi
          echo "real=$REAL" >> "$GITHUB_OUTPUT"
          echo "real run: $REAL"

      - name: Enforce the ref guard (real run)
        id: guard
        if: ${{ steps.mode.outputs.real == 'true' }}
        uses: ./.github/actions/ref-guard
        with:
          tag-glob: 'optimizer-v*'
          dispatch-tag: ${{ inputs.tag }}
          events: 'push workflow_dispatch'

      - name: Report the ref guard verdict (dry run)
        if: ${{ steps.mode.outputs.real != 'true' }}
        env:
          ALLOWED_TAG_GLOB: 'optimizer-v*'
          ALLOWED_EVENTS: 'push workflow_dispatch'
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            export INPUT_TAG="$DISPATCH_TAG"
          fi
          git fetch --no-tags --quiet origin '+refs/heads/main:refs/remotes/origin/main'
          if bash tools/ci/ref_guard.sh check; then
            echo "::notice::dry run: the ref guard would accept a real run of this tag"
          else
            echo "::notice::dry run: the ref guard would refuse a real run of this tag (see above); the dry run continues"
          fi

  version:
    name: Derive versions from the tag
    needs: ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      upstream: ${{ steps.derive.outputs.upstream }}
      pkg_version: ${{ steps.derive.outputs.pkg_version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      dry_run: ${{ steps.derive.outputs.dry_run }}
      checkout_ref: ${{ steps.derive.outputs.checkout_ref }}
      tag_sha: ${{ steps.derive.outputs.tag_sha }}
    steps:
      - name: Derive
        id: derive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GUARD_SHA: ${{ needs.ref-guard.outputs.guard_sha }}
        run: |
          set -euo pipefail
          # TAG arrives via the environment, never interpolated into the
          # script text; validate it before any use.
          case "$TAG" in
            optimizer-v[0-9]*) ;;
            *) echo "::error::tag '$TAG' does not match optimizer-v<version>"; exit 1 ;;
          esac
          UPSTREAM="${TAG#optimizer-v}"
          # SemVer base + optional prerelease; no build metadata.
          if ! printf '%s' "$UPSTREAM" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$'; then
            echo "::error::upstream version '$UPSTREAM' is not X.Y.Z[-prerelease]"; exit 1
          fi
          # A backslash-escaped \~ in the replacement is NOT portable, and a
          # LITERAL ~ is worse: bash >= 4.4 tilde-expands it in the
          # replacement of ${var/pat/repl} even inside double quotes. Expand
          # the tilde from a variable instead; expansion results are never
          # re-scanned for tilde expansion, in any bash version.
          TILDE='~'
          PKG_VERSION="${UPSTREAM/-/$TILDE}"
          PRERELEASE=false
          case "$UPSTREAM" in *-*) PRERELEASE=true ;; esac
          # push of a tag is always a real run; dispatch is real only when
          # dry_run is explicitly false.
          DRY_RUN=true
          if [ "${{ github.event_name }}" = "push" ]; then
            DRY_RUN=false
          elif [ "${{ inputs.dry_run }}" = "false" ]; then
            DRY_RUN=false
          fi
          # Resolve the tag on the remote. A REAL run requires it to exist
          # already; the lane never creates tags (`gh release create
          # --verify-tag` enforces the same server-side). A dry run may name
          # a tag that does not exist yet; then it builds the dispatched ref.
          TAG_SHA=""
          CHECKOUT_REF="${{ github.ref }}"
          # Resolve by FULL ref: a branch named like the tag must never win.
          if TAG_SHA="$(gh api "repos/${{ github.repository }}/commits/refs/tags/$TAG" --jq .sha 2>/dev/null)"; then
            CHECKOUT_REF="refs/tags/$TAG"
            if [ -n "$GUARD_SHA" ] && [ "$GUARD_SHA" != "$TAG_SHA" ]; then
              echo "::error::tag '$TAG' resolves to $TAG_SHA but the ref guard accepted $GUARD_SHA"
              exit 1
            fi
          elif [ "$DRY_RUN" = "false" ]; then
            echo "::error::real run but tag '$TAG' does not exist on the remote; push the tag first, the lane never creates it"
            exit 1
          else
            echo "::notice::dry run: tag '$TAG' is not on the remote; building the dispatched ref instead"
            TAG_SHA=""
          fi
          {
            echo "tag=$TAG"
            echo "upstream=$UPSTREAM"
            echo "pkg_version=$PKG_VERSION"
            echo "prerelease=$PRERELEASE"
            echo "dry_run=$DRY_RUN"
            echo "checkout_ref=$CHECKOUT_REF"
            echo "tag_sha=$TAG_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG upstream=$UPSTREAM pkg=$PKG_VERSION prerelease=$PRERELEASE dry_run=$DRY_RUN checkout=$CHECKOUT_REF"

      # From 2.5.0 on the tag must name VERSION.txt of the commit it builds.
      # The guard comes from main (release.yml calls this lane @main), VERSION.txt
      # from the build commit, so an older tag without the script still builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Verify VERSION.txt matches the release tag (from 2.5.0 on)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.derive.outputs.tag }}
          TAG_SHA: ${{ steps.derive.outputs.tag_sha }}
          DRY_RUN: ${{ steps.derive.outputs.dry_run }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${GITHUB_REPOSITORY}/contents/VERSION.txt?ref=${TAG_SHA:-$GITHUB_SHA}" > "$RUNNER_TEMP/VERSION.txt"
          # Only a dry run of a tag that does not exist yet may warn instead of fail.
          if [ -z "$TAG_SHA" ]; then
            set -- --dry-run
          else
            set --
            if [ "$DRY_RUN" = true ]; then
              echo "::notice::dry run of an existing tag: $TAG is on the remote, so a VERSION.txt mismatch fails here as in a real run. To rehearse an unfinished release, dispatch a dry run of a tag that does not exist yet (optimizer-v2.5.0-pre.N) instead."
            fi
          fi
          bash tools/ci/check_optimizer_tag_version.sh "$TAG" "$RUNNER_TEMP/VERSION.txt" "$@"

  # ---------------------------------------------------------------------
  # Linux packages. One step list (YAML anchor) for three jobs: amd64 on the
  # fleet, its hosted twin while the fleet is off, and arm64 hosted. The job
  # env selects the arch and the bazel config.
  # ---------------------------------------------------------------------
  build-amd64:
    name: Build + package (linux amd64)
    needs: version
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 120
    env:
      ARCH: amd64
      BAZEL_RELEASE_CONFIG: release
    steps: &linux-package-steps
      # A prior run's `bazel vendor` can leave read-only toolchain files in a
      # persistent workspace that checkout's cleanup cannot remove.
      - name: Unlock stale vendored files
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true

      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}

      # The version job resolved the tag to a commit; if the tag moved
      # between resolution and checkout, refuse rather than package the
      # wrong tree under the tag's name.
      - name: Verify the checkout is the resolved tag commit
        if: ${{ needs.version.outputs.tag_sha != '' }}
        env:
          WANT: ${{ needs.version.outputs.tag_sha }}
        run: |
          set -euo pipefail
          GOT="$(git rev-parse HEAD)"
          [ "$WANT" = "$GOT" ] || { echo "::error::tag moved: resolved $WANT, checked out $GOT"; exit 1; }

      - name: Ensure bazel
        run: |
          if command -v bazel >/dev/null 2>&1; then bazel --version; exit 0; fi
          npm install -g @bazel/bazelisk@1.28.1 2>/dev/null || sudo npm install -g @bazel/bazelisk@1.28.1
          bazel --version

      # Hosted only: the repository cache (vendor downloads, incl. the
      # cyclone clone) and the in-container bazel output base
      # (.ci-cache/bazel-out, bind-mounted to /tmp/bazel-out). Prefixed
      # per-arch: an output base is arch-specific. Bump the vN salt to
      # invalidate stale toolchains/outputs deliberately. Fleet runners use
      # the remote cache from their runner environment instead.
      - name: Cache Bazel repository cache + container output base (hosted)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
            .ci-cache
          key: ${{ runner.os }}-${{ env.ARCH }}-opt-release-bazel-v3-${{ hashFiles('MODULE.bazel', '.bazelrc', '.bazelversion', 'third_party/cyclone.BUILD', 'docker/Dockerfile', 'docker/nginx-version.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ARCH }}-opt-release-bazel-v3-

      # Stamp the source revision into the build, the same mechanism
      # docker/build-release.sh uses: //src/product_version:build_commit
      # embeds this file's content, the daemon prints its first 7 chars in
      # --version, and the packaging scripts' --expect-version tripwire
      # asserts it. The checked-in file holds the literal "dev".
      - name: Stamp GIT_COMMIT
        run: printf '%s' "$(git rev-parse HEAD)" > GIT_COMMIT

      # Content-hashed dev image, the same formula on every runner. Jammy
      # base on purpose (see the header): it keeps the glibc floor at 2.34.
      # Inline rather than a tools/ci helper so that a dispatch of an older
      # tag still builds. Cold on a hosted runner (~15 min).
      - name: Ensure dev image (content-hashed)
        id: image
        run: |
          set -euo pipefail
          DIR_HASH=$(find docker/ -type f | sort | xargs -I{} sha256sum {} | sha256sum | cut -c1-12)
          CONTENT_IMAGE="pagespeed2-dev:${ARCH}-${DIR_HASH}"
          docker image inspect "$CONTENT_IMAGE" >/dev/null 2>&1 || \
            docker build -t "$CONTENT_IMAGE" docker/
          echo "image=$CONTENT_IMAGE" >> "$GITHUB_OUTPUT"

      # Vendor on the host, so the in-container build needs no network.
      - name: Vendor dependencies (host)
        run: >
          bazel vendor --vendor_dir=vendor
          "--repository_cache=$HOME/.cache/bazel-repo"
          //src/worker:factory_worker //lib/pagespeed:libpagespeed.so

      # --config=release / --config=release-linux-arm64: opt + thin_lto +
      # hardening + stamp; thin_lto links against the image's lld-20 via its
      # ld.lld symlink. HOME=/workspace lets the image's bazelisk find its
      # bazel download.
      - name: Build the daemon and client library (release config, in-container)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p out .ci-cache/bazel-out
          EXTRA_DOCKER=()
          CACHE_FLAG="--remote_cache="
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
            CACHE_FLAG=""
            echo "using the remote Bazel cache from the runner environment"
          else
            echo "::notice::BAZEL_CACHE_HOST not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init ${EXTRA_DOCKER[@]+"${EXTRA_DOCKER[@]}"} \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace \
            -e BAZEL_RELEASE_CONFIG \
            -e CACHE_FLAG="$CACHE_FLAG" \
            -v "$PWD":/workspace \
            -v "$PWD/.ci-cache/bazel-out":/tmp/bazel-out \
            -w /workspace \
            "$IMAGE" \
            bash -c 'set -e
              # CACHE_FLAG is empty or one flag; the guarded expansion keeps
              # an empty value from becoming an empty argument.
              bazel --output_user_root=/tmp/bazel-out \
                build --vendor_dir=vendor "--config=${BAZEL_RELEASE_CONFIG}" ${CACHE_FLAG:+"$CACHE_FLAG"} \
                //src/worker:factory_worker //lib/pagespeed:libpagespeed.so
              cp -L bazel-bin/src/worker/factory_worker \
                    bazel-bin/lib/pagespeed/libpagespeed.so /workspace/out/'

      - name: Assert binary hardening
        run: |
          set -euo pipefail
          bash tools/assert-binary-hardening.sh out/factory_worker
          bash tools/assert-binary-hardening.sh out/libpagespeed.so

      - name: Ensure packaging image (content-hashed, digest-pinned base)
        id: pkgimage
        run: |
          set -euo pipefail
          PKG_HASH=$(find tools/packaging/docker/ -type f | sort | xargs cat | sha256sum | cut -c1-12)
          PKG_IMAGE="optimizer-packaging:${PKG_HASH}"
          docker image inspect "$PKG_IMAGE" >/dev/null 2>&1 || \
            docker build -t "$PKG_IMAGE" tools/packaging/docker/
          echo "image=$PKG_IMAGE" >> "$GITHUB_OUTPUT"

      # The deb/rpm scripts derive the package arch from the container, so
      # each leg must run on its native runner arch.
      - name: Package deb + rpm (in packaging container)
        env:
          PKG_VERSION: ${{ needs.version.outputs.pkg_version }}
          PKG_IMAGE: ${{ steps.pkgimage.outputs.image }}
        run: |
          set -euo pipefail
          EXPECT="$(git rev-parse --short=7 HEAD)"
          rm -rf dist
          mkdir -p dist
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/w -w /w "$PKG_IMAGE" \
            bash -c "tools/packaging/build-optimizer-deb.sh --version '$PKG_VERSION' \
                --binary out/factory_worker --library out/libpagespeed.so \
                --expect-version '$EXPECT' --out dist/ && \
              tools/packaging/build-optimizer-rpm.sh --version '$PKG_VERSION' \
                --binary out/factory_worker --library out/libpagespeed.so \
                --expect-version '$EXPECT' --out dist/"
          ls -la dist/

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optimizer-linux-${{ env.ARCH }}
          path: dist/*
          if-no-files-found: error

  build-amd64-hosted:
    name: Build + package (linux amd64, hosted)
    needs: version
    if: ${{ vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ARCH: amd64
      BAZEL_RELEASE_CONFIG: release
    steps: *linux-package-steps

  build-arm64:
    name: Build + package (linux arm64)
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      ARCH: arm64
      BAZEL_RELEASE_CONFIG: release-linux-arm64
    steps: *linux-package-steps

  # ---------------------------------------------------------------------
  # Windows zip. Fleet job plus a hosted twin while the fleet is off; one
  # step list. Anything a hosted image lacks is installed only when missing.
  # ---------------------------------------------------------------------
  build-windows:
    name: Build + package (windows x64)
    needs: version
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-windows' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 180
    steps: &windows-package-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}

      - name: Verify the checkout is the resolved tag commit
        if: ${{ needs.version.outputs.tag_sha != '' }}
        shell: bash
        env:
          WANT: ${{ needs.version.outputs.tag_sha }}
        run: |
          set -euo pipefail
          GOT="$(git rev-parse HEAD)"
          [ "$WANT" = "$GOT" ] || { echo "::error::tag moved: resolved $WANT, checked out $GOT"; exit 1; }

      # BAZEL_SH from the runner environment when it names an existing
      # shell, else MSYS2, else Git for Windows.
      - name: Locate the build tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sh = $env:BAZEL_SH
          if (-not $sh -or -not (Test-Path $sh)) {
            $sh = @('C:\msys64\usr\bin\bash.exe', 'C:\Program Files\Git\bin\bash.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $sh) { Write-Error 'no bash for Bazel: set BAZEL_SH in the runner environment'; exit 1 }
          "BAZEL_SH=$sh" >> $env:GITHUB_ENV
          if (-not (Get-Command bazelisk -ErrorAction SilentlyContinue)) {
            npm install -g @bazel/bazelisk@1.28.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install the build tools the image lacks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # gperf generates the HTML name tables; nasm assembles libaom's
          # x86 kernels. Installed only when missing (hosted images carry
          # MSYS2 and Chocolatey).
          if (-not (Test-Path C:\msys64\usr\bin\gperf.exe) -and -not (Get-Command gperf -ErrorAction SilentlyContinue)) {
            & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed gperf
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path "C:\Program Files\NASM\nasm.exe") -and -not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Cache Bazel repository and disk caches (hosted)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\bazel-repo
            C:\bazel-disk
          key: ${{ runner.os }}-x64-opt-release-bazel-v1-${{ hashFiles('MODULE.bazel', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            ${{ runner.os }}-x64-opt-release-bazel-v1-

      - name: Stamp GIT_COMMIT
        shell: bash
        run: printf '%s' "$(git rev-parse HEAD)" > GIT_COMMIT

      - name: Build the daemon and client library (release config)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The build reads PATH, INCLUDE and LIB (.bazelrc action_env), so it
          # runs inside the MSVC x64 developer environment. The CMake-built
          # codec also needs the MSYS2 shell tools.
          # Build Tools installs are products too: without -products * vswhere
          # reports nothing on a host that has only them, hence the fallback.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = $null
          if (Test-Path -LiteralPath $vswhere) {
            $vs = & $vswhere -latest -products * -property installationPath 2>$null
          }
          if (-not $vs -or -not (Test-Path -LiteralPath "$vs\VC\Auxiliary\Build\vcvars64.bat")) {
            $vs = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Community'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Enterprise')
            ) | Where-Object { Test-Path -LiteralPath "$_\VC\Auxiliary\Build\vcvars64.bat" } | Select-Object -First 1
          }
          if (-not $vs) { Write-Host "::error::no Visual Studio installation found"; exit 1 }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          # Call the command interpreter by its full path: a bare `cmd` can
          # resolve to another program when a POSIX tools directory precedes
          # the system directory on PATH.
          & "$env:ComSpec" /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              Set-Item -Path "env:$($Matches[1])" -Value $Matches[2]
            }
          }
          $env:PATH = "C:\msys64\usr\bin;C:\Program Files\NASM;$env:PATH"
          $cacheArgs = @()
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted') {
            $cacheArgs += '--repository_cache=C:/bazel-repo', '--disk_cache=C:/bazel-disk'
          }
          if ($env:BAZEL_REMOTE_CACHE_URL) {
            Write-Host 'using the remote Bazel cache from the runner environment'
            $cacheArgs += "--remote_cache=$env:BAZEL_REMOTE_CACHE_URL"
          }
          # A fixed output user root: the default lives under the service
          # profile, whose name can carry a dollar sign that the generated
          # ninja files cannot escape. Same rule as the NuGet lane.
          $outRoot = $(if ($env:CI_WIN_BAZEL_OUTPUT_ROOT) { $env:CI_WIN_BAZEL_OUTPUT_ROOT } else { Join-Path $env:SystemDrive 'b' }) -replace '\\', '/'
          $startup = @("--output_user_root=$outRoot")
          bazelisk @startup build --config=windows --config=opt @cacheArgs `
            //src/worker:factory_worker //lib/pagespeed:libpagespeed.so
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = (bazelisk @startup info --config=windows --config=opt bazel-bin).Trim()
          if (Test-Path out) { Remove-Item -Recurse -Force out }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "$bin\src\worker\factory_worker.exe" out\factory_worker.exe
          Copy-Item "$bin\lib\pagespeed\libpagespeed.so" out\pagespeed.dll

      - name: The binaries need no Visual C++ runtime
        shell: powershell
        run: |
          & tools\ci\check-no-vc-runtime.ps1 -Binaries out\factory_worker.exe,out\pagespeed.dll
          exit $LASTEXITCODE

      - name: Package
        shell: powershell
        env:
          UPSTREAM: ${{ needs.version.outputs.upstream }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The upstream (SemVer) spelling: asset names never carry the
          # package tilde, which GitHub would rewrite.
          $name = "pagespeed-optimizer-$env:UPSTREAM-win-x64"
          $stage = "stage\$name"
          foreach ($d in @('stage', 'dist')) { if (Test-Path $d) { Remove-Item -Recurse -Force $d } }
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item out\factory_worker.exe, out\pagespeed.dll, LICENSE, NOTICE $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$name.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optimizer-windows-x64
          path: dist/*
          if-no-files-found: error

  build-windows-hosted:
    name: Build + package (windows x64, hosted)
    needs: version
    if: ${{ vars.FLEET_ENABLED != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 240
    steps: *windows-package-steps

  manifest:
    name: Validate asset set + SHA256SUMS
    needs: [version, build-amd64, build-amd64-hosted, build-arm64, build-windows, build-windows-hosted]
    # Exactly one of each fleet/hosted pair runs; the other is skipped.
    if: >-
      ${{ !cancelled()
      && needs.version.result == 'success'
      && needs.build-arm64.result == 'success'
      && (needs.build-amd64.result == 'success' || needs.build-amd64-hosted.result == 'success')
      && (needs.build-windows.result == 'success' || needs.build-windows-hosted.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: optimizer-*
          merge-multiple: true

      # Rename the tilde package-version spelling to the upstream SemVer
      # spelling for the asset names (GitHub would sanitize '~' to '.',
      # breaking sha256sum -c for downloaders), then sum.
      - name: Manifest
        env:
          UPSTREAM: ${{ needs.version.outputs.upstream }}
          PKG_VERSION: ${{ needs.version.outputs.pkg_version }}
        run: |
          set -euo pipefail
          cd dist
          if [ "$UPSTREAM" != "$PKG_VERSION" ]; then
            for f in ./*"$PKG_VERSION"*; do
              mv "$f" "${f//$PKG_VERSION/$UPSTREAM}"
            done
          fi
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Fail closed on ANY contract deviation: exactly the six assets, all
      # present and non-empty, sums verify, and the package-internal
      # versions carry the tilde package version the serving module's
      # exact-version dependency will name. The glibc floor must stay at
      # 2.34 (the RHEL 9 / Debian 12 contract); a noble-built binary would
      # say 2.38.
      - name: Fail-closed asset contract validation
        env:
          UPSTREAM: ${{ needs.version.outputs.upstream }}
          PKG_VERSION: ${{ needs.version.outputs.pkg_version }}
        run: |
          set -euo pipefail
          cd dist
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm >/dev/null
          EXPECTED=(
            "pagespeed-optimizer-${UPSTREAM}-1.x86_64.rpm"
            "pagespeed-optimizer-${UPSTREAM}-1.aarch64.rpm"
            "pagespeed-optimizer_${UPSTREAM}_amd64.deb"
            "pagespeed-optimizer_${UPSTREAM}_arm64.deb"
            "pagespeed-optimizer-${UPSTREAM}-win-x64.zip"
            "SHA256SUMS"
          )
          mapfile -t ACTUAL < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          [ "${#ACTUAL[@]}" -eq 6 ] || { echo "::error::asset count ${#ACTUAL[@]} != 6: ${ACTUAL[*]}"; exit 1; }
          # The Windows zip: exactly the worker, its client library and the
          # two licence files.
          unzip -Z1 "pagespeed-optimizer-${UPSTREAM}-win-x64.zip" | sort | tr '\n' ' ' | grep -qx 'LICENSE NOTICE factory_worker.exe pagespeed.dll ' \
            || { echo "::error::unexpected Windows zip contents: $(unzip -Z1 "pagespeed-optimizer-${UPSTREAM}-win-x64.zip" | tr '\n' ' ')"; exit 1; }
          for f in "${EXPECTED[@]}"; do
            [ -f "$f" ] || { echo "::error::missing asset '$f'"; exit 1; }
            [ -s "$f" ] || { echo "::error::empty asset '$f'"; exit 1; }
          done
          sha256sum -c SHA256SUMS
          for deb in ./*.deb; do
            v="$(dpkg-deb -f "$deb" Version)"
            [ "$v" = "$PKG_VERSION" ] || { echo "::error::$deb Version '$v' != '$PKG_VERSION'"; exit 1; }
            dep="$(dpkg-deb -f "$deb" Depends)"
            echo "$deb Depends: $dep"
            [ "$dep" = "libc6 (>= 2.34)" ] || { echo "::error::$deb Depends '$dep' != 'libc6 (>= 2.34)'; the binary was not built on the jammy dev image"; exit 1; }
          done
          for rpmf in ./*.rpm; do
            v="$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpmf")"
            [ "$v" = "${PKG_VERSION}-1" ] || { echo "::error::$rpmf version-release '$v' != '${PKG_VERSION}-1'"; exit 1; }
            rpm -qp --requires "$rpmf" | grep -qx 'glibc >= 2.34' || { echo "::error::$rpmf lacks 'glibc >= 2.34' requires; the binary was not built on the jammy dev image"; exit 1; }
            if rpm -qp --requires "$rpmf" | grep -qE '^glibc >= 2\.3[5-9]|^glibc >= [3-9]'; then
              echo "::error::$rpmf requires a glibc above the 2.34 floor"
              exit 1
            fi
          done
          echo "asset contract: ok"
          {
            echo "### Asset contract validated"
            echo ""
            echo '```'
            ls -la
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Always uploaded (dry-run inspection AND real-run audit trail); the
      # release job re-downloads this exact set.
      - name: Upload validated dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optimizer-release-dist
          path: dist/*
          if-no-files-found: error

  # Real runs only, inside the protected `release` environment. The release
  # signing key lives in this one job, which holds no write token. The
  # signing script and the published public key come from main, never from
  # the tree being released.
  sign-checksums:
    name: Sign SHA256SUMS
    needs: [version, manifest]
    if: ${{ !cancelled() && needs.manifest.result == 'success' && needs.version.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Checkout main (signing script, published key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trust
          sparse-checkout: |
            tools/ci/release_checksums_sig.sh
            RELEASE-SIGNING-KEY.asc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download validated dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: optimizer-release-dist
          path: dist

      - name: Verify the set across the job boundary
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Sign SHA256SUMS (detached, armored)
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash trust/tools/ci/release_checksums_sig.sh sign dist/SHA256SUMS signature/SHA256SUMS.asc

      # A fresh keyring holding only RELEASE-SIGNING-KEY.asc from main.
      - name: Verify SHA256SUMS.asc against the published release key
        run: |
          set -euo pipefail
          bash trust/tools/ci/release_checksums_sig.sh verify dist/SHA256SUMS signature/SHA256SUMS.asc trust/RELEASE-SIGNING-KEY.asc \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Belt and braces for the script's EXIT trap: a cancelled or killed
      # step skips it, and a leftover keyring on a persistent runner would
      # keep the private key on disk.
      - name: Remove the temporary keyrings
        if: always()
        run: |
          for h in "${RUNNER_TEMP}"/gnupg.*; do
            [ -d "$h" ] || continue
            GNUPGHOME="$h" gpgconf --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf "$h"
          done

      - name: Upload the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optimizer-release-signature
          path: signature/SHA256SUMS.asc
          if-no-files-found: error

  # Real runs only, inside the protected `release` environment (required
  # reviewer and tag policy: docs/ci/release.md). A dry run never gets here.
  release:
    name: Publish GitHub release
    needs: [version, manifest, sign-checksums]
    if: ${{ !cancelled() && needs.manifest.result == 'success' && needs.sign-checksums.result == 'success' && needs.version.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      # gh release create --verify-tag shells out to git, so the job needs
      # a checkout of the tag; downloading the dist artifact alone leaves
      # no .git and the publish fails with "not a git repository".
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Verify the checkout is the resolved tag commit
        env:
          WANT: ${{ needs.version.outputs.tag_sha }}
        run: |
          set -euo pipefail
          GOT="$(git rev-parse HEAD)"
          [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "::error::tag moved or unresolved: resolved '$WANT', checked out $GOT"; exit 1; }

      - name: Download validated dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: optimizer-release-dist
          path: dist

      - name: Download the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: optimizer-release-signature
          path: dist

      - name: Re-verify SHA256SUMS across the job boundary
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          [ -s SHA256SUMS.asc ] || { echo "::error::SHA256SUMS.asc is missing"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PKG_VERSION: ${{ needs.version.outputs.pkg_version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--verify-tag)
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          gh release create "$TAG" "${FLAGS[@]}" \
            --title "pagespeed-optimizer $PKG_VERSION" \
            --notes "The pagespeed-optimizer host packages (optimization daemon + the libpagespeed.so client library serving modules bind), version \`$PKG_VERSION\`, for deb and rpm hosts on amd64 and arm64, and a Windows x64 zip (factory_worker.exe + pagespeed.dll). Install alongside the matching serving-module package, which depends on this package at this exact version. Verify downloads against SHA256SUMS, and SHA256SUMS against SHA256SUMS.asc with the release signing key 411D EFDB 5713 51D2 B25A EFCC 9C02 B5BD CCE7 5313 (RELEASE-SIGNING-KEY.asc in this repository)." \
            ./dist/*
