      - name: Ensure the dev image
        run: |
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest arm64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          mkdir -p "${HOME}/.cache/optimizer-bazel-disk-arm64"
          docker run --rm --init \
            --user "$(id -u):$(id -g)" -e HOME=/workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${HOME}/.cache/optimizer-bazel-disk-arm64:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              FLAGS="--vendor_dir=vendor --config=docker --jobs=HOST_CPUS*.75 --nostamp --disk_cache=/cache --experimental_disk_cache_gc_max_size=2G"
              [ -d vendor ] || FLAGS="${FLAGS/--vendor_dir=vendor /}"
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out \
                test $FLAGS --nocache_test_results --flaky_test_attempts=2 \
                //test/... //lib/pagespeed:pagespeed_test \
