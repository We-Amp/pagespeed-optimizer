#
# Exercise a pipeline change on the fleet before it reaches main: push the
# change to the ci-dev branch, then dispatch this workflow. It calls the PR
# tier at @ci-dev instead of @main. See docs/ci/pipelines.md.

name: CI (ci-dev)

on:
  workflow_dispatch:

concurrency:
  group: ci-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pr:
    uses: We-Amp/pagespeed-optimizer/.github/workflows/pipeline-pr.yml@ci-dev
