#
# The thin CI caller. Step 2 of the cutover renames this file over ci.yml
# (and drops ci.yml from tools/ci/workflow-shape-allowlist.txt). It holds
# the triggers and the concurrency group only; every job lives in the
# reusable workflows, pinned to main. See docs/ci/pipelines.md.
#
# Required checks after the switch are named `pr / <job name>` (for
# example `pr / Linux Build`) plus `CI gate`.

name: CI

on:
  pull_request:
    branches: [main]
  # The merge queue's temporary branch: the same pipeline runs on the
  # queued merge result, and `CI gate` reports on it.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the full tier
        type: boolean
        default: false

# Cancel superseded pull request runs only; a push to main always finishes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr:
    # The called pipeline requests pull-requests: read for the release-note
    # gate and checks: read for its fleet scope (reads the commit's check
    # suites); a called workflow cannot exceed what its caller grants.
    permissions:
      checks: read
      contents: read
      pull-requests: read
    uses: We-Amp/pagespeed-optimizer/.github/workflows/pipeline-pr.yml@main

  # The ci:full label is read when the pull request run starts (open, push,
  # reopen); after adding it, push or re-run to get the full tier.
  full:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.full) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    uses: We-Amp/pagespeed-optimizer/.github/workflows/pipeline-full.yml@main

  # Aggregate gate: the one check branch protection needs besides the
  # per-job ones. A called workflow cannot read needs.*.result of its
  # siblings, so this job runs inline, on a hosted label only.
  gate:
    name: CI gate
    needs: [pr, full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed pipeline succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "pipeline results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a pipeline finished with '${r}'"; exit 1 ;;
            esac
          done
