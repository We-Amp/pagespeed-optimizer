#
# Release caller: triggers and concurrency only. Two lanes, each a reusable
# workflow pinned to main (docs/ci/release.md):
#   * optimizer-v* tags -> pipeline-release-optimizer.yml (host packages)
#   * v* tags           -> pipeline-release-nuget.yml (the NuGet packages)
# `optimizer-v*` never matches `v*`, so a tag selects exactly one lane.
#
# Triggers:
#   * push of a tag                                -> REAL run
#   * workflow_dispatch { tag, dry_run: true  }    -> build + validate only
#   * workflow_dispatch { tag, dry_run: false }    -> REAL run
# A real run publishes from jobs in the protected `release` environment.

name: Release

on:
  push:
    tags: ['optimizer-v*', 'v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (optimizer-v1.16.0 for the host packages, v2.4.0 for the NuGet packages)'
        required: true
        type: string
      dry_run:
        description: 'Build + validate only: publish nothing and enter no protected environment. Default: true.'
        required: true
        type: boolean
        default: true
      auto_promote:
        description: 'NuGet lane: promote the draft GitHub release to published after the nuget.org push. Default: false.'
        required: false
        type: boolean
        default: false
      grype_severity:
        description: 'NuGet lane: grype fail-on severity. Default: medium.'
        required: false
        type: choice
        default: 'medium'
        options: ['negligible', 'low', 'medium', 'high', 'critical']
      allow_sbom_drift:
        description: 'NuGet lane: let a cosmetic SBOM --verify mismatch warn instead of fail. grype/VEX/license gates still apply.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialize runs per released ref (the dispatched tag, or the pushed tag):
# two real releases of one tag never race. A release always runs out.
concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  optimizer:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/optimizer-v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'optimizer-v'))
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: We-Amp/pagespeed-optimizer/.github/workflows/pipeline-release-optimizer.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    # Passed one by one, never `secrets: inherit`. Jobs in the `release`
    # environment read the environment's value of each.
    secrets:
      RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

  nuget:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    uses: We-Amp/pagespeed-optimizer/.github/workflows/pipeline-release-nuget.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      auto_promote: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_promote }}
      grype_severity: ${{ inputs.grype_severity || 'medium' }}
      allow_sbom_drift: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_sbom_drift }}
    # Passed one by one, never `secrets: inherit`. Jobs in the `release`
    # environment read the environment's value of each.
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
      CORP_DISPATCH_TOKEN: ${{ secrets.CORP_DISPATCH_TOKEN }}
      RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

  unsupported-tag:
    name: Unsupported tag
    if: >-
      !((github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/optimizer-v') || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'optimizer-v') || startsWith(inputs.tag, 'v'))))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "::error::'$REF_NAME' starts with neither optimizer-v nor v: no release lane applies"
          exit 1
