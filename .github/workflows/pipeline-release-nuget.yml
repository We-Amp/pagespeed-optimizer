              Set-Item -Path "env:$($Matches[1])" -Value $Matches[2]
            }
          }
          $env:PATH = "C:\msys64\usr\bin;C:\Program Files\NASM;$env:PATH"
          # A short output root keeps Windows paths under the length limit;
          # CI_WIN_BAZEL_OUTPUT_ROOT in the runner environment overrides it.
          $outRoot = $(if ($env:CI_WIN_BAZEL_OUTPUT_ROOT) { $env:CI_WIN_BAZEL_OUTPUT_ROOT } else { Join-Path $env:SystemDrive 'b' }) -replace '\\', '/'
          $startup = @("--output_user_root=$outRoot")
          $cacheArgs = @()
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted') { $cacheArgs += '--disk_cache=C:/bazel-disk' }
          if ($env:BAZEL_REMOTE_CACHE_URL) { $cacheArgs += "--remote_cache=$env:BAZEL_REMOTE_CACHE_URL" }
          bazelisk @startup test --vendor_dir=vendor --config=windows --config=opt --stamp @cacheArgs //test/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-release-tests-hosted:
    name: Windows Release Tests (hosted)
    needs: [ref-guard, windows-release-build-hosted]
    if: ${{ vars.FLEET_ENABLED != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 300
    env: *windows-env
    steps: *windows-test-steps

  # ---------------------------------------------------------------------
  # macOS arm64 (hosted).
  # ---------------------------------------------------------------------
  macos-release-build:
    name: macOS Release Build
    needs: [ref-guard, vendor, vendor-hosted]
    if: >-
      ${{ !cancelled() && needs.ref-guard.result == 'success'
      && (needs.vendor.result == 'success' || needs.vendor-hosted.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 300
    env: &macos-env
      RELEASE_SHA: ${{ needs.ref-guard.outputs.sha }}
      SHORT_SHA: ${{ needs.ref-guard.outputs.short_sha }}
    steps:
      - &macos-tools
        name: Ensure the build tools
        run: |
          set -euo pipefail
          for t in zstd gperf nasm; do
            command -v "$t" >/dev/null 2>&1 || brew install "$t"
          done
          command -v bazel >/dev/null 2>&1 || brew install bazelisk
          bazel --version

      - &macos-download
        name: Download the release source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source

      - &macos-extract
        name: Extract the release source
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          TARBALL="${RUNNER_TEMP}/release-source/pagespeed-optimizer-${SHORT_SHA}.tar.zst"
          zstd -d -T0 < "$TARBALL" | tar xf - -C "${GITHUB_WORKSPACE}"
          rm -f "$TARBALL"
          bash tools/ci/verify-artifacts.sh "$RELEASE_SHA" "stamp:${GITHUB_WORKSPACE}/GIT_COMMIT"

      - name: Build all targets + the NuGet binaries (release)
        run: |
          set -euo pipefail
          CACHE_FLAG="--remote_cache=${BAZEL_REMOTE_CACHE_URL:-}"
          COMMON=(--vendor_dir=vendor --config=ci-macos --config=opt --stamp "$CACHE_FLAG"
            '--copt=-DPAGESPEED_SERVER="aspnetcore"'
            '--copt=-DPAGESPEED_DISTRIBUTION="nuget"')
          bazel build "${COMMON[@]}" //...
          bazel build "${COMMON[@]}" //lib/pagespeed:libpagespeed.so //src/worker:factory_worker
          # The target is named .so; on macOS the output is a dylib.
          mkdir -p release-artifacts
          cp -L bazel-bin/lib/pagespeed/libpagespeed.so release-artifacts/libpagespeed.dylib
          cp -L bazel-bin/src/worker/factory_worker release-artifacts/factory_worker
          ls -lh release-artifacts/

      - name: Upload the NuGet native binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-osx-arm64
          path: release-artifacts/*
          retention-days: 7
          if-no-files-found: error

  macos-release-tests:
    name: macOS Release Tests
    # Starts with the build, not after it: the tests only consume
    # release-source and compile on their own runner.
    needs: [ref-guard, vendor, vendor-hosted]
    if: >-
      ${{ !cancelled() && needs.ref-guard.result == 'success'
      && (needs.vendor.result == 'success' || needs.vendor-hosted.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 300
    env: *macos-env
    steps:
      - *macos-tools
      - *macos-download
      - *macos-extract
      - name: Run unit tests
        run: |
          set -o pipefail
          bazel test --vendor_dir=vendor --config=ci-macos --config=opt --stamp \
            "--remote_cache=${BAZEL_REMOTE_CACHE_URL:-}" //test/... 2>&1 | tee "${RUNNER_TEMP}/bazel-test.log"
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        run: |
          [ -f "${RUNNER_TEMP}/bazel-test.log" ] || exit 0
          flaky=$(grep -E '^//.* FLAKY' "${RUNNER_TEMP}/bazel-test.log" | sed -E 's/ +/ /g' || true)
          if [ -n "$flaky" ]; then
            echo "::warning::Tests passed only on retry (FLAKY): $(echo "$flaky" | cut -d' ' -f1 | paste -sd' ' -)"
            { echo "### Flaky tests (passed on retry)"; echo '```'; echo "$flaky"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------
  # Sidecar: WeAmp.PageSpeed.Sidecar and WeAmp.PageSpeed.Sidecar.NativeAssets.Linux.
  # Their native pair (nginx, the module built against it and the launch
  # shim, per RID) is built, tested and signed in the mod_pagespeed module
  # release; their managed code is aspnetcore/ of that release's source
  # tarball. This job takes both from the release named by
  # tools/ci/sidecar-pin.json and verifies them (tools/ci/sidecar_fetch.sh):
  # the pinned sha256 of SHA256SUMS, SHA256SUMS.asc against
  # RELEASE-SIGNING-KEY.asc, the pinned sha256 of sidecar-pair.json, every
  # pair tarball and file against it and SHA256SUMS, and the source tarball
  # against SHA256SUMS. Never "latest", never a branch checkout of the module:
  # a mismatch fails the job and therefore the release. Then, in the same job
  # so no verified input crosses a job boundary: the xunit suite under .NET 8
  # and .NET 10, and the two packages at the version of the v<X> tag. The
  # pin, the script and the key come from main, never from the tree being
  # released, because the module release is cut after the v<X> commit.
  # Anonymous downloads; the job's read-only token goes to the API only.
  # ---------------------------------------------------------------------
  sidecar-pack:
    name: Sidecar packages (fetch, verify, test, pack)
    needs: ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.ref-guard.outputs.tag }}
      REAL_RUN: ${{ needs.ref-guard.outputs.real }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout main (pin, fetch script, published key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trust
          sparse-checkout: |
            tools/ci/sidecar-pin.json
            tools/ci/sidecar_fetch.sh
            tools/ci/release_checksums_sig.sh
            RELEASE-SIGNING-KEY.asc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # v<X> takes the sidecar of module-v<X>. A dry run may rehearse with
      # the pin as it is (the module release of a new version is cut after
      # the v<X> commit); a real run refuses any other tag.
      - name: The pin names this release's module tag
        run: |
          set -euo pipefail
          PIN_TAG="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("tag", ""))' trust/tools/ci/sidecar-pin.json)"
          WANT="module-${RELEASE_TAG}"
          if [ "$PIN_TAG" != "$WANT" ]; then
            if [ "$REAL_RUN" = true ]; then
              echo "::error::tools/ci/sidecar-pin.json on main pins '$PIN_TAG' but $RELEASE_TAG needs '$WANT'"
              exit 1
            fi
            echo "::warning::dry run: tools/ci/sidecar-pin.json pins '$PIN_TAG' but a release of $RELEASE_TAG needs '$WANT'; continuing with the pinned release"
          fi

      - name: Download and verify against the pin, then stage
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN=trust/tools/ci/sidecar-pin.json
          KEY=trust/RELEASE-SIGNING-KEY.asc
          bash trust/tools/ci/sidecar_fetch.sh fetch "$PIN" "${RUNNER_TEMP}/sidecar" "$KEY" | tee -a "$GITHUB_STEP_SUMMARY"
          bash trust/tools/ci/sidecar_fetch.sh stage "$PIN" "${RUNNER_TEMP}/sidecar" "$KEY" "${RUNNER_TEMP}/sidecar-work"

      # The keyring holds only the public key; removed anyway in case the
      # script's EXIT trap did not run.
      - name: Remove the temporary keyrings
        if: always()
        run: |
          for h in "${RUNNER_TEMP}"/gnupg.*; do
            [ -d "$h" ] || continue
            GNUPGHOME="$h" gpgconf --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf "$h"
          done

      # .NET 8 for the net8.0 test run, .NET 10 for net10.0 and the pack.
      - name: Ensure .NET 8 and .NET 10 SDKs
        run: |
          set -euo pipefail
          export PATH="$HOME/.dotnet:$PATH"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          curl -sSL --http1.1 -o "${RUNNER_TEMP}/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
          for c in 8.0 10.0; do
            dotnet --list-sdks 2>/dev/null | grep -q "^${c%.0}\." \
              || bash "${RUNNER_TEMP}/dotnet-install.sh" --channel "$c" --install-dir "$HOME/.dotnet"
          done
          dotnet --list-sdks

      # Locked restore (the test project's lock files). Every test must run
      # and pass; 201 is the floor the module lane holds the suite to. The
      # live nginx tier ran against this pair in the module release.
      - name: Test the sidecar (.NET 8 and .NET 10)
        working-directory: ${{ runner.temp }}/sidecar-work/aspnetcore
        run: |
          set -euo pipefail
          PROJ=WeAmp.PageSpeed.AspNetCore.Tests/WeAmp.PageSpeed.AspNetCore.Tests.csproj
          for fw in net8.0 net10.0; do
            props=()
            [ "$fw" = net8.0 ] || props=(-p:IncludeNet10=true)
            dotnet test "$PROJ" -c Release -f "$fw" -p:RestoreLockedMode=true ${props[@]+"${props[@]}"} \
              --results-directory "${RUNNER_TEMP}/sidecar-results" --logger "trx;LogFileName=sidecar-${fw}.trx"
            python3 -I - "${RUNNER_TEMP}/sidecar-results/sidecar-${fw}.trx" "$fw" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          c = next(e for e in ET.parse(sys.argv[1]).getroot().iter() if e.tag.endswith("}Counters"))
          total, executed, passed = (int(c.get(k, 0)) for k in ("total", "executed", "passed"))
          print("%s: %d of %d tests passed (%d executed)" % (sys.argv[2], passed, total, executed))
          if not (total >= 201 and passed == executed == total):
              sys.exit("::error::not every sidecar test ran and passed under %s" % sys.argv[2])
          PY
          done

      # The version is the v<X> tag's, as for the other five packages.
      - name: Pack the sidecar packages
        working-directory: ${{ runner.temp }}/sidecar-work/aspnetcore
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          OUT="${RUNNER_TEMP}/sidecar-nupkg"
          rm -rf "$OUT"
          for proj in WeAmp.PageSpeed.Sidecar.NativeAssets.Linux/WeAmp.PageSpeed.Sidecar.NativeAssets.Linux.csproj \
                      WeAmp.PageSpeed.AspNetCore/WeAmp.PageSpeed.AspNetCore.csproj; do
            dotnet pack "$proj" -c Release -o "$OUT" -p:IncludeNet10=true \
              -p:Version="$VERSION" -p:PackageVersion="$VERSION"
          done
          ls -lh "$OUT"
          bash "${GITHUB_WORKSPACE}/trust/tools/ci/sidecar_fetch.sh" check-packages \
            "${RUNNER_TEMP}/sidecar" "$OUT" "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the sidecar packages (input to package)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sidecar-nupkg-${{ needs.ref-guard.outputs.short_sha }}
          path: ${{ runner.temp }}/sidecar-nupkg/*.nupkg
          retention-days: 7
          if-no-files-found: error

      - name: Upload the test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sidecar-test-results-${{ needs.ref-guard.outputs.short_sha }}
          path: ${{ runner.temp }}/sidecar-results
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Package: the four native sets from workflow artifacts, five .nupkg,
  # plus the two sidecar .nupkg from sidecar-pack: seven in all. Waits for
  # sidecar-pack, so a sidecar that does not verify, test or pack stops the
  # release before anything is created.
  # One step list for the real run (inside the `release` environment: draft
  # release + notifications) and the dry run (no environment, no approval,
  # unsigned Windows binaries, nothing leaves the workflow).
  # ---------------------------------------------------------------------
  package:
    name: Package & Release
    needs: [ref-guard, security-gates, sidecar-pack, linux-release-tests, linux-release-tests-hosted, windows-release-tests, windows-release-tests-hosted, sign-windows, macos-release-build, macos-release-tests, linux-arm64-release-build, linux-arm64-release-tests]
    if: >-
      ${{ !cancelled() && needs.ref-guard.outputs.real == 'true'
      && needs.security-gates.result == 'success'
      && needs.sidecar-pack.result == 'success'
      && (needs.linux-release-tests.result == 'success' || needs.linux-release-tests-hosted.result == 'success')
      && (needs.windows-release-tests.result == 'success' || needs.windows-release-tests-hosted.result == 'success')
      && needs.sign-windows.result == 'success'
      && needs.macos-release-build.result == 'success'
      && needs.macos-release-tests.result == 'success'
      && needs.linux-arm64-release-build.result == 'success'
      && needs.linux-arm64-release-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      pull-requests: read
    env: &package-env
      RELEASE_SHA: ${{ needs.ref-guard.outputs.sha }}
      SHORT_SHA: ${{ needs.ref-guard.outputs.short_sha }}
      RELEASE_TAG: ${{ needs.ref-guard.outputs.tag }}
      REAL_RUN: ${{ needs.ref-guard.outputs.real }}
    steps: &package-steps
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ref-guard.outputs.sha }}
          persist-credentials: false

      - name: Ensure .NET 10 SDK
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          if dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then
            echo ".NET 10 SDK already installed"
          else
            curl -sSL --http1.1 -o "${RUNNER_TEMP}/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
            bash "${RUNNER_TEMP}/dotnet-install.sh" --channel 10.0
          fi
          dotnet --list-sdks

      - name: Download linux-x64 native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x64
          path: ${{ runner.temp }}/native/linux-x64
      - name: Download linux-arm64 native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-arm64
          path: ${{ runner.temp }}/native/linux-arm64
      - name: Download osx-arm64 native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-osx-arm64
          path: ${{ runner.temp }}/native/osx-arm64
      # A real run packs the signed Windows binaries; a dry run the unsigned
      # ones (signing happens only inside the environment).
      - name: Download win-x64 native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.ref-guard.outputs.real == 'true' && 'native-win-x64' || 'native-win-x64-unsigned' }}
          path: ${{ runner.temp }}/native/win-x64

      # Workflow artifacts drop POSIX mode bits, so the executables get +x
      # back here. BUILD_INFO.json matches build-native.sh:write_build_info.
      - name: Place the native binaries into the NativeAssets projects
        run: |
          set -euo pipefail
          SRC="${RUNNER_TEMP}/native"
          ASPNET="${GITHUB_WORKSPACE}/samples/aspnetcore/src"
          place() { # place <rid> <project> <file>...
            local rid="$1" proj="$2"; shift 2
            local dir="${ASPNET}/${proj}/runtimes/${rid}/native" f
            mkdir -p "$dir"
            for f in "$@"; do
              [ -s "${SRC}/${rid}/${f}" ] || { echo "::error::missing native binary ${rid}/${f}"; exit 1; }
              cp "${SRC}/${rid}/${f}" "${dir}/${f}"
            done
            cat > "${dir}/BUILD_INFO.json" <<JSON
          {
            "git_sha": "${RELEASE_SHA}",
            "git_sha_short": "${SHORT_SHA}",
            "build_timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "rid": "${rid}"
          }
          JSON
            echo "${rid}:"
            ls -lh "$dir"
          }
          place linux-x64 WeAmp.PageSpeed.NativeAssets.Linux libpagespeed.so factory_worker
          place linux-arm64 WeAmp.PageSpeed.NativeAssets.Linux libpagespeed.so factory_worker
          place win-x64 WeAmp.PageSpeed.NativeAssets.Windows pagespeed.dll factory_worker.exe
          place osx-arm64 WeAmp.PageSpeed.NativeAssets.macOS libpagespeed.dylib factory_worker
          chmod +x "${ASPNET}"/WeAmp.PageSpeed.NativeAssets.Linux/runtimes/linux-*/native/factory_worker \
                   "${ASPNET}"/WeAmp.PageSpeed.NativeAssets.macOS/runtimes/osx-arm64/native/factory_worker

      # This job runs on linux-x64, so only those binaries are executed and
      # loaded here; the other RIDs are stamped at build time and covered by
      # the matching-RID package smokes.
      - name: Verify linux-x64 native binaries match the release commit
        run: |
          D="${GITHUB_WORKSPACE}/samples/aspnetcore/src/WeAmp.PageSpeed.NativeAssets.Linux/runtimes/linux-x64/native"
          bash tools/ci/verify-artifacts.sh "$RELEASE_SHA" \
            "binary:${D}/factory_worker" \
            "sharedlib:${D}/libpagespeed.so"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # WeAmp.PageSpeed.AspNetCore embeds the /console/ SPA as manifest
      # resources. Build it out-of-band, then pack with WebShellSkipBuild.
      # api-client is built first: web-shell consumes it via workspace:*.
      # pnpm is pinned (pnpm 11 made ignored builds fatal).
      - name: Build workbench SPA (embedded /console/)
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$HOME/.npm-global"
          mkdir -p "$NPM_CONFIG_PREFIX/bin"
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
          npm install -g pnpm@10.33.4
          test "$(pnpm --version)" = "10.33.4"
          cd tools/workbench
          pnpm install --frozen-lockfile
          pnpm -C packages/api-client build
          pnpm -C packages/web-shell build
          ls -la packages/web-shell/dist/index.html

      # -p:Version overrides Directory.Build.props at pack time so the
      # packages always carry the tag's version.
      - name: Pack NuGet packages
        run: |
          set -euo pipefail
          cd samples/aspnetcore
          rm -rf nupkg
          VERSION="${RELEASE_TAG#v}"
          echo "Packing version: $VERSION"
          dotnet restore --source https://api.nuget.org/v3/index.json
          for p in Linux Windows macOS; do
            dotnet pack "src/WeAmp.PageSpeed.NativeAssets.${p}/WeAmp.PageSpeed.NativeAssets.${p}.csproj" \
              -o nupkg --no-build --no-restore -c Release -p:Version="$VERSION" -p:PackageVersion="$VERSION"
          done
          dotnet pack src/WeAmp.PageSpeed/WeAmp.PageSpeed.csproj \
            -o nupkg --no-restore -c Release -p:Version="$VERSION" -p:PackageVersion="$VERSION"
          dotnet pack src/WeAmp.PageSpeed.AspNetCore/WeAmp.PageSpeed.AspNetCore.csproj \
            -o nupkg --no-restore -c Release -p:Version="$VERSION" -p:PackageVersion="$VERSION" \
            -p:WebShellSkipBuild=true
          ls -lh nupkg/
          [ "$(find nupkg -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 5 ] || { echo "::error::expected 5 packages"; exit 1; }

      # Packed and checked by sidecar-pack; from here on the seven packages
      # take one path: the metadata guard, SHA256SUMS (and its signature),
      # the draft release and publish-nuget.
      - name: Download the sidecar packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-nupkg-${{ needs.ref-guard.outputs.short_sha }}
          path: samples/aspnetcore/nupkg

      - name: Expect seven packages
        run: |
          set -euo pipefail
          cd samples/aspnetcore/nupkg
          VERSION="${RELEASE_TAG#v}"
          ls -lh
          [ "$(find . -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 7 ] || { echo "::error::expected 7 packages"; exit 1; }
          for id in WeAmp.PageSpeed.Sidecar WeAmp.PageSpeed.Sidecar.NativeAssets.Linux; do
            [ -s "${id}.${VERSION}.nupkg" ] || { echo "::error::missing ${id}.${VERSION}.nupkg"; exit 1; }
          done

      # The packages carry no source-control metadata: no repository
      # url/commit/branch attributes and no SourceLink. A bare
      # `<repository type="git" />` (newer SDKs emit it from a git tree)
      # carries none and is allowed.
      - name: Guard against source-control metadata in the .nupkg files
        run: |
          set -euo pipefail
          cd samples/aspnetcore/nupkg
          leak=0
          for nupkg in *.nupkg; do
            nuspec=$(unzip -p "$nupkg" "*.nuspec" 2>/dev/null)
            if echo "$nuspec" | grep -qiE '<repository[^/]*(url|commit|branch)=|<sourceLink'; then
              echo "::error::source-control metadata in $nupkg:"
              echo "$nuspec" | grep -iE '<repository[^/]*(url|commit|branch)=|<sourceLink' || true
              leak=1
            fi
          done
          [ "$leak" = "0" ] || exit 1
          echo "OK: no source-control metadata in the packages."

      # A failed SPA build or a drifted EmbedWebShell glob would ship an
      # empty console and every install would answer 503 for /console/.
      - name: Guard against shipping an empty /console/ SPA
        run: |
          set -euo pipefail
          cd samples/aspnetcore/nupkg
          aspnet_nupkg=$(find . -maxdepth 1 -name 'WeAmp.PageSpeed.AspNetCore.*.nupkg' | head -1)
          STRINGS="${RUNNER_TEMP}/aspnet-dll.strings"
          unzip -p "$aspnet_nupkg" "lib/net10.0/WeAmp.PageSpeed.AspNetCore.dll" | strings -a > "$STRINGS"
          if ! grep -aFq 'WeAmp.PageSpeed.AspNetCore.Console/index.html' "$STRINGS"; then
            echo "::error::Embedded /console/ SPA missing from $aspnet_nupkg"
            exit 1
          fi
          echo "OK: embedded /console/ SPA present ($(grep -acF 'WeAmp.PageSpeed.AspNetCore.Console/' "$STRINGS") manifest entries)."

      # Real runs only. A draft that already exists for the tag is reused
      # (an operator may have created it by hand); otherwise it is created.
      # The SBOM and VEX ship next to the packages; SHA256SUMS lists all.
      - name: Create the draft GitHub release
        if: ${{ needs.ref-guard.outputs.real == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          LINE="$(printf '%s' "${TAG#v}" | cut -d. -f1,2)"
          case "$TAG" in
            v2.0.*) TITLE="ModPageSpeed 2.0 $TAG" ;;
            *)      TITLE="mod_pagespeed ${LINE} $TAG" ;;
          esac
          VERSION="${TAG#v}"
          ASSETS="${RUNNER_TEMP}/release-assets"
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp samples/aspnetcore/nupkg/*.nupkg "$ASSETS/"
          cp sbom/mod_pagespeed-2.1.spdx.json "$ASSETS/mod_pagespeed-${VERSION}.spdx.json"
          cp sbom/mod_pagespeed-2.1.vex.json "$ASSETS/mod_pagespeed-${VERSION}.vex.json"
          ( cd "$ASSETS" && sha256sum -- *.nupkg mod_pagespeed-"${VERSION}".spdx.json mod_pagespeed-"${VERSION}".vex.json > SHA256SUMS && sha256sum -c SHA256SUMS )
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "A draft release for $TAG exists; attaching the packages, SBOM, VEX and SHA256SUMS"
            # A signature from an earlier run would not match the new SHA256SUMS.
            gh release delete-asset "$TAG" SHA256SUMS.asc --yes 2>/dev/null || true
            gh release upload "$TAG" --clobber "$ASSETS"/*
          else
            gh release create "$TAG" --draft \
              --target "$RELEASE_SHA" \
              --title "$TITLE" \
              --generate-notes \
              "$ASSETS"/*
            echo "Draft release created: $TAG"
          fi

      # Real runs only: the input to sign-checksums.
      - name: Upload SHA256SUMS (input to sign-checksums)
        if: ${{ needs.ref-guard.outputs.real == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-sums-${{ needs.ref-guard.outputs.short_sha }}
          path: ${{ runner.temp }}/release-assets/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      - name: Upload the .nupkg artifact (input to publish-nuget)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nupkg-${{ needs.ref-guard.outputs.short_sha }}
          path: samples/aspnetcore/nupkg/*.nupkg
          retention-days: 7
          if-no-files-found: error

      # Real tag runs only. The target repositories come from repository
      # variables (RELEASE_BUMP_REPO, RELEASE_IMAGES_REPO); unset means
      # skip. Best effort: the release artifacts are the truth, a lagging
      # downstream is recoverable.
      - name: Dispatch the release-bump event
        if: ${{ needs.ref-guard.outputs.real == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CORP_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_BUMP_REPO }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_REPO" ]; then
            echo "::notice::RELEASE_BUMP_REPO not set: no release-bump dispatch"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_BUMP_REPO is set but CORP_DISPATCH_TOKEN is empty: the release-bump dispatch cannot be sent"
            exit 1
          fi
          PAYLOAD=$(jq -n \
            --arg line "2.0" \
            --arg tag "$RELEASE_TAG" \
            --arg released_on "$(date -u +%Y-%m-%d)" \
            --arg run_id "$RUN_ID" \
            --arg sha "$RELEASE_SHA" \
            '{event_type: "release-bump", client_payload: {line: $line, tag: $tag, released_on: $released_on, run_id: $run_id, sha: $sha}}')
          echo "$PAYLOAD" | jq .
          gh api "repos/${TARGET_REPO}/dispatches" --method POST --input - <<<"$PAYLOAD"
          echo "Dispatched release-bump for $RELEASE_TAG"

      # The container-image flow fetches docker-artifacts-<rid> from this
      # run (artifacts_repository + run_id) and builds, smokes and, behind
      # its own protected environment, publishes the images.
      - name: Dispatch the release-images event
        if: ${{ needs.ref-guard.outputs.real == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CORP_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ vars.RELEASE_IMAGES_REPO }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_REPO" ]; then
            echo "::notice::RELEASE_IMAGES_REPO not set: no release-images dispatch"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_IMAGES_REPO is set but CORP_DISPATCH_TOKEN is empty: the release-images dispatch cannot be sent"
            exit 1
          fi
          PAYLOAD=$(jq -n \
            --arg version "$RELEASE_TAG" \
            --arg sha "$RELEASE_SHA" \
            --arg source_tag "$RELEASE_TAG" \
            --arg source_sha "$RELEASE_SHA" \
            --arg artifacts_repository "$REPOSITORY" \
            --arg run_id "$RUN_ID" \
            '{event_type: "release-images", client_payload: {version: $version, sha: $sha, source_tag: $source_tag, source_sha: $source_sha, artifacts_repository: $artifacts_repository, run_id: $run_id, artifacts: ["docker-artifacts-linux-x64", "docker-artifacts-linux-arm64"]}}')
          echo "$PAYLOAD" | jq .
          gh api "repos/${TARGET_REPO}/dispatches" --method POST --input - <<<"$PAYLOAD"
          echo "Dispatched release-images for $RELEASE_TAG"

  package-dry-run:
    name: Package (dry run)
    needs: [ref-guard, security-gates, sidecar-pack, linux-release-tests, linux-release-tests-hosted, windows-release-tests, windows-release-tests-hosted, macos-release-build, macos-release-tests, linux-arm64-release-build, linux-arm64-release-tests]
    if: >-
      ${{ !cancelled() && needs.ref-guard.outputs.real != 'true'
      && needs.security-gates.result == 'success'
      && needs.sidecar-pack.result == 'success'
      && (needs.linux-release-tests.result == 'success' || needs.linux-release-tests-hosted.result == 'success')
      && (needs.windows-release-tests.result == 'success' || needs.windows-release-tests-hosted.result == 'success')
      && needs.macos-release-build.result == 'success'
      && needs.macos-release-tests.result == 'success'
      && needs.linux-arm64-release-build.result == 'success'
      && needs.linux-arm64-release-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *package-env
    steps: *package-steps

  # The release signing key lives in this one job, which holds no write
  # token. The signing script and the published public key come from main,
  # never from the tree being released.
  sign-checksums:
    name: Sign SHA256SUMS
    needs: [ref-guard, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Checkout main (signing script, published key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trust
          sparse-checkout: |
            tools/ci/release_checksums_sig.sh
            RELEASE-SIGNING-KEY.asc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sums-${{ needs.ref-guard.outputs.short_sha }}
          path: sums

      - name: Sign SHA256SUMS (detached, armored)
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash trust/tools/ci/release_checksums_sig.sh sign sums/SHA256SUMS signature/SHA256SUMS.asc

      # A fresh keyring holding only RELEASE-SIGNING-KEY.asc from main.
      - name: Verify SHA256SUMS.asc against the published release key
        run: |
          set -euo pipefail
          bash trust/tools/ci/release_checksums_sig.sh verify sums/SHA256SUMS signature/SHA256SUMS.asc trust/RELEASE-SIGNING-KEY.asc \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Belt and braces for the script's EXIT trap: a cancelled or killed
      # step skips it, and a leftover keyring on a persistent runner would
      # keep the private key on disk.
      - name: Remove the temporary keyrings
        if: always()
        run: |
          for h in "${RUNNER_TEMP}"/gnupg.*; do
            [ -d "$h" ] || continue
            GNUPGHOME="$h" gpgconf --kill gpg-agent >/dev/null 2>&1 || true
            rm -rf "$h"
          done

      - name: Upload the signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-signature-${{ needs.ref-guard.outputs.short_sha }}
          path: signature/SHA256SUMS.asc
          retention-days: 7
          if-no-files-found: error

  # Adds the signature to the draft, after checking that the draft's
  # SHA256SUMS is the file that was signed. Holds the write token, no key.
  attach-signature:
    name: Attach SHA256SUMS.asc to the draft release
    needs: [ref-guard, sign-checksums]
    if: ${{ !cancelled() && needs.sign-checksums.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sums-${{ needs.ref-guard.outputs.short_sha }}
          path: signed

      - name: Download the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signature-${{ needs.ref-guard.outputs.short_sha }}
          path: signed

      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ref-guard.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true \
            || { echo "::error::$TAG is not a draft release; the signature is attached to the draft only"; exit 1; }
          # Every asset on the draft, checked against the signed SHA256SUMS:
          # the draft must carry exactly the signed file and the files it
          # lists, intact (a stale SHA256SUMS.asc aside, which is replaced).
          rm -rf draft && mkdir draft
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir draft
          rm -f draft/SHA256SUMS.asc
          cmp -s draft/SHA256SUMS signed/SHA256SUMS \
            || { echo "::error::the draft's SHA256SUMS is not the file that was signed"; exit 1; }
          diff <(awk '{ sub(/^\*/, "", $2); print $2 }' signed/SHA256SUMS | LC_ALL=C sort) \
               <(find draft -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort) \
            || { echo "::error::the draft's assets differ from the files SHA256SUMS lists"; exit 1; }
          ( cd draft && sha256sum -c SHA256SUMS )
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber signed/SHA256SUMS.asc
          echo "Attached SHA256SUMS.asc to the draft release $TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  # nuget.org Trusted Publishing: NuGet/login exchanges this job's OIDC
  # token for a short-lived API key. The nuget.org policy names this
  # repository, the workflow file pipeline-release-nuget.yml (the token's
  # job_workflow_ref) and the environment `release` (docs/ci/release.md).
  publish-nuget:
    name: Publish to nuget.org (Trusted Publishing)
    needs: [ref-guard, package, attach-signature]
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.attach-signature.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Ensure .NET 10 SDK
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          if dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then
            echo ".NET 10 SDK already installed"
          else
            curl -sSL --http1.1 -o "${RUNNER_TEMP}/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
            bash "${RUNNER_TEMP}/dotnet-install.sh" --channel 10.0
          fi
          dotnet --list-sdks

      - name: Download the .nupkg artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg-${{ needs.ref-guard.outputs.short_sha }}
          path: nupkg

      - name: List packages
        run: ls -lh nupkg/

      # `user` is the nuget.org account that owns the reserved WeAmp.*
      # prefix and the Trusted Publishing policy.
      - name: Exchange the OIDC token for a nuget.org API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: modpagespeed

      # --skip-duplicate: re-running a release for a version already on
      # nuget.org is idempotent.
      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for pkg in nupkg/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          echo "All packages pushed to nuget.org."

  # Opt-in: by default the release stays a draft for human review.
  promote-release:
    name: Promote draft to published GitHub release
    needs: [ref-guard, publish-nuget]
    if: ${{ !cancelled() && needs.publish-nuget.result == 'success' && inputs.auto_promote == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ref-guard.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Promoted release $TAG to published."
