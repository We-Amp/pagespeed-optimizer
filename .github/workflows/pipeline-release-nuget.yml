#
# pipeline-release-nuget.yml -- the NuGet release lane (WeAmp.PageSpeed,
# WeAmp.PageSpeed.AspNetCore, the three WeAmp.PageSpeed.NativeAssets.*
# packages, and the sidecar packages WeAmp.PageSpeed.Sidecar and
# WeAmp.PageSpeed.Sidecar.NativeAssets.Linux), as a reusable workflow. The
# caller (release.yml) holds the triggers and the concurrency group; this
# file holds the jobs. See docs/ci/release.md and docs/ci/pipelines.md.
#
#   ref-guard (hosted)
#     -> vendor (fleet, or its hosted twin): source + vendor/ + GIT_COMMIT
#        as one tarball, passed to every consumer as a workflow artifact
#     -> security-gates (hosted): license headers, SBOM drift, grype + VEX
#     -> linux x64 build + tests (fleet, or hosted twins)
#     -> windows x64 build (fleet, or hosted twin): UNSIGNED binaries
#        -> sign-windows (hosted, `release` environment): Authenticode via
#           Trusted Signing, then the signed binaries are verified
#        -> windows tests (fleet, or hosted twin)
#     -> macOS arm64 build + tests (hosted)
#     -> linux arm64 build + tests (hosted)
#     -> sidecar-pack (hosted): the native pair and the source tarball of
#        the mod_pagespeed module release named by tools/ci/sidecar-pin.json,
#        verified against the pinned digests and the release signing key;
#        the sidecar tests (.NET 8 and 10) and the two sidecar .nupkg
#     -> package (hosted, `release` environment): the four native sets
#        from workflow artifacts, five .nupkg plus the two sidecar .nupkg,
#        draft GitHub release, the two
#        repository_dispatch notifications
#     -> sign-checksums (hosted, `release` environment): SHA256SUMS signed
#        with the release signing key, verified against the published key
#     -> attach-signature (hosted): SHA256SUMS.asc added to the draft
#     -> publish-nuget (hosted, `release` environment): nuget.org Trusted
#        Publishing (OIDC)
#     -> promote-release (hosted, `release` environment): draft ->
#        published, only when dispatched with auto_promote
#
# Real run: a push of a v* tag, or a dispatch with dry_run false. Dry run
# (a dispatch with dry_run true, the default): every build and test, the
# seven packages (with UNSIGNED Windows binaries) uploaded as a workflow
# artifact, and nothing else; no job enters the `release` environment, so
# a dry run needs no approval, creates no draft release, pushes nothing to
# nuget.org and dispatches nothing.
#
# Fleet jobs run on the fleet when FLEET_ENABLED is 'true' and on hosted
# twin jobs with identical steps otherwise, so the kill switch never blocks
# a release. Fleet jobs carry no secret and write nothing to GitHub.
# Optional runner-side facilities (remote Bazel cache) come from the runner
# environment (docs/ci/runner-environment.md); without them a job runs
# slower, never fails for that reason.

name: pipeline-release-nuget

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release (v<version>); empty on a tag push.
        type: string
        default: ''
      dry_run:
        description: Dispatch only. Build, test and pack; publish nothing. Ignored on a tag push.
        type: boolean
        default: true
      grype_severity:
        description: grype fail-on severity (negligible, low, medium, high, critical).
        type: string
        default: medium
      auto_promote:
        description: Promote the draft GitHub release after the nuget.org push.
        type: boolean
        default: false
      allow_sbom_drift:
        description: Let a cosmetic SBOM --verify mismatch warn instead of fail (dispatch only).
        type: boolean
        default: false
    # Declared per secret and passed explicitly by the caller. They are
    # environment secrets of `release`: a job that runs in that environment
    # reads the environment's value, which takes precedence over the value
    # the caller passed. None is required, so a dry run needs none of them.
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT:
        required: false
      AZURE_TRUSTED_SIGNING_PROFILE:
        required: false
      CORP_DISPATCH_TOKEN:
        required: false
      RELEASE_GPG_KEY:
        required: false
      RELEASE_GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

jobs:
  # Hosted, no secrets, read-only token; every later job chains to it. The
  # guard code is checked out from main, never from the tree being released.
  # A dispatch builds the dispatched tag, never the HEAD of the ref it ran
  # on; `ref`/`sha` are what every job checks out and stamps.
  ref-guard:
    name: Ref guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.guard.outputs.ref }}
      sha: ${{ steps.guard.outputs.sha }}
      tag: ${{ steps.mode.outputs.tag }}
      short_sha: ${{ steps.mode.outputs.short_sha }}
      real: ${{ steps.mode.outputs.real }}
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - name: Checkout main (guard code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none

      - id: guard
        uses: ./.github/actions/ref-guard
        with:
          tag-glob: 'v*'
          dispatch-tag: ${{ inputs.tag }}
          events: 'push workflow_dispatch'

      - name: Real run or dry run
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REF: ${{ steps.guard.outputs.ref }}
          SHA: ${{ steps.guard.outputs.sha }}
        run: |
          set -euo pipefail
          REAL=false
          if [ "$EVENT_NAME" = push ] || [ "$DRY_RUN_INPUT" = false ]; then
            REAL=true
          fi
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::the NuGet lane releases a v* tag, not '$REF'"; exit 1 ;;
          esac
          {
            echo "real=$REAL"
            echo "tag=${REF#refs/tags/}"
            echo "short_sha=${SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "tag=${REF#refs/tags/} sha=$SHA real=$REAL"

  # ---------------------------------------------------------------------
  # Vendor: one hermetic tree (source, vendor/, GIT_COMMIT) for every
  # platform, as the `release-source` workflow artifact.
  # ---------------------------------------------------------------------
  vendor:
    name: Vendor Dependencies
    needs: ref-guard
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ needs.ref-guard.outputs.sha }}
      RELEASE_TAG: ${{ needs.ref-guard.outputs.tag }}
      SHORT_SHA: ${{ needs.ref-guard.outputs.short_sha }}
    steps: &vendor-steps
      - name: Unlock stale vendored files
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true

      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ref-guard.outputs.ref }}

      - name: Verify the checkout is the release commit
        run: |
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "::error::checked-out HEAD $(git rev-parse HEAD) != release commit $RELEASE_SHA"; exit 1; }

      # The NuGet package version derives from the tag, the worker's
      # /v1/health version from VERSION.txt. Fail fast before any heavy build
      # when they disagree.
      - name: Verify VERSION.txt matches the release tag
        run: |
          set -euo pipefail
          EXPECTED="${RELEASE_TAG#v}"
          EXPECTED="${EXPECTED%%+*}"
          ACTUAL="$(tr -d '[:space:]' < VERSION.txt)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::VERSION.txt ($ACTUAL) != release tag ($RELEASE_TAG -> $EXPECTED). Bump VERSION.txt on main and tag the bump commit."
            exit 1
          fi
          echo "VERSION.txt=$ACTUAL matches release tag $RELEASE_TAG"

      - name: Ensure bazel
        run: |
          if command -v bazel >/dev/null 2>&1; then bazel --version; exit 0; fi
          npm install -g @bazel/bazelisk@1.28.1 2>/dev/null || sudo npm install -g @bazel/bazelisk@1.28.1
          bazel --version

      - name: Cache the Bazel repository cache (hosted)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/optimizer-bazel-repo
          key: optimizer-repo-cache-${{ hashFiles('MODULE.bazel', '.bazelversion', 'bazel/**', 'third_party/**') }}
          restore-keys: |
            optimizer-repo-cache-

      - name: Vendor all dependencies
        run: |
          bazel vendor --vendor_dir=vendor "--repository_cache=${HOME}/.cache/optimizer-bazel-repo" //...
          if [ -d vendor/cyclone ]; then
            echo "Cyclone commit: $(git -C vendor/cyclone rev-parse HEAD 2>/dev/null || echo 'not a git repo')"
          fi

      - name: Stamp GIT_COMMIT
        run: echo -n "$RELEASE_SHA" > GIT_COMMIT

      - name: Create the source tarball
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/release-source"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          TARBALL="${OUT}/pagespeed-optimizer-${SHORT_SHA}.tar.zst"
          tar --zstd --dereference --mode='u+w' -cf "$TARBALL" \
            --exclude='.git' \
            --exclude='bazel-*' \
            .
          zstd -t "$TARBALL"
          echo "Tarball: $(basename "$TARBALL") ($(du -h "$TARBALL" | cut -f1))"

      # Already zstd-compressed: no second compression pass.
      - name: Upload the source tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source/*.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  vendor-hosted:
    name: Vendor Dependencies (hosted)
    needs: ref-guard
    if: ${{ vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ needs.ref-guard.outputs.sha }}
      RELEASE_TAG: ${{ needs.ref-guard.outputs.tag }}
      SHORT_SHA: ${{ needs.ref-guard.outputs.short_sha }}
    steps: *vendor-steps

  # ---------------------------------------------------------------------
  # Release security gates: license headers (a tag can carry direct pushes
  # that bypassed review), SBOM freshness and SPDX 2.3 validity, grype on
  # the SBOM with the VEX statements applied. `package` depends on it.
  # ---------------------------------------------------------------------
  security-gates:
    name: Security Gates (SBOM + Grype + VEX)
    needs: ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRYPE_FAIL_ON: ${{ inputs.grype_severity || 'medium' }}
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ref-guard.outputs.sha }}

      # generate-sbom.py needs Python 3.11+ (datetime.UTC).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: License headers (defense-in-depth)
        run: tools/check-license-headers.sh --all

      # Operator escape hatch (dispatch only, default off): tolerate a
      # cosmetic SBOM-reproducibility mismatch. The grype/VEX/license gates
      # below still apply.
      - name: Regenerate SBOM (must match committed copy)
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_sbom_drift == true }}
        run: python3 tools/generate-sbom.py --verify

      - name: SPDX 2.3 structural sanity
        run: python3 tools/sbom/check-spdx-structure.py sbom/mod_pagespeed-2.1.spdx.json

      - name: VEX statements present + well-formed (OpenVEX)
        id: vex
        run: |
          set -euo pipefail
          python3 tools/ci/validate-vex.py sbom/
          shopt -s nullglob
          vex_files=(sbom/*.vex.json)
          if [ ${#vex_files[@]} -eq 0 ]; then
            echo "vex_path=" >> "$GITHUB_OUTPUT"
          else
            echo "vex_path=${vex_files[0]}" >> "$GITHUB_OUTPUT"
          fi

      # grype 0.108.0 or newer is required for VEX on an SBOM source; this
      # pin bundles 0.118.0.
      - name: Vulnerability scan (grype on SPDX SBOM)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: "sbom/mod_pagespeed-2.1.spdx.json"
          vex: ${{ steps.vex.outputs.vex_path }}
          severity-cutoff: ${{ env.GRYPE_FAIL_ON }}
          fail-build: true
          output-format: sarif

      - name: Upload SBOM + grype report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-sbom-and-cve-report-${{ needs.ref-guard.outputs.short_sha }}
          path: |
            sbom/mod_pagespeed-2.1.spdx.json
            sbom/*.vex.json
            ${{ steps.grype.outputs.sarif }}
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------
  # Linux builds. One step list for three jobs: x64 on the fleet, its hosted
  # twin, and arm64 hosted. Each uploads `native-<rid>` (the NuGet payload)
  # and `docker-artifacts-<rid>` (the container-image build inputs).
  # ---------------------------------------------------------------------
  linux-release-build:
    name: Linux Release Build
    needs: [ref-guard, vendor]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 90
    env: &linux-x64-env
      RELEASE_SHA: ${{ needs.ref-guard.outputs.sha }}
      SHORT_SHA: ${{ needs.ref-guard.outputs.short_sha }}
      RID: linux-x64
      IMAGE_ARCH: x64
      BAZEL_RELEASE_CONFIG: release
    steps: &linux-build-steps
      - name: Unlock and clear the workspace
        run: |
          [ -d "${GITHUB_WORKSPACE}" ] && chmod -R u+w "${GITHUB_WORKSPACE}" 2>/dev/null || true
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Download the release source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source

      - name: Extract the release source
        run: |
          set -euo pipefail
          TARBALL="${RUNNER_TEMP}/release-source/pagespeed-optimizer-${SHORT_SHA}.tar.zst"
          zstd -t "$TARBALL"
          tar --zstd -xf "$TARBALL" -C "${GITHUB_WORKSPACE}"
          rm -f "$TARBALL"
          bash tools/ci/verify-artifacts.sh "$RELEASE_SHA" "stamp:${GITHUB_WORKSPACE}/GIT_COMMIT"

      - name: Docker preflight
        run: tools/ci/docker-preflight.sh

      - name: Ensure the dev image
        run: |
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh "$IMAGE_ARCH" docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      # The remote cache is used only when the runner environment names it;
      # otherwise the trailing empty --remote_cache= disables the cache the
      # release config chains.
      - name: Remote cache settings
        run: |
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            echo "DOCKER_CACHE_HOST_ARG=--add-host=bazel-remote-cache:${BAZEL_CACHE_HOST}" >> "$GITHUB_ENV"
            echo "BAZEL_CACHE_FLAG=" >> "$GITHUB_ENV"
            echo "using the remote Bazel cache from the runner environment"
          else
            echo "DOCKER_CACHE_HOST_ARG=" >> "$GITHUB_ENV"
            echo "BAZEL_CACHE_FLAG=--remote_cache=" >> "$GITHUB_ENV"
            echo "::notice::BAZEL_CACHE_HOST not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi

      # The NuGet flavour: telemetry attribution copts, the same as
      # build-native.sh. libc++/libc++abi/libunwind are statically linked
      # into both binaries; there are no separate shared libraries to ship.
      - name: Build all targets + the NuGet binaries (release)
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB). A tag cut before the helper
          # existed has no such file: use the previous fixed values for it.
          if [ -f "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh" ]; then
            source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
            slot_budget 55g || exit 1
          else
            SLOT_JOBS='HOST_CPUS*.75' SLOT_CPUS='' SLOT_MEM=55g
          fi
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/release-artifacts"
          docker run --rm --init ${DOCKER_CACHE_HOST_ARG:+"$DOCKER_CACHE_HOST_ARG"} \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace \
            -e BAZEL_RELEASE_CONFIG -e BAZEL_CACHE_FLAG \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              OUT=/workspace/release-artifacts
              WORKER_COPTS=(
                "--copt=-DPAGESPEED_SERVER=\"aspnetcore\""
                "--copt=-DPAGESPEED_DISTRIBUTION=\"nuget\""
              )
              BAZEL="bazel --output_user_root=/tmp/bazel-out"
              $BAZEL build --vendor_dir=vendor "--config=${BAZEL_RELEASE_CONFIG}" ${BAZEL_CACHE_FLAG:+"$BAZEL_CACHE_FLAG"} \
                "${WORKER_COPTS[@]}" //...
              $BAZEL build --vendor_dir=vendor "--config=${BAZEL_RELEASE_CONFIG}" ${BAZEL_CACHE_FLAG:+"$BAZEL_CACHE_FLAG"} \
                "${WORKER_COPTS[@]}" \
                //lib/pagespeed:libpagespeed.so //src/worker:factory_worker
              bash tools/assert-binary-hardening.sh bazel-bin/lib/pagespeed/libpagespeed.so
              cp -L bazel-bin/lib/pagespeed/libpagespeed.so "$OUT/"
              cp -L bazel-bin/src/worker/factory_worker "$OUT/"
            '
          ls -lh "${GITHUB_WORKSPACE}/release-artifacts/"

      # Docker flavour for the public container images: the same vendored
      # release recipe WITHOUT the NuGet copts (the worker reports
      # server=nginx), plus the nginx module (a manual target) and the nginx
      # version it links against (the prebuilt image pins runtime nginx to
      # it).
      - name: Build the container-image artifacts
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB). A tag cut before the helper
          # existed has no such file: use the previous fixed values for it.
          if [ -f "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh" ]; then
            source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
            slot_budget 55g || exit 1
          else
            SLOT_JOBS='HOST_CPUS*.75' SLOT_CPUS='' SLOT_MEM=55g
          fi
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/docker-artifacts"
          docker run --rm --init ${DOCKER_CACHE_HOST_ARG:+"$DOCKER_CACHE_HOST_ARG"} \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace \
            -e BAZEL_RELEASE_CONFIG -e BAZEL_CACHE_FLAG \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              OUT=/workspace/docker-artifacts
              bazel --output_user_root=/tmp/bazel-out \
                build --vendor_dir=vendor "--config=${BAZEL_RELEASE_CONFIG}" ${BAZEL_CACHE_FLAG:+"$BAZEL_CACHE_FLAG"} \
                //src/worker:factory_worker //src/nginx:ngx_pagespeed_module.so
              bash tools/assert-binary-hardening.sh bazel-bin/src/nginx/ngx_pagespeed_module.so
              cp -L bazel-bin/src/worker/factory_worker "$OUT/"
              cp -L bazel-bin/src/nginx/ngx_pagespeed_module.so "$OUT/"
              ls -d /nginx-src/nginx-*/ | head -1 | sed "s#.*/nginx-##; s#/##" > "$OUT/nginx-version"
              echo "Recorded module nginx-version: $(cat "$OUT/nginx-version")"
            '
          ls -lh "${GITHUB_WORKSPACE}/docker-artifacts/"

      - name: Upload the NuGet native binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ env.RID }}
          path: release-artifacts/*
          retention-days: 7
          if-no-files-found: error

      - name: Upload the container-image artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-artifacts-${{ env.RID }}
          path: docker-artifacts/*
          retention-days: 30
          if-no-files-found: error

  linux-release-build-hosted:
    name: Linux Release Build (hosted)
    needs: [ref-guard, vendor-hosted]
    if: ${{ vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env: *linux-x64-env
    steps: *linux-build-steps

  linux-arm64-release-build:
    name: Linux arm64 Release Build
    needs: [ref-guard, vendor, vendor-hosted]
    if: >-
      ${{ !cancelled() && needs.ref-guard.result == 'success'
      && (needs.vendor.result == 'success' || needs.vendor-hosted.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env: &linux-arm64-env
      RELEASE_SHA: ${{ needs.ref-guard.outputs.sha }}
      SHORT_SHA: ${{ needs.ref-guard.outputs.short_sha }}
      RID: linux-arm64
      IMAGE_ARCH: arm64
      BAZEL_RELEASE_CONFIG: release-linux-arm64
    steps: *linux-build-steps

  # Linux unit tests, same three-way split.
  linux-release-tests:
    name: Linux Release Tests
    needs: [ref-guard, linux-release-build]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 60
    env: *linux-x64-env
    steps: &linux-test-steps
      - name: Unlock and clear the workspace
        run: |
          [ -d "${GITHUB_WORKSPACE}" ] && chmod -R u+w "${GITHUB_WORKSPACE}" 2>/dev/null || true
          find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Download the release source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source

      - name: Extract the release source
        run: |
          set -euo pipefail
          TARBALL="${RUNNER_TEMP}/release-source/pagespeed-optimizer-${SHORT_SHA}.tar.zst"
          zstd -t "$TARBALL"
          tar --zstd -xf "$TARBALL" -C "${GITHUB_WORKSPACE}"
          rm -f "$TARBALL"
          bash tools/ci/verify-artifacts.sh "$RELEASE_SHA" "stamp:${GITHUB_WORKSPACE}/GIT_COMMIT"

      - name: Docker preflight
        run: tools/ci/docker-preflight.sh

      - name: Ensure the dev image
        run: |
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh "$IMAGE_ARCH" docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB). A tag cut before the helper
          # existed has no such file: use the previous fixed values for it.
          if [ -f "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh" ]; then
            source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
            slot_budget 55g || exit 1
          else
            SLOT_JOBS='HOST_CPUS*.75' SLOT_CPUS='' SLOT_MEM=55g
          fi
          set -euo pipefail
          EXTRA_DOCKER=()
          CACHE_FLAG="--remote_cache="
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
            CACHE_FLAG=""
          fi
          docker run --rm --init ${EXTRA_DOCKER[@]+"${EXTRA_DOCKER[@]}"} \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bazel --output_user_root=/tmp/bazel-out \
              test --vendor_dir=vendor "--config=${BAZEL_RELEASE_CONFIG}" ${CACHE_FLAG:+"$CACHE_FLAG"} \
              //test/... //lib/pagespeed:pagespeed_test \
              //lib/image/vtracer_ffi:vtracer_ffi_test 2>&1 | tee "${RUNNER_TEMP}/bazel-test.log"
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        run: |
          [ -f "${RUNNER_TEMP}/bazel-test.log" ] || exit 0
          flaky=$(grep -E '^//.* FLAKY' "${RUNNER_TEMP}/bazel-test.log" | sed -E 's/ +/ /g' || true)
          if [ -n "$flaky" ]; then
            echo "::warning::Tests passed only on retry (FLAKY): $(echo "$flaky" | cut -d' ' -f1 | paste -sd' ' -)"
            { echo "### Flaky tests (passed on retry)"; echo '```'; echo "$flaky"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  linux-release-tests-hosted:
    name: Linux Release Tests (hosted)
    needs: [ref-guard, linux-release-build-hosted]
    if: ${{ vars.FLEET_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env: *linux-x64-env
    steps: *linux-test-steps

  linux-arm64-release-tests:
    name: Linux arm64 Release Tests
    # Starts with the build, not after it: the tests only consume
    # release-source and compile on their own runner.
    needs: [ref-guard, vendor, vendor-hosted]
    if: >-
      ${{ !cancelled() && needs.ref-guard.result == 'success'
      && (needs.vendor.result == 'success' || needs.vendor-hosted.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env: *linux-arm64-env
    steps: *linux-test-steps

  # ---------------------------------------------------------------------
  # Windows. The build produces UNSIGNED binaries (no secret on the fleet);
  # sign-windows signs them on a hosted runner inside the environment.
  # ---------------------------------------------------------------------
  windows-release-build:
    name: Windows Release Build
    needs: [ref-guard, vendor]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-windows' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 120
    env: &windows-env
      RELEASE_SHA: ${{ needs.ref-guard.outputs.sha }}
      SHORT_SHA: ${{ needs.ref-guard.outputs.short_sha }}
    steps: &windows-build-steps
      - name: Clear the workspace
        shell: powershell
        run: |
          Get-ChildItem -Force "$env:GITHUB_WORKSPACE" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Download the release source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source

      - name: Extract the release source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tarball = "$env:RUNNER_TEMP\release-source\pagespeed-optimizer-$env:SHORT_SHA.tar.zst"
          # Decompress with all cores, then extract with the Windows tar
          # (MSYS2's GNU tar reads a drive letter as a remote host).
          & zstd -d -f -T0 $tarball -o "$tarball.tar"
          if ($LASTEXITCODE -ne 0) { Write-Error "zstd decompression failed (exit $LASTEXITCODE)"; exit 1 }
          & "$env:SystemRoot\System32\tar.exe" xf "$tarball.tar" -C "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { Write-Error "tar extraction failed (exit $LASTEXITCODE)"; exit 1 }
          Remove-Item "$tarball", "$tarball.tar" -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE\tools\ci\verify-artifacts.ps1" `
            -Expected $env:RELEASE_SHA `
            -Specs "stamp:$env:GITHUB_WORKSPACE\GIT_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # BAZEL_SH from the runner environment when it names an existing
      # shell, else MSYS2, else Git for Windows. gperf and nasm are
      # installed only when missing.
      - name: Locate and install the build tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sh = $env:BAZEL_SH
          if (-not $sh -or -not (Test-Path $sh)) {
            $sh = @('C:\msys64\usr\bin\bash.exe', 'C:\Program Files\Git\bin\bash.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $sh) { Write-Error 'no bash for Bazel: set BAZEL_SH in the runner environment'; exit 1 }
          "BAZEL_SH=$sh" >> $env:GITHUB_ENV
          if (-not (Get-Command bazelisk -ErrorAction SilentlyContinue)) {
            npm install -g @bazel/bazelisk@1.28.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path C:\msys64\usr\bin\gperf.exe) -and -not (Get-Command gperf -ErrorAction SilentlyContinue)) {
            & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed gperf
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path "C:\Program Files\NASM\nasm.exe") -and -not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Cache the Bazel disk cache (hosted)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bazel-disk
          key: ${{ runner.os }}-x64-nuget-release-bazel-v1-${{ hashFiles('MODULE.bazel', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            ${{ runner.os }}-x64-nuget-release-bazel-v1-

      # The build reads PATH, INCLUDE and LIB (.bazelrc action_env), so it
      # runs inside the MSVC x64 developer environment. The compiler is
      # cl.exe: its response-file parser strips unescaped double quotes, so
      # the string copts escape them as \" to arrive as string literals.
      - name: Build all targets + the NuGet binaries (release)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Build Tools installs are products too: without -products * vswhere
          # reports nothing on a host that has only them, hence the fallback.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = $null
          if (Test-Path -LiteralPath $vswhere) {
            $vs = & $vswhere -latest -products * -property installationPath 2>$null
          }
          if (-not $vs -or -not (Test-Path -LiteralPath "$vs\VC\Auxiliary\Build\vcvars64.bat")) {
            $vs = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\2022\BuildTools'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Community'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Enterprise')
            ) | Where-Object { Test-Path -LiteralPath "$_\VC\Auxiliary\Build\vcvars64.bat" } | Select-Object -First 1
          }
          if (-not $vs) { Write-Host "::error::no Visual Studio installation found"; exit 1 }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          # Call the command interpreter by its full path: a bare `cmd` can
          # resolve to another program when a POSIX tools directory precedes
          # the system directory on PATH.
          & "$env:ComSpec" /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              Set-Item -Path "env:$($Matches[1])" -Value $Matches[2]
            }
          }
          $env:PATH = "C:\msys64\usr\bin;C:\Program Files\NASM;$env:PATH"
          # A short output root keeps Windows paths under the length limit;
          # CI_WIN_BAZEL_OUTPUT_ROOT in the runner environment overrides it.
          $outRoot = $(if ($env:CI_WIN_BAZEL_OUTPUT_ROOT) { $env:CI_WIN_BAZEL_OUTPUT_ROOT } else { Join-Path $env:SystemDrive 'b' }) -replace '\\', '/'
          $startup = @("--output_user_root=$outRoot")
          $cacheArgs = @()
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted') { $cacheArgs += '--disk_cache=C:/bazel-disk' }
          if ($env:BAZEL_REMOTE_CACHE_URL) {
            Write-Host 'using the remote Bazel cache from the runner environment'
            $cacheArgs += "--remote_cache=$env:BAZEL_REMOTE_CACHE_URL"
          }
          $common = @('--vendor_dir=vendor', '--config=windows', '--config=opt', '--stamp') + $cacheArgs + @(
            '--copt=-DPAGESPEED_SERVER=\"aspnetcore\"',
            '--copt=-DPAGESPEED_DISTRIBUTION=\"nuget\"')
          bazelisk @startup build @common -- //lib/... //src/... //test/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bazelisk @startup build @common //lib/pagespeed:libpagespeed.so //src/worker:factory_worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = (bazelisk @startup info @common bazel-bin).Trim()
          $dll = "$bin\lib\pagespeed\libpagespeed.so"
          if (-not (Test-Path $dll)) { $dll = "$bin\lib\pagespeed\libpagespeed.dll" }
          New-Item -ItemType Directory -Force -Path unsigned-output | Out-Null
          Copy-Item $dll unsigned-output\pagespeed.dll -Force
          Copy-Item "$bin\src\worker\factory_worker.exe" unsigned-output\factory_worker.exe -Force
          Get-ChildItem unsigned-output | ForEach-Object { Set-ItemProperty $_.FullName -Name IsReadOnly -Value $false }

      # What ships must start on a stock Windows Server (no Visual C++
      # runtime).
      - name: The binaries need no Visual C++ runtime
        shell: powershell
        run: |
          & tools\ci\check-no-vc-runtime.ps1 -Binaries unsigned-output\factory_worker.exe,unsigned-output\pagespeed.dll
          exit $LASTEXITCODE

      - name: Upload the unsigned Windows binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-win-x64-unsigned
          path: unsigned-output/*
          retention-days: 7
          if-no-files-found: error

  windows-release-build-hosted:
    name: Windows Release Build (hosted)
    needs: [ref-guard, vendor-hosted]
    if: ${{ vars.FLEET_ENABLED != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 330
    env: *windows-env
    steps: *windows-build-steps

  # Authenticode signing with Microsoft Trusted Signing (signtool + the
  # Trusted Signing dlib). Hosted, real runs only, inside the `release`
  # environment, which holds the six AZURE_* secrets. The outer .nupkg files
  # are not signed: nuget.org does not accept Trusted Signing certificates
  # for package signing; the embedded binaries are what SmartScreen,
  # antivirus and the Windows loader check.
  sign-windows:
    name: Sign Windows binaries
    needs: [ref-guard, windows-release-build, windows-release-build-hosted]
    if: >-
      ${{ !cancelled() && needs.ref-guard.outputs.real == 'true'
      && (needs.windows-release-build.result == 'success' || needs.windows-release-build-hosted.result == 'success') }}
    runs-on: windows-2022
    timeout-minutes: 20
    environment: release
    env:
      RELEASE_SHA: ${{ needs.ref-guard.outputs.sha }}
    steps:
      - name: Checkout the verification helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ref-guard.outputs.sha }}
          persist-credentials: false
          sparse-checkout: tools/ci
          sparse-checkout-cone-mode: false

      - name: Download the unsigned Windows binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win-x64-unsigned
          path: signed-output

      - name: Authenticode-sign (Microsoft Trusted Signing)
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($n in @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'TRUSTED_SIGNING_ENDPOINT', 'TRUSTED_SIGNING_ACCOUNT', 'TRUSTED_SIGNING_PROFILE')) {
            if (-not [Environment]::GetEnvironmentVariable($n)) { Write-Error "secret for $n is not set in the release environment (docs/ci/release.md)"; exit 1 }
          }
          $dlibDir = "$env:RUNNER_TEMP\TrustedSigning"
          New-Item -ItemType Directory -Path $dlibDir -Force | Out-Null
          $nupkg = "$dlibDir\Microsoft.Trusted.Signing.Client.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client/1.0.53" -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath $dlibDir -Force
          $dlib = "$dlibDir\bin\x64\Azure.CodeSigning.Dlib.dll"
          $metadata = @{
            Endpoint = $env:TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
            CertificateProfileName = $env:TRUSTED_SIGNING_PROFILE
            CorrelationId = [guid]::NewGuid().ToString()
          } | ConvertTo-Json
          $metadataFile = "$env:RUNNER_TEMP\tsmetadata.json"
          Set-Content -Path $metadataFile -Value $metadata
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          Write-Host "Using signtool: $($signtool.FullName)"
          foreach ($file in @("signed-output\pagespeed.dll", "signed-output\factory_worker.exe")) {
            Set-ItemProperty $file -Name IsReadOnly -Value $false
            Write-Host "Signing $file"
            & $signtool.FullName sign /v /fd SHA256 `
              /tr "http://timestamp.acs.microsoft.com" /td SHA256 `
              /dlib $dlib /dmdf $metadataFile `
              $file
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on $file with exit $LASTEXITCODE"; exit 1 }
          }

      # Consume what was signed: a valid signature by exactly the We-Amp B.V.
      # identity of the Trusted Signing profile on both files (a signature
      # Windows calls Valid but that names anyone else, for example a
      # misconfigured profile or another tenant's, fails), and both still
      # load and report the release commit on a stock hosted Windows image.
      - name: Verify the signed binaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ExpectedSubject = 'CN=We-Amp B.V., O=We-Amp B.V., L=Castricum, C=NL'
          foreach ($file in @("signed-output\pagespeed.dll", "signed-output\factory_worker.exe")) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid') { Write-Error "$file signature status: $($sig.Status)"; exit 1 }
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '<no signer certificate>' }
            if ($subject -cne $ExpectedSubject) { Write-Error "$file is signed by '$subject', expected '$ExpectedSubject'"; exit 1 }
            Write-Host "$file signed by: $subject"
          }
          & tools\ci\check-no-vc-runtime.ps1 -Binaries signed-output\factory_worker.exe,signed-output\pagespeed.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tools\ci\verify-artifacts.ps1 -Expected $env:RELEASE_SHA `
            -Specs "binary:signed-output\factory_worker.exe","sharedlib:signed-output\pagespeed.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the signed Windows binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-win-x64
          path: signed-output/*
          retention-days: 7
          if-no-files-found: error

  # The Windows unit tests run on the source tree (the same tarball the
  # build used), so they do not wait for signing.
  windows-release-tests:
    name: Windows Release Tests
    needs: [ref-guard, windows-release-build]
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'windows-2022' || 'fleet-windows' }}
    if: ${{ vars.FLEET_ENABLED == 'true' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
