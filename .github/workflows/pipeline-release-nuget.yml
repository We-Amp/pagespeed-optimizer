          }

      - name: Restore the Bazel disk cache (hosted)
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
