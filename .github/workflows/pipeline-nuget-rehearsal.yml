#
# pipeline-nuget-rehearsal.yml -- everything `publish-nuget` does except the
# push, as a reusable workflow (caller: nuget-rehearsal.yml).
#
# It takes the seven .nupkg files a release run produced (the `nupkg-<sha>`
# artifact of a Release run, or the assets of a published release), runs the
# same checks the release lane's `package` job runs plus the rehearsal-only
# ones (tools/ci/nupkg_checks.sh), pushes them to a throwaway folder feed
# twice with --skip-duplicate, restores a consumer project from that feed
# and reads nuget.org to see which id/version pairs already exist.
#
# Structurally keyless: no job names an environment, nothing here reads a
# secret (the read-only workflow token is `github.token`), no job asks for
# id-token, and nuget.org is only ever read. The caller passes no secret.
# tools/ci/test_nuget_rehearsal_keyless.sh asserts all of it on every PR.

name: pipeline-nuget-rehearsal

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        default: ''
      release_tag:
        type: string
        default: ''
      version:
        type: string
        required: true
      windows_binaries:
        type: string
        default: report
      expect_new:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  rehearsal:
    name: Rehearse the nuget.org publish (no key, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The checks come from main, never from the tree being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Ensure .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Fetch the packages
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_ID" ] && [ -n "$RELEASE_TAG" ]; then echo "::error::give run_id or release_tag, not both"; exit 1; fi
          if [ -z "$RUN_ID" ] && [ -z "$RELEASE_TAG" ]; then echo "::error::give run_id or release_tag"; exit 1; fi
          rm -rf nupkg && mkdir nupkg
          if [ -n "$RUN_ID" ]; then
            case "$RUN_ID" in *[!0-9]*) echo "::error::run_id must be a number"; exit 1;; esac
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            [ "$(printf '%s' "$run" | jq -r '.path')" = ".github/workflows/release.yml" ] \
              || { echo "::error::run ${RUN_ID} is not a Release workflow run"; exit 1; }
            [ "$(printf '%s' "$run" | jq -r '.status')" = completed ] \
              || { echo "::error::run ${RUN_ID} has not completed"; exit 1; }
            names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --paginate \
              --jq '.artifacts[] | select((.name | startswith("nupkg-")) and (.expired | not)) | .name')"
            # exactly one nupkg-<sha> artifact; jq -e is not used (jq 1.6 exits 0 on empty input)
            [ -n "$names" ] && [ "$(printf '%s\n' "$names" | wc -l)" -eq 1 ] \
              || { echo "::error::run ${RUN_ID} needs exactly one unexpired nupkg-<sha> artifact, found: ${names:-none}"; exit 1; }
            echo "Run ${RUN_ID}: head $(printf '%s' "$run" | jq -r '.head_sha'), conclusion $(printf '%s' "$run" | jq -r '.conclusion'), artifact ${names}"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$names" -D nupkg
          else
            case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "::error::release_tag must look like v<version>"; exit 1;; esac
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.nupkg' --dir nupkg
          fi
          ls -lh nupkg

      - name: Offline checks (shared with the release lane)
        env:
          VERSION: ${{ inputs.version }}
          WINDOWS_BINARIES: ${{ inputs.windows_binaries }}
        run: tools/ci/nupkg_checks.sh offline nupkg "$VERSION" "$WINDOWS_BINARIES"

      - name: Local feed push (twice, --skip-duplicate) and consumer restore
        run: tools/ci/nupkg_checks.sh local-feed nupkg "${RUNNER_TEMP}/rehearsal"

      - name: Read-only look at nuget.org
        env:
          NUGET_ORG_EXPECT: ${{ inputs.expect_new && 'new' || 'report' }}
        run: tools/ci/nupkg_checks.sh nuget-org nupkg
