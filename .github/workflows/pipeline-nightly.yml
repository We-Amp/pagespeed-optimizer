            -v "$DOCKER_BIN":/usr/bin/docker:ro \
            -v "$COMPOSE_PLUGIN":/usr/local/lib/docker/cli-plugins/docker-compose:ro \
            python:3.12-slim \
            bash -c "export PATH=/tmp/.local/bin:\$PATH && pip install -q pytest==9.1.1 requests==2.34.2 && pytest tests/ -v --tb=short -p no:cacheprovider"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f tools/production-tests/docker-compose.yml -f tools/production-tests/docker-compose.prebuilt.yml logs --no-color --tail=400 worker nginx 2>/dev/null || docker compose -f tools/production-tests/docker-compose.yml -f tools/production-tests/docker-compose.prebuilt.yml logs --no-color --tail=400 || true
          # The nginx error log is written to a file inside the container, not to stderr.
          docker compose -f tools/production-tests/docker-compose.yml -f tools/production-tests/docker-compose.prebuilt.yml exec -T nginx sh -c 'tail -n 200 /var/log/nginx/error.log' || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/production-tests/docker-compose.yml \
            -f tools/production-tests/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

  realworld-tests-x64:
    name: Real-World Proxy (x64)
    needs: periodic-build-x64
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 60
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several runner slots share one host and every stack publishes fixed
      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-x64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-x64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Build Docker images (prebuilt)
        run: |
          docker compose -f tools/realworld-tests/docker-compose.yml \
            -f tools/realworld-tests/docker-compose.prebuilt.yml build

      - name: Start real-world stack
        run: |
          docker compose -f tools/realworld-tests/docker-compose.yml \
            -f tools/realworld-tests/docker-compose.prebuilt.yml up -d --no-build
          # Wait for nginx (local /health, no upstream dependency).
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:${REALWORLD_NGINX_PORT:-8083}/health" >/dev/null 2>&1 && break
            sleep 2
          done
          # Wait for go-httpbin to be reachable THROUGH nginx. The go-httpbin
          # image is distroless (no shell/wget), so it cannot run a container
          # healthcheck for depends_on: service_healthy; gate readiness here
          # instead so tests don't start before the upstream is serving.
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:${REALWORLD_NGINX_PORT:-8083}/httpbin/status/200" >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Run real-world proxy tests
        run: |
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -e "NGINX_URL=http://localhost:${REALWORLD_NGINX_PORT:-8083}" \
            -e "WORKER_API_URL=http://localhost:${REALWORLD_WORKER_PORT:-9882}" \
            -v "$PWD":/repo -w /repo/tools/realworld-tests \
            python:3.12-slim \
            bash -c "export PATH=/tmp/.local/bin:\$PATH && pip install -q pytest==9.1.1 requests==2.34.2 && pytest -v --tb=short -p no:cacheprovider"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f tools/realworld-tests/docker-compose.yml -f tools/realworld-tests/docker-compose.prebuilt.yml logs --no-color --tail=400 worker nginx 2>/dev/null || docker compose -f tools/realworld-tests/docker-compose.yml -f tools/realworld-tests/docker-compose.prebuilt.yml logs --no-color --tail=400 || true
          # The nginx error log is written to a file inside the container, not to stderr.
          docker compose -f tools/realworld-tests/docker-compose.yml -f tools/realworld-tests/docker-compose.prebuilt.yml exec -T nginx sh -c 'tail -n 200 /var/log/nginx/error.log' || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/realworld-tests/docker-compose.yml \
            -f tools/realworld-tests/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

  e2e-tests-x64:
    name: E2E Tests (x64)
    needs: periodic-build-x64
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 20
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several runner slots share one host and every stack publishes fixed
      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-x64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-x64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Generate test fixtures
        run: tools/generate-test-fixtures.sh

      - name: Build Docker images (prebuilt)
        run: |
          docker compose -f tools/e2e/docker-compose.yml \
            -f tools/e2e/docker-compose.prebuilt.yml build

      - name: Ensure no leftover containers
        run: |
          docker compose -f tools/e2e/docker-compose.yml \
            -f tools/e2e/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

      - name: Start services
        run: |
          docker compose -f tools/e2e/docker-compose.yml \
            -f tools/e2e/docker-compose.prebuilt.yml up -d

      - name: Wait for services
        run: |
          echo "Waiting for services (timeout 120s)..."
          E2E_PORT="${E2E_NGINX_PORT:-8083}"
          deadline=$((SECONDS + 120))
          while [ $SECONDS -lt $deadline ]; do
            HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" "http://localhost:${E2E_PORT}/" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "Nginx ready after $((SECONDS))s (HTTP $HTTP_CODE)"
              break
            fi
            [ $((SECONDS % 10)) -lt 2 ] && echo "Still waiting... (HTTP $HTTP_CODE, ${SECONDS}s elapsed)"
            sleep 2
          done
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::Nginx not ready after 120s - dumping nginx logs."
            docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml ps
            NGINX_LOG="$(docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml logs --no-color --tail=200 nginx 2>&1)"
            echo "--- docker compose logs nginx (last 200) ---"
            echo "$NGINX_LOG"
            if echo "$NGINX_LOG" | grep -q 'module.*version'; then
              echo "::error::nginx ABI skew detected (module vs runtime NGINX_VERSION_NUM): $(echo "$NGINX_LOG" | grep -m1 'module.*version')"
            fi
            exit 1
          fi
          # Worker readiness gate: poll /v1/health until it answers 200 with
          # ready=true (a 200 without a `ready` field also counts).
          deadline=$((SECONDS + 60))
          WORKER_READY=False
          while [ $SECONDS -lt $deadline ]; do
            WORKER_READY=$(curl -sf "http://localhost:${E2E_WORKER_PORT:-9881}/v1/health" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(bool(d.get('ready', True)))" 2>/dev/null || echo "False")
            if [ "$WORKER_READY" = "True" ]; then
              echo "Worker ready"
              break
            fi
            sleep 1
          done
          if [ "$WORKER_READY" != "True" ]; then
            echo "WARNING: Worker not ready after 60s - E2E HIT tests may fail"
            echo "--- Worker health endpoint (full response) ---"
            curl -sf "http://localhost:${E2E_WORKER_PORT:-9881}/v1/health" 2>/dev/null | python3 -m json.tool 2>/dev/null || echo "(no response)"
            echo "--- Container status ---"
            docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml ps
            echo "--- Worker logs (last 100 lines) ---"
            docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml logs --tail=100 worker
            echo "--- Nginx logs (last 50 lines) ---"
            docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml logs --tail=50 nginx
          fi

      - name: Run E2E tests
        run: |
          # Stage a Linux CLI + compose plugin where the DAEMON can bind-mount them
          # (copies host binaries on Linux, downloads static builds on macOS; see the script).
          eval "$(tools/ci/stage-docker-cli.sh)"
          DOCKER_GID="$(stat -c '%g' /var/run/docker.sock 2>/dev/null || stat -f '%g' /var/run/docker.sock 2>/dev/null || echo 0)"
          case "$DOCKER_GID" in ''|*[!0-9]*) DOCKER_GID=0 ;; esac
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" --group-add "$DOCKER_GID" --group-add 0 -e HOME=/tmp \
            -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -v "$PWD":/repo -w /repo/tools/e2e \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$DOCKER_BIN":/usr/bin/docker:ro \
            -v "$COMPOSE_PLUGIN":/usr/local/lib/docker/cli-plugins/docker-compose:ro \
            -e E2E_NO_LIFECYCLE=1 \
            -e "NGINX_URL=http://localhost:${E2E_NGINX_PORT:-8083}" \
            -e "ORIGIN_URL=http://localhost:${E2E_ORIGIN_PORT:-8082}" \
            -e "WORKER_API_URL=http://localhost:${E2E_WORKER_PORT:-9881}" \
            python:3.12-slim \
            bash -c "export PATH=/tmp/.local/bin:\$PATH && pip install -q -r requirements.txt && \
              pytest test_user_stories.py test_configuration.py \
                -v --tb=short --junitxml=results.xml"

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/e2e/docker-compose.yml \
            -f tools/e2e/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

  # The daemon privilege rig's long-idle browser soak. The per-pull-request
  # rig matrix cannot catch a syscall with a minutes-scale period (the
  # browser's memory-info spike fires every few minutes); idling a sandboxed
  # browser under the enforcing profile for at least two spike periods and
  # asserting zero kills closes that blind spot, and a window that long is a
  # nightly cadence. One distro: the question is the profile, not the systemd
  # matrix.
  daemon-rig-soak-x64:
    name: Daemon Privilege Rig Soak (debian12, x64)
    needs: periodic-build-x64
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 60
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm the checkout is this run's tree
        run: |
          set -euo pipefail
          HEAD_SHA="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::checkout is $HEAD_SHA but this run is $GITHUB_SHA"
            exit 1
          fi
          echo "checkout verified at $HEAD_SHA"

      - name: Docker preflight
        run: tools/ci/docker-preflight.sh

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-x64
          path: ${{ runner.temp }}/bundle

      - name: Stage the daemon artifacts
        run: |
          set -euo pipefail
          ART="${GITHUB_WORKSPACE}/.rig-artifacts"
          rm -rf "$ART"; mkdir -p "$ART"
          install -m 0755 "${RUNNER_TEMP}/bundle/factory_worker" "$ART/factory_worker"
          install -m 0755 "${RUNNER_TEMP}/bundle/libpagespeed.so" "$ART/libpagespeed.so"
          ls -lh "$ART"

      - name: Verify the artifacts are this run's build
        run: |
          tools/ci/verify-artifacts.sh "$GITHUB_SHA" \
            "binary:${GITHUB_WORKSPACE}/.rig-artifacts/factory_worker" \
            "sharedlib:${GITHUB_WORKSPACE}/.rig-artifacts/libpagespeed.so"

      # Two observed spike periods are about 8 minutes (measured spikes are
      # exactly 240 seconds apart); 570 seconds covers two with margin.
      - name: Package-install verification with the browser soak (debian12)
        env:
          H6_SOAK_SECONDS: "570"
        run: |
          bash tools/packaging/daemon-install-rig.sh \
            --distro debian12 \
            --binary "${GITHUB_WORKSPACE}/.rig-artifacts/factory_worker" \
            --library "${GITHUB_WORKSPACE}/.rig-artifacts/libpagespeed.so" \
            --work "${GITHUB_WORKSPACE}/.rig-work-soak"

      - name: Clean up rig scratch
        if: always()
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" alpine \
            rm -rf /workspace/.rig-work-soak /workspace/.rig-artifacts \
            || rm -rf "${GITHUB_WORKSPACE}/.rig-work-soak" \
                      "${GITHUB_WORKSPACE}/.rig-artifacts" || true

  # ---------------------------------------------------------------------
  # Async-CSS rendered probe: the nightly half of the async-CSS lane. The
  # markup lane proves the optimizer emits the right bytes for a deferred
  # stylesheet; this one renders the served page in a real browser and
  # measures the fold. ADVISORY: it never hard-fails on findings. The signal
  # is one tracking issue (label async-css-probe-finding), opened or
  # refreshed while findings exist and closed by the next clean run, plus
  # the evidence artifact. The fleet job only produces the artifact; the
  # hosted report job below touches the issue.
  # ---------------------------------------------------------------------
  async-css-probe-rendered:
    name: Async-CSS rendered probe (advisory)
    needs: periodic-build-x64
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-light' }}
    timeout-minutes: 45
    env:
      # A plain name, joined onto RUNNER_TEMP in each step.
      PROBE_OUT_SUBDIR: async-css-probe-out
      # The worker configuration this lane measures, recorded in the findings
      # file so the issue says so. It is not a configuration that ships.
      PROBE_WORKER_ARGV: "--unsafe-force-async-css --async-css-min-coverage 0.95"
      # Pinned: a pixel comparison whose browser drifts under it produces
      # diffs that read as product regressions.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble
      PLAYWRIGHT_DEPS: playwright@1.58.2 pngjs@7
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several runner slots share one host and every stack publishes fixed
      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Docker preflight
        run: tools/ci/docker-preflight.sh

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-x64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-x64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      # Run-unique compose identity so two runs on one docker host cannot
      # share containers, volumes or ports.
      - name: Resolve compose identity and scratch dir
        run: |
          set -euo pipefail
          PORT_BASE=$(( 8300 + (GITHUB_RUN_ID % 300) * 2 ))
          {
            echo "COMPOSE_PROJECT_NAME=async-css-probe-${GITHUB_RUN_ID}"
            echo "PROBE_NGINX_PORT=${PORT_BASE}"
            echo "PROBE_ORIGIN_PORT=$(( PORT_BASE + 1 ))"
          } >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/${PROBE_OUT_SUBDIR}"

      # The rendered lane measures the DEFERRED page, so the stack runs in
      # the forced mode: the fixture's deferral must not depend on whatever
      # the sufficiency gate decides on the day.
      - name: Start stack (forced deferral)
        env:
          ASYNC_CSS_PROBE_FORCE: "1"
          PAGESPEED_ASYNC_CSS_MIN_COVERAGE: "0.95"
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f tools/async-css-probe/docker-compose.yml -f tools/async-css-probe/docker-compose.prebuilt.yml"
          $COMPOSE down --remove-orphans -v 2>/dev/null || true
          $COMPOSE build
          $COMPOSE up -d
          # Readiness gates on nginx still running plus a real HTTP status
          # from the fixture's stylesheet, never from the page under test.
          deadline=$((SECONDS + 180))
          while [ $SECONDS -lt $deadline ]; do
            NGINX_RUNNING=$($COMPOSE ps --status=running --services 2>/dev/null | grep -c '^nginx$' || true)
            if [ "$NGINX_RUNNING" = "0" ]; then
              echo "::error::nginx container is not running."
              $COMPOSE ps -a
              $COMPOSE logs --tail=100
              exit 1
            fi
            HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" \
              "http://localhost:${PROBE_NGINX_PORT}/_astro/BaseLayout.BV5EQjYn.css" 2>/dev/null || true)
            case "$HTTP_CODE" in
              [1-5][0-9][0-9]) echo "Stack ready after ${SECONDS}s (HTTP $HTTP_CODE)"; exit 0 ;;
            esac
            sleep 2
          done
          echo "::error::probe stack not ready after 180s"
          $COMPOSE ps
          $COMPOSE logs --tail=50
          exit 1

      - name: Resolve compose network name
        id: net
        run: |
          NET=$(docker network ls --filter "name=^${COMPOSE_PROJECT_NAME}_default$" --format '{{.Name}}' | head -1)
          echo "name=$NET" >> "$GITHUB_OUTPUT"
          echo "Compose network: $NET"

      # The browser runs in a container on the compose network, so it reaches
      # the services by their compose names. The script is copied into /tmp
      # and run from there because module resolution of bare imports starts
      # at the importing file's directory. The probe exits non-zero on
      # findings; the step is advisory and records that it ran.
      - name: Run rendered probe
        id: probe
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          docker run --rm --network="${{ steps.net.outputs.name }}" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -v "$PWD/tools/async-css-probe":/probe:ro \
            -v "$PWD/src/browser/device_emulation.json":/device_emulation.json:ro \
            -v "${RUNNER_TEMP}/${PROBE_OUT_SUBDIR}":/out \
            -w /tmp \
            -e PROBE_BASE_URL=http://nginx:8080 \
            -e PROBE_GOLDEN_DIR=/probe/goldens \
            -e PROBE_OUT_DIR=/out \
            -e PROBE_FINDINGS=/out/findings.md \
            -e PROBE_PRIMITIVE=/probe/primitive.json \
            -e PROBE_DEVICE_EMULATION=/device_emulation.json \
            -e PROBE_WORKER_ARGV="${PROBE_WORKER_ARGV}" \
            "${PLAYWRIGHT_IMAGE}" \
            bash -c "npm install --no-save --no-audit --no-fund --silent ${PLAYWRIGHT_DEPS} >/dev/null 2>&1 && cp /probe/probe_rendered.mjs /tmp/ && node /tmp/probe_rendered.mjs" \
            2>&1 | tee "${RUNNER_TEMP}/probe-console.log"
          rc=${PIPESTATUS[0]}
          echo "LANE_RAN=1" >> "$GITHUB_ENV"
          echo "Rendered probe exit status: ${rc}"
          exit "$rc"

      # If the probe step ran but LANE_RAN is still unset, the evidence and
      # the findings issue would be skipped silently every night: fail loudly.
      - name: Check the probe recorded LANE_RAN
        if: always() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure') && env.LANE_RAN != '1'
        run: |
          echo "::error::The rendered probe step ran (outcome: ${{ steps.probe.outcome }}) but did not set LANE_RAN=1, so the evidence upload and the findings issue would be skipped."
          exit 1

      # A run that produced no findings file did not reach a verdict (a
      # container, network or startup failure): record that as a finding so
      # it cannot silently close a live issue.
      - name: Normalize findings
        if: always()
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP}/${PROBE_OUT_SUBDIR}"
          FINDINGS="${OUT}/findings.md"
          mkdir -p "$OUT"
          if [ ! -f "$FINDINGS" ]; then
            {
              echo "### Rendered probe did not reach a verdict (infrastructure)"
              echo
              echo "The lane produced no findings file: a startup, container, or"
              echo "network failure rather than a clean run. This is NOT evidence"
              echo "about the fold. It also suppresses auto-close for the night."
              echo "See the run log."
            } > "$FINDINGS"
          fi
          if [ -s "$FINDINGS" ]; then
            cat "$FINDINGS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Rendered probe clean: the fold matches the golden at every viewport." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          cp "${RUNNER_TEMP}/probe-console.log" "$OUT/console.log" 2>/dev/null || true
          if [ "${LANE_RAN:-}" = "1" ]; then
            touch "$OUT/lane-ran"
          fi

      # Evidence for the findings issue, refreshed nightly; also the input of
      # the report job. A refused upload (artifact storage full) must not
      # turn the lane red.
      - name: Upload evidence (screenshots, findings, console)
        if: always() && env.LANE_RAN == '1'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-async-css-probe-evidence
          path: ${{ runner.temp }}/async-css-probe-out/
          if-no-files-found: ignore
          retention-days: 3

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/async-css-probe/docker-compose.yml \
            -f tools/async-css-probe/docker-compose.prebuilt.yml \
            down --remove-orphans -v --rmi local 2>/dev/null || true

  async-css-probe-report:
    name: Async-CSS probe report
    needs: async-css-probe-rendered
    if: ${{ !cancelled() && needs.async-css-probe-rendered.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tools run below hold a write token: take them from main, never
          # from a dispatched branch.
          ref: main

      - name: Download the evidence
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-async-css-probe-evidence
          path: ${{ runner.temp }}/evidence

      # Only a run on the default branch touches the issue; any other branch
      # is a dry run that prints the gh calls it would make. A run whose lane
      # never ran leaves the issue alone, so a failure before the probe
      # cannot close a legitimate open issue.
      - name: File or close the findings issue
        if: steps.evidence.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && '0' || '1' }}
          LABEL_DESC: "Automated async-CSS rendered-probe findings"
          CLEAN_NOTE: "Above-the-fold render matches the golden at every viewport"
        run: |
          set -uo pipefail
          EVID="${RUNNER_TEMP}/evidence"
          if [ ! -f "${EVID}/lane-ran" ]; then
            echo "::notice::the probe did not run to a verdict; leaving the findings issue alone"
            exit 0
          fi
          bash tools/sbom/post-findings-issue.sh \
            "async-css-probe-finding" \
            "Async-CSS: deferred stylesheet changes the above-the-fold render" \
            "${EVID}/findings.md" \
            "Reproduce locally with \`tools/async-css-probe/run_probe.sh --mode forced\` plus the rendered probe (tools/async-css-probe/README.md); the run's \`nightly-async-css-probe-evidence\` artifact has the per-viewport screenshots. Either the inlined above-the-fold CSS does not cover the fold, or the committed goldens need regenerating in the pinned image. This issue auto-closes on the next clean run."

      - name: Note a missing evidence artifact
        if: steps.evidence.outcome != 'success'
        run: echo "::warning::no evidence artifact from the probe job; the findings issue was left alone"

  # ---------------------------------------------------------------------
  # CSS minifier fuzzing. Two lanes, one harness (lib/css/css_minify_fuzz.cc):
  # `nightly` is coverage-guided libFuzzer with a bounded budget, a corpus
  # persisted through actions/cache, and crash artifacts bucketed against the
  # documented known-find classes; only needs-triage artifacts reach the
  # findings file. It never hard-fails on findings: the tracking issue (label
  # css-fuzz-finding) is the signal. `shadow` is a manual lane.
  # ---------------------------------------------------------------------
  css-fuzz-nightly:
    name: CSS fuzz nightly (libFuzzer + corpus + findings)
    needs: event-guard
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 45
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '600' }}
    steps:
      # libFuzzer reads a non-numeric budget as "no limit" and a budget past
      # the job timeout loses the lane-ran marker and the corpus save, so
      # bound it before anything else runs.
      - name: Validate the fuzz budget
        run: |
          case "${FUZZ_SECONDS}" in
            ''|*[!0-9]*) echo "::error::fuzz_seconds must be a whole number of seconds (1..2400)"; exit 1 ;;
          esac
          if [ "${FUZZ_SECONDS}" -lt 1 ] || [ "${FUZZ_SECONDS}" -gt 2400 ]; then
            echo "::error::fuzz_seconds must be between 1 and 2400 (got ${FUZZ_SECONDS})"
            exit 1
          fi

      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure clang++-20
        run: |
          if command -v clang++-20 >/dev/null 2>&1; then
            clang++-20 --version | head -1
            exit 0
          fi
          echo "::notice::clang++-20 not found: installing it from the LLVM apt repository"
          curl -fsSL https://apt.llvm.org/llvm.sh -o "${RUNNER_TEMP}/llvm.sh"
          sudo bash "${RUNNER_TEMP}/llvm.sh" 20

      - name: Resolve scratch dirs
        run: |
          {
            echo "BIN_DIR=${RUNNER_TEMP}/css-fuzz-bin"
            echo "CORPUS_DIR=${RUNNER_TEMP}/css-fuzz-corpus"
            echo "CRASH_DIR=${RUNNER_TEMP}/css-fuzz-crashes"
            echo "FINDINGS=${RUNNER_TEMP}/css-fuzz-findings.md"
          } >> "$GITHUB_ENV"

      - name: Build replay and libFuzzer binaries
        run: |
          set -euo pipefail
          CXX=clang++-20
          mkdir -p "$BIN_DIR"
          "$CXX" -std=c++17 -O1 -fsanitize=address,undefined -I. \
            lib/css/css_minify_fuzz.cc lib/css/css_minify.cc \
            -o "$BIN_DIR/replay"
          "$CXX" -std=c++17 -O1 -fsanitize=fuzzer,address,undefined \
            -DCSS_MINIFY_LIBFUZZER -I. \
            lib/css/css_minify_fuzz.cc lib/css/css_minify.cc \
            -o "$BIN_DIR/fuzzer"

      - name: Restore persisted corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/css-fuzz-corpus
          key: css-minify-fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: css-minify-fuzz-corpus-v1-

      - name: Seed corpus from the harness's embedded seeds
        run: |
          set -euo pipefail
          mkdir -p "$CORPUS_DIR" "$CRASH_DIR" "${RUNNER_TEMP}/css-fuzz-seed"
          "$BIN_DIR/replay" --dump_corpus="${RUNNER_TEMP}/css-fuzz-seed"
          # -n: never overwrite what the persisted cache already grew.
          cp -n "${RUNNER_TEMP}/css-fuzz-seed"/seed-* "$CORPUS_DIR"/

      # The run steps capture rc instead of failing fast so a red replay
      # floor cannot mask the fuzz campaign (and vice versa); the findings
      # step reports both.
      - name: Run deterministic oracle replay (regression floor)
        run: |
          set +e
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          "$BIN_DIR/replay" 2>&1 | tail -5
          echo "REPLAY_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Run libFuzzer (bounded budget, fork mode)
        run: |
          set +e
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          # -fork=2 -ignore_crashes=1: a known-class crash must not truncate
          # the campaign; crash units land in CRASH_DIR for the classifier
          # while coverage keeps growing.
          "$BIN_DIR/fuzzer" "$CORPUS_DIR" \
            -fork=2 -ignore_crashes=1 \
            -max_total_time="${FUZZ_SECONDS}" \
            -max_len=4096 \
            -rss_limit_mb=4096 \
            -artifact_prefix="${CRASH_DIR}/" \
            -print_final_stats=1
          echo "FUZZ_RC=$?" >> "$GITHUB_ENV"

      # Bucket crash artifacts against the documented known-find classes;
      # only needs-triage items reach the findings file. An empty file means
      # clean, and the tracking issue closes on it.
      - name: Classify artifacts and write findings
        run: |
          set -uo pipefail
          echo "LANE_RAN=1" >> "$GITHUB_ENV"
          : > "$FINDINGS"
          if [ "${REPLAY_RC:-1}" != "0" ]; then
            {
              echo "### deterministic replay floor is RED (rc=${REPLAY_RC})"
              echo
              echo "The embedded valid-CSS seed set trips an oracle or a sanitizer on main: a genuine regression, not a fuzz find. See the run log."
              echo
            } >> "$FINDINGS"
          fi
          # Fork mode exits non-zero when it FOUND crashes (artifacts in
          # CRASH_DIR): a normal night. Non-zero with ZERO artifacts means the
          # campaign never ran (bad flag, OOM before the first unit): that
          # must open or comment the tracking issue, since an empty findings
          # file would close a live issue on a night nothing ran.
          n_artifacts="$(find "$CRASH_DIR" -type f | wc -l | tr -d ' ')"
          if [ "${FUZZ_RC:-1}" != "0" ] && [ "$n_artifacts" = "0" ]; then
            {
              echo "### libFuzzer campaign failed (rc=${FUZZ_RC}, zero artifacts)"
              echo
              echo "The fuzzer exited non-zero without producing a single unit: a startup or campaign failure, not a fuzz find. This entry also suppresses auto-close for the night. See the run log."
              echo
            } >> "$FINDINGS"
          fi
          bash tools/ci/classify-css-fuzz-artifacts.sh \
            "$BIN_DIR/replay" "$CRASH_DIR" "$FINDINGS" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s "$FINDINGS" ]; then
            cat "$FINDINGS" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence (crash reproducers + corpus)
        if: always() && env.LANE_RAN == '1'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: css-fuzz-evidence
          path: |
            ${{ runner.temp }}/css-fuzz-crashes/
            ${{ runner.temp }}/css-fuzz-corpus/
          if-no-files-found: ignore
          retention-days: 7

      # Save even on findings: new coverage units are progress regardless.
      - name: Persist corpus
        if: always() && env.LANE_RAN == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/css-fuzz-corpus
          key: css-minify-fuzz-corpus-v1-${{ github.run_id }}

      # The small input of the report job: the findings text, and a marker
      # that the lane ran so a build-stage failure cannot close the issue.
      - name: Prepare the findings artifact
        if: always() && env.LANE_RAN == '1'
        run: |
          mkdir -p "${RUNNER_TEMP}/css-fuzz-report"
          cp "$FINDINGS" "${RUNNER_TEMP}/css-fuzz-report/findings.md"
          touch "${RUNNER_TEMP}/css-fuzz-report/lane-ran"

      - name: Upload the findings
        if: always() && env.LANE_RAN == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-css-fuzz-findings
          path: ${{ runner.temp }}/css-fuzz-report/
          retention-days: 3

  css-fuzz-report:
    name: CSS fuzz report
    needs: css-fuzz-nightly
    if: ${{ !cancelled() && needs.css-fuzz-nightly.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tools run below hold a write token: take them from main, never
          # from a dispatched branch.
          ref: main

      - name: Download the findings
        id: findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-css-fuzz-findings
          path: ${{ runner.temp }}/findings

      # Live only on the default branch: a dispatch off any other branch is a
      # dry run that prints what it would do.
      - name: File or close the findings issue
        if: steps.findings.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && '0' || '1' }}
          LABEL_DESC: "Automated CSS minifier fuzz findings (audit lane)"
          CLEAN_NOTE: "Replay floor green, no needs-triage fuzz artifacts"
        run: |
          set -uo pipefail
          F="${RUNNER_TEMP}/findings"
          if [ ! -f "${F}/lane-ran" ]; then
            echo "::notice::the fuzz lane did not run to a verdict; leaving the findings issue alone"
            exit 0
          fi
          bash tools/sbom/post-findings-issue.sh \
            "css-fuzz-finding" \
            "CSS minifier fuzz: finding needs triage" \
            "${F}/findings.md" \
            "Reproduce with the run's \`css-fuzz-evidence\` artifact (replay: \`bazel run -c opt --config=asan //lib/css:css_minify_fuzz -- <crash-file>\`); fix the minifier bug or record a justified known-find class in tools/ci/classify-css-fuzz-artifacts.sh. This issue auto-closes on the next triage-clean scheduled run."

      - name: Note a missing findings artifact
        if: steps.findings.outcome != 'success'
        run: echo "::warning::no findings artifact from the fuzz job; the findings issue was left alone"

  # The glue-normalization cutover gate. Manual only: it replays the previous
  # nightly's evidence plus a fresh dump of the embedded seeds through a
  # comparator built from a pinned baseline revision and from this checkout,
  # and requires 100% per-input verdict agreement. Unlike the nightly this
  # lane HARD-fails on any disagreement. The pin tracks the last ratified
  # comparator revision: bump it in the same change as any intentional
  # comparator evolution, or the lane fails on every intended divergence.
  # The pin is 335c9f2d, the first commit of this repository's history that
  # carries the comparator: its css_token_stream.h and css_phases.h are
  # byte-identical to the previously ratified revision (the files that define
  # the verdicts), and it is an ancestor of main. Dispatching the nightly caller runs the whole nightly beside this lane.
  css-fuzz-shadow:
    name: CSS oracle shadow (baseline vs current agreement)
    needs: event-guard
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ github.event_name == 'workflow_dispatch' && vars.FLEET_ENABLED == 'true' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      # Full history: the shadow script extracts the baseline comparator with
      # `git show <pinned rev>:...`.
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure clang++-20
        run: |
          if command -v clang++-20 >/dev/null 2>&1; then
            clang++-20 --version | head -1
            exit 0
          fi
          echo "::notice::clang++-20 not found: installing it from the LLVM apt repository"
          curl -fsSL https://apt.llvm.org/llvm.sh -o "${RUNNER_TEMP}/llvm.sh"
          sudo bash "${RUNNER_TEMP}/llvm.sh" 20

      # The evidence base: the previous nightly's crash units and grown
      # corpus. Fetch the most recent COMPLETED nightly on main, excluding
      # this run, regardless of conclusion (a shadow-red night still produced
      # evidence). Fail loudly, never a silent seeds-only comparison, when
      # there is no prior run, the download fails, or the artifact is empty.
      - name: Fetch the previous nightly's fuzz evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          EVID="${RUNNER_TEMP}/css-shadow-evidence"
          mkdir -p "$EVID"
          run_id="$(gh run list --workflow nightly.yml --branch main \
            --status completed --limit 5 --json databaseId \
            --jq 'map(select(.databaseId != (env.RUN_ID | tonumber))) | .[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::no prior completed nightly run found on main: no evidence to shadow-compare"
            exit 1
          fi
          gh run download "$run_id" --name css-fuzz-evidence --dir "$EVID"
          n="$(find "$EVID" -type f | wc -l | tr -d ' ')"
          if [ "$n" -eq 0 ]; then
            echo "::error::css-fuzz-evidence from run $run_id is empty (expired after a gap?): refusing a seeds-only shadow"
            exit 1
          fi
          echo "evidence units: $n (nightly run $run_id)"

      # The embedded seed set, dumped by the current harness (the seeds are
      # the same for both comparators).
      - name: Dump embedded seeds
        run: |
          set -euo pipefail
          CXX=clang++-20
          mkdir -p "${RUNNER_TEMP}/css-shadow-seeds" "${RUNNER_TEMP}/css-shadow-bin"
          "$CXX" -std=c++17 -O1 -fsanitize=address,undefined -I. \
            lib/css/css_minify_fuzz.cc lib/css/css_minify.cc \
            -o "${RUNNER_TEMP}/css-shadow-bin/replay"
          "${RUNNER_TEMP}/css-shadow-bin/replay" --dump_corpus="${RUNNER_TEMP}/css-shadow-seeds"

      - name: Shadow comparison (baseline vs current verdicts)
        run: |
          set -euo pipefail
          export ASAN_OPTIONS="handle_abort=1:allow_addr2line=true:detect_odr_violation=1"
          export UBSAN_OPTIONS="halt_on_error=true:print_stacktrace=1"
          bash tools/ci/shadow-css-oracle.sh . 335c9f2d \
            "${RUNNER_TEMP}/css-shadow-seeds" \
            "${RUNNER_TEMP}/css-shadow-evidence" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Dependency scan, nightly image leg. The product images are built in this
  # job from this run's nightly bundle (the prebuilt image Dockerfiles), never
  # taken from a host's docker cache: a scan of whatever image a runner last
  # built is a scan of an image nobody ships. BLOCKING on medium and above
  # across npm, cargo and images (images: findings with a fix available at
  # medium, High and Critical always). The pull-request and push legs of the
  # dependency scan belong to the PR tier.
  # ---------------------------------------------------------------------
  dep-scan-images:
    name: Dependency Scan (nightly, images)
    needs: periodic-build-x64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYFT_VERSION: v1.44.0
      GRYPE_VERSION: v0.112.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-x64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      # The product images are FROM pagespeed2-base-runtime. A persistent host
      # keeps that image between jobs and stage-artifacts.sh reuses it while
      # the Dockerfile hash matches, so build it here from scratch (fresh base
      # layers, no layer cache) with the label the staging script checks; the
      # scan then covers what the Dockerfile produces today, not a host cache.
      - name: Rebuild the base image from scratch
        run: |
          set -euo pipefail
          HASH="$(sha256sum docker/Dockerfile.base-runtime | awk '{print $1}')"
          docker build --pull --no-cache -t pagespeed2-base-runtime \
            --build-arg APT_REFRESH="$(date -u +%F)" \
            --label "weamp.base-runtime.dockerfile_sha256=${HASH}" \
            -f docker/Dockerfile.base-runtime .

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-x64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Build the product images in this job
        run: |
          set -euo pipefail
          mkdir -p artifacts
          install -m 755 .ci-artifacts/factory_worker artifacts/factory_worker
          install -m 644 .ci-artifacts/ngx_pagespeed_module.so artifacts/ngx_pagespeed_module.so
          install -m 644 .ci-artifacts/nginx-version artifacts/nginx-version
          docker build -f docker/Dockerfile.worker.prebuilt -t modpagespeed/worker:latest .
          docker build -f docker/Dockerfile.nginx.prebuilt -t modpagespeed/nginx:latest .
          bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker >/dev/null

      # A malformed VEX statement is silently ignored by the scanner, which
      # would resurface a triaged finding or let a broken suppression look
      # active. Exits 0 when sbom/ has no *.vex.json.
      - name: Validate VEX statements
        run: python3 tools/ci/validate-vex.py sbom/

      - name: Ensure pinned syft + grype
        run: bash tools/ci/ensure-syft-grype.sh

      # The staleness ratchet: the blocking npm and cargo gate scans against a
      # pinned database. Once that pin is older than its limit, this nightly
      # goes red, so a pin nobody bumps cannot quietly stop working.
      - name: Enforce grype DB pin age
        env:
          GRYPE_DB_CACHE_DIR: ${{ github.workspace }}/.grype-db-pinned
        run: bash tools/sbom/provision-grype-db.sh --enforce-age

      - name: Run dependency scan (blocking)
        run: |
          set -uo pipefail
          rc=0
          bash tools/sbom/dep-scan.sh --images --fail-on medium --surfaces npm,cargo,image || rc=$?
          if [ -f sbom/scan/SUMMARY.md ]; then cat sbom/scan/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"

      # The small input of the report job, written even when the scan failed.
      - name: Collect the findings
        if: always()
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP}/dep-scan-report"
          mkdir -p "$OUT"
          F="$OUT/findings.md"; : > "$F"
          for r in sbom/scan/*.grype.json; do
            [ -f "$r" ] || continue
            src="$(basename "$r" .grype.json)"
            n="$(jq '[.matches[]?|select(.vulnerability.severity|test("Critical|High|Medium"))]|length' "$r" 2>/dev/null || echo 0)"
            [ "${n:-0}" -gt 0 ] || continue
            {
              echo "### \`${src}\`: ${n} medium+ finding(s)"
              jq -r '.matches[]?|select(.vulnerability.severity|test("Critical|High|Medium"))
                | "- **\(.artifact.name)@\(.artifact.version)**: \(.vulnerability.severity) [\(.vulnerability.id)] fix: \((.vulnerability.fix.versions // []) | join(", ") | if .=="" then "none" else . end)"' "$r"
              echo ""
            } >> "$F"
          done
          if [ -d sbom/scan ]; then touch "$OUT/lane-ran"; fi

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-dep-scan-findings
          path: ${{ runner.temp }}/dep-scan-report/
          if-no-files-found: ignore
          retention-days: 3

      # SBOMs and grype reports. A refused upload must not turn the scan red.
      - name: Upload SBOMs and grype reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-dep-scan-reports
          path: sbom/scan/
          if-no-files-found: warn
          retention-days: 3

      - name: Teardown
        if: always()
        run: |
          docker rmi -f modpagespeed/worker:latest modpagespeed/nginx:latest 2>/dev/null || true
          rm -rf artifacts

  dep-scan-report:
    name: Dependency scan report
    needs: dep-scan-images
    if: ${{ !cancelled() && needs.dep-scan-images.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tools run below hold a write token: take them from main, never
          # from a dispatched branch.
          ref: main

      - name: Download the findings
        id: findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-dep-scan-findings
          path: ${{ runner.temp }}/findings

      # One auto-managed issue: opened on medium+ findings, closed when clean.
      # Live only on the default branch.
      - name: File or close the findings issue
        if: steps.findings.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && '0' || '1' }}
        run: |
          set -uo pipefail
          F="${RUNNER_TEMP}/findings"
          if [ ! -f "${F}/lane-ran" ]; then
            echo "::notice::the scan did not reach a verdict; leaving the findings issue alone"
            exit 0
          fi
          bash tools/sbom/post-findings-issue.sh \
            "dependencies-cve" "Dependency CVE findings (automated dependency scan)" "${F}/findings.md"

      - name: Note a missing findings artifact
        if: steps.findings.outcome != 'success'
        run: echo "::warning::no findings artifact from the scan job; the findings issue was left alone"


  # The whole-tree lint for main: clang-tidy over every translation unit in
  # lint scope and clang-format over the tree. A push to main no longer runs
  # a whole-tree lint (the PR tier's `lint` is clang-format only on a push,
  # and the full tier's `lint-full` skips a push), so this nightly job is the
  # post-merge net.
  # This is a deliberate twin of pipeline-full.yml's `lint-full`, kept in this
  # file because the fleet runner group admits only the existing pipeline
  # workflows; changes to one must be mirrored in the other. The vendored
  # tree comes from `periodic-vendor`, as in `periodic-build-x64`.
  lint-full:
    name: Lint (whole tree)
    needs: periodic-vendor
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    # A whole-tree lint takes tens of minutes, longer on a cold lint cache or
    # a hosted runner (which also builds the image first).
    timeout-minutes: 180
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.periodic-vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: optimizer-vendor-${{ hashFiles('MODULE.bazel', '.bazelversion', 'bazel/**', 'third_party/**') }}
          fail-on-cache-miss: true

      - name: Extract the vendored workspace (hub channel)
        if: needs.periodic-vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.periodic-vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix pagespeed-optimizer)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/pagespeed-optimizer-${{ needs.periodic-vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Docker preflight
        run: tools/ci/docker-preflight.sh

      - name: Ensure the lint image
        run: |
          # Content-hashed tags and per-host flocks
          # (tools/ci/ensure-dev-image.sh): --derived ensures the base
          # pagespeed2-dev image first, then builds pagespeed2-lint on top
          # under its own lock, and prints the lint image's name.
          LINT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest \
            --derived pagespeed2-lint Dockerfile.lint x64 docker)
          echo "LINT_IMAGE=${LINT_IMAGE}" >> "$GITHUB_ENV"

      # The whole tree, always (the PR tier's `lint` computes a scope instead).
      - name: Set the lint scope
        run: |
          MODE=full
          echo "LINT_MODE=${MODE}" >> "$GITHUB_ENV"
          echo "lint scope: mode=${MODE}"

      - name: clang-tidy
        run: |
          # Generate compile_commands.json and run clang-tidy in a single
          # container so that Bazel's external/ symlinks remain valid for
          # clang-tidy. The dependency repos are public and fetched over
          # https, so no credential of any kind enters the container.
          #
          # The container runs as the runner user so nothing root-owned
          # lands in the checkout (a root-owned compile_commands.json would
          # break the NEXT job's checkout on a persistent runner). HOME and
          # the lint Bazel state live in a per-runner cache dir mounted at
          # /cache, outside the checkout, because Bazel refuses a repository
          # cache inside the main repository. The dir persists across jobs
          # on a fleet runner (a cold full lint is tens of minutes) and is
          # simply empty on a hosted runner. The dir name is suffixed per
          # runner instance because two instances can share one host's home;
          # the name is never logged.
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          LINT_OUT="${HOME}/.cache/optimizer-lint${RUNNER_TAG:+-${RUNNER_TAG}}"
          mkdir -p "${LINT_OUT}"
          # Per-slot budget: memory cap only when the runner sets one (no
          # default cap), and the shared parallelism for Bazel and
          # run-clang-tidy.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget || exit 1
          MEM_ARGS=()
          [ -z "${SLOT_MEM}" ] || MEM_ARGS=(--memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}")
          docker run --rm \
            "${MEM_ARGS[@]}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/cache \
            -e CI_SLOT_CPUS="${SLOT_CPUS}" -e CI_SLOT_MEM_GB="${SLOT_MEM_GB}" \
            -e LINT_MODE="${LINT_MODE:-full}" \
            -e BAZEL_REPO_CACHE=/cache/bazel-repo \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${LINT_OUT}:/cache" \
            "${LINT_IMAGE}" \
            bash -c '
              set -e
              # Toolchain guard: a stale lint image linting with the wrong
              # clang-tidy major produces misleading verdicts in both
              # directions. Assert the pinned major up front so it fails
              # loudly instead.
              CT_MAJOR=$(clang-tidy-20 --version | sed -n "s/.*version \([0-9][0-9]*\).*/\1/p" | head -1)
              if [ "${CT_MAJOR}" != "20" ]; then
                echo "::error::clang-tidy-20 reports major version ${CT_MAJOR:-unknown}, expected 20 -- stale lint image?"
                clang-tidy-20 --version || true
                exit 1
              fi
              # Nothing in the lint scope changed: skip the expensive
              # compile_commands generation entirely (clang-format still runs
              # in the next step). This makes docs/CI-only PRs near-instant.
              if [ "${LINT_MODE}" = "none" ]; then
                echo "lint scope: no .cc/.h changed in lint scope -- skipping compile-commands + clang-tidy."
                exit 0
              fi
              # Anchor CWD + BUILD_WORKSPACE_DIRECTORY at /workspace so
              # hedrons refresh_all writes compile_commands.json next to the
              # source tree (run-clang-tidy below reads it via -p
              # /workspace).
              cd /workspace
              export BUILD_WORKSPACE_DIRECTORY=/workspace
              /workspace/tools/ci/lint-compile-commands.sh
              # Sanity gate: the compile_commands.json must still exist
              # *immediately* before run-clang-tidy reads it.
              if [ ! -s /workspace/compile_commands.json ]; then
                echo "::error::compile_commands.json disappeared between lint-compile-commands.sh and run-clang-tidy"
                ls -la /workspace/compile_commands.json 2>&1 || true
                exit 1
              fi
              # Lint scope (computed by the "Compute lint scope" step; "none"
              # already short-circuited above):
              #   scoped -> only the .cc files changed in this PR.
              #   full   -> the whole (lib|src|test) tree.
              if [ "${LINT_MODE}" = "scoped" ]; then
                mapfile -t CT_TARGETS < <(sed "s#^#/workspace/#" /workspace/.lint-files.txt)
                echo "lint scope: scoped to ${#CT_TARGETS[@]} changed file(s):"
                printf "  %s\n" "${CT_TARGETS[@]}"
              else
                # The lookahead excludes the VENDORED 1.15 JS kernel TUs and
                # the VENDORED 1.15 HTML kernel TUs (explicit stem list --
                # the native lib/html .cc files stay linted). run-clang-tidy
                # matches these as Python regexes, so the lookahead is valid
                # here (unlike in -header-filter, which is LLVM ERE).
                CT_TARGETS=("/workspace/(lib/(?!js/|html/(content_type|doctype|empty_html_filter|html_element|html_event|html_filter|html_keywords|html_lexer|html_node|html_parse|html_parse_probe|html_writer_filter)\.cc$)|src/|test/).*\.cc")
                echo "lint scope: full tree (vendored lib/js excluded)."
              fi
              # -extra-arg=-stdlib=libc++ is required: Hedron
              # compile_commands.json does not propagate Bazel
              # --cxxopt=-stdlib=libc++ from build:libc++ on linux, so
              # clang-tidy falls back to the base images libstdc++ which
              # lacks <expected> (C++23).
              # -header-filter must tolerate RELATIVE paths: clang-tidy
              # matches it against the header path as recorded by the
              # compilation (workspace-relative, e.g. ./lib/js/foo.h), NOT
              # the absolutized TU path.
              # -exclude-header-filter suppresses diagnostics located in the
              # VENDORED 1.15 kernel headers (JS by name shape, HTML by the
              # explicit stem list the sync tool asserts); the compat/*.h
              # headers deliberately do NOT match and stay fully linted.
              # LLVM ERE -- no lookahead.
              # run-clang-tidy defaults to every host CPU; honour the slot.
              CT_J=()
              # With a memory cap, also allow at most one process per 2 GiB.
              if [ -n "${CI_SLOT_CPUS:-}" ]; then
                ct_j="${CI_SLOT_CPUS}"
                if [ -n "${CI_SLOT_MEM_GB:-}" ]; then
                  mem_j=$(( CI_SLOT_MEM_GB / 2 )); [ "${mem_j}" -ge 1 ] || mem_j=1
                  [ "${ct_j}" -le "${mem_j}" ] || ct_j="${mem_j}"
                fi
                CT_J=(-j "${ct_j}")
              fi
              run-clang-tidy-20 \
                "${CT_J[@]}" \
                -clang-tidy-binary=clang-tidy-20 \
                -p /workspace \
                -extra-arg=-stdlib=libc++ \
                -header-filter="^(\./)?(lib|src|test)/.*\.(h|hpp)$" \
                -exclude-header-filter="^(\./)?(lib/js/(js_[a-z_0-9]+\.(h|hpp)|source_map\.h|corpus/.*)|lib/html/(content_type|doctype|empty_html_filter|html_element|html_event|html_filter|html_keywords|html_lexer|html_name|html_node|html_parse|html_parse_recorder|html_writer_filter)\.h)$" \
                "${CT_TARGETS[@]}" \
                2>&1 | tee /tmp/ct-out.txt
              CT_EXIT=${PIPESTATUS[0]}
              # Fail-closed TU-count assertion: if run-clang-tidy selected
              # zero TUs, the gate would pass vacuously. Parse its "Running
              # clang-tidy for N files out of M" line and fail on N=0 or on
              # the line missing entirely.
              CT_N=$(grep -oE "Running clang-tidy for [0-9]+ files" /tmp/ct-out.txt | grep -oE "[0-9]+" | head -1)
              if [ -z "${CT_N}" ] || [ "${CT_N}" -eq 0 ]; then
                echo "::error::run-clang-tidy selected ${CT_N:-no} TUs (expected >0) -- the lint gate would pass vacuously; failing closed"
                exit 1
              fi
              echo "run-clang-tidy selected ${CT_N} TUs"
              if [ "$CT_EXIT" -ne 0 ]; then
                echo "=== clang-tidy ERRORS ==="
                grep -E "error:|warning: " /tmp/ct-out.txt | grep -v "^--$" | head -80 || tail -80 /tmp/ct-out.txt
                exit "$CT_EXIT"
              fi
            '

      - name: clang-format check
        run: |
          RUNNER_TAG="${RUNNER_NAME//[^A-Za-z0-9_.-]/_}"
          LINT_OUT="${HOME}/.cache/optimizer-lint${RUNNER_TAG:+-${RUNNER_TAG}}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${LINT_OUT}:/workspace/.cache" \
            -w /workspace \
            "${LINT_IMAGE}" \
            bash -c '
              # Toolchain guard: same rationale as the clang-tidy step -- a
              # stale image formatting with the wrong major gives a
              # misleading whole-tree --Werror verdict.
              CF_MAJOR=$(clang-format-20 --version | sed -n "s/.*version \([0-9][0-9]*\).*/\1/p" | head -1)
              if [ "${CF_MAJOR}" != "20" ]; then
                echo "::error::clang-format-20 reports major version ${CF_MAJOR:-unknown}, expected 20 -- stale lint image?"
                clang-format-20 --version || true
                exit 1
              fi
              # The ! -path excludes mirror the vendored-name invariants: the
              # vendored 1.15 kernels keep their canonical formatting
              # (style-lint carve-out ONLY; see lib/js/CLAUDE.md and
              # lib/html/CLAUDE.md). The compat/ dirs stay format-checked.
              # NOTE: the lib/js entries are find globs, deliberately broader
              # than the js_[a-z_0-9]+ lint stems (find -path cannot express
              # that class); the lib/html entries are the EXACT vendored
              # names.
              find lib src test/lib test/src test/test_util -type f \
                \( -name "*.cc" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
                ! -path "lib/js/js_*" ! -path "lib/js/source_map.h" \
                ! -path "lib/js/corpus/*" \
                ! -path "lib/html/content_type.h" ! -path "lib/html/content_type.cc" \
                ! -path "lib/html/doctype.h" ! -path "lib/html/doctype.cc" \
                ! -path "lib/html/empty_html_filter.h" ! -path "lib/html/empty_html_filter.cc" \
                ! -path "lib/html/html_element.h" ! -path "lib/html/html_element.cc" \
                ! -path "lib/html/html_event.h" ! -path "lib/html/html_event.cc" \
                ! -path "lib/html/html_filter.h" ! -path "lib/html/html_filter.cc" \
                ! -path "lib/html/html_keywords.h" ! -path "lib/html/html_keywords.cc" \
                ! -path "lib/html/html_lexer.h" ! -path "lib/html/html_lexer.cc" \
                ! -path "lib/html/html_name.h" \
                ! -path "lib/html/html_node.h" ! -path "lib/html/html_node.cc" \
                ! -path "lib/html/html_parse.h" ! -path "lib/html/html_parse.cc" \
                ! -path "lib/html/html_parse_probe.cc" ! -path "lib/html/html_parse_recorder.h" \
                ! -path "lib/html/html_writer_filter.h" ! -path "lib/html/html_writer_filter.cc" \
                | xargs clang-format-20 --dry-run --Werror
            '

  # Kill switch notice. While the repository variable FLEET_ENABLED is 'false'
  # every build runner job here runs on its hosted twin, and the jobs that
  # have no hosted twin (the privileged and container-socket legs) are
  # skipped. This job only says so, in an annotation and the job summary, so
  # a skipped check is never a silent one.
  fleet-off-notice:
    name: Shared build runners are switched off
    if: ${{ vars.FLEET_ENABLED == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say what the switch changed
        run: |
          echo "::notice::FLEET_ENABLED is 'false': build runner jobs run on hosted runners; jobs that need a build runner host are skipped."
          {
            echo "### Shared build runners are switched off"
            echo
            echo "The repository variable FLEET_ENABLED is 'false'. Jobs that normally use the"
            echo "build runners ran on GitHub-hosted runners, slower and without the shared caches."
            echo "Jobs that need a host only the build runners provide were skipped."
            echo "Set FLEET_ENABLED back to 'true' to use the build runners again."
          } >> "$GITHUB_STEP_SUMMARY"
