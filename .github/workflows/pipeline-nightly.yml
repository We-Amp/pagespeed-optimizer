      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-arm64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-arm64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Build Docker images (prebuilt)
        run: |
          docker compose -f tools/realworld-tests/docker-compose.yml \
            -f tools/realworld-tests/docker-compose.prebuilt.yml build

      - name: Start real-world stack
        run: |
          docker compose -f tools/realworld-tests/docker-compose.yml \
            -f tools/realworld-tests/docker-compose.prebuilt.yml up -d --no-build
          # Wait for nginx (local /health, no upstream dependency).
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:${REALWORLD_NGINX_PORT:-8083}/health" >/dev/null 2>&1 && break
            sleep 2
          done
          # Wait for go-httpbin to be reachable THROUGH nginx. The go-httpbin
          # image is distroless (no shell/wget), so it cannot run a container
          # healthcheck for depends_on: service_healthy; gate readiness here
          # instead so tests don't start before the upstream is serving.
          for _ in $(seq 1 30); do
            curl -sf "http://localhost:${REALWORLD_NGINX_PORT:-8083}/httpbin/status/200" >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Run real-world proxy tests
        run: |
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -e "NGINX_URL=http://localhost:${REALWORLD_NGINX_PORT:-8083}" \
            -e "WORKER_API_URL=http://localhost:${REALWORLD_WORKER_PORT:-9882}" \
            -v "$PWD":/repo -w /repo/tools/realworld-tests \
            python:3.12-slim \
            bash -c "export PATH=/tmp/.local/bin:\$PATH && pip install -q pytest==9.1.1 requests==2.34.2 && pytest -v --tb=short -p no:cacheprovider"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f tools/realworld-tests/docker-compose.yml -f tools/realworld-tests/docker-compose.prebuilt.yml logs --no-color --tail=400 worker nginx 2>/dev/null || docker compose -f tools/realworld-tests/docker-compose.yml -f tools/realworld-tests/docker-compose.prebuilt.yml logs --no-color --tail=400 || true
          # The nginx error log is written to a file inside the container, not to stderr.
          docker compose -f tools/realworld-tests/docker-compose.yml -f tools/realworld-tests/docker-compose.prebuilt.yml exec -T nginx sh -c 'tail -n 200 /var/log/nginx/error.log' || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/realworld-tests/docker-compose.yml \
            -f tools/realworld-tests/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

  e2e-tests:
    name: E2E Tests
    needs: periodic-build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several runner slots share one host and every stack publishes fixed
      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-arm64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-arm64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Generate test fixtures
        run: tools/generate-test-fixtures.sh

      - name: Build Docker images (prebuilt)
        run: |
          docker compose -f tools/e2e/docker-compose.yml \
            -f tools/e2e/docker-compose.prebuilt.yml build

      - name: Ensure no leftover containers
        run: |
          docker compose -f tools/e2e/docker-compose.yml \
            -f tools/e2e/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

      - name: Start services
        run: |
          docker compose -f tools/e2e/docker-compose.yml \
            -f tools/e2e/docker-compose.prebuilt.yml up -d

      - name: Wait for services
        run: |
          echo "Waiting for services (timeout 120s)..."
          E2E_PORT="${E2E_NGINX_PORT:-8083}"
          deadline=$((SECONDS + 120))
          while [ $SECONDS -lt $deadline ]; do
            HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" "http://localhost:${E2E_PORT}/" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "Nginx ready after $((SECONDS))s (HTTP $HTTP_CODE)"
              break
            fi
            [ $((SECONDS % 10)) -lt 2 ] && echo "Still waiting... (HTTP $HTTP_CODE, ${SECONDS}s elapsed)"
            sleep 2
          done
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::Nginx not ready after 120s - dumping nginx logs."
            docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml ps
            NGINX_LOG="$(docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml logs --no-color --tail=200 nginx 2>&1)"
            echo "--- docker compose logs nginx (last 200) ---"
            echo "$NGINX_LOG"
            if echo "$NGINX_LOG" | grep -q 'module.*version'; then
              echo "::error::nginx ABI skew detected (module vs runtime NGINX_VERSION_NUM): $(echo "$NGINX_LOG" | grep -m1 'module.*version')"
            fi
            exit 1
          fi
          # Worker readiness gate: poll /v1/health until it answers 200 with
          # ready=true (a 200 without a `ready` field also counts).
          deadline=$((SECONDS + 60))
          WORKER_READY=False
          while [ $SECONDS -lt $deadline ]; do
            WORKER_READY=$(curl -sf "http://localhost:${E2E_WORKER_PORT:-9881}/v1/health" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(bool(d.get('ready', True)))" 2>/dev/null || echo "False")
            if [ "$WORKER_READY" = "True" ]; then
              echo "Worker ready"
              break
            fi
            sleep 1
          done
          if [ "$WORKER_READY" != "True" ]; then
            echo "WARNING: Worker not ready after 60s - E2E HIT tests may fail"
            echo "--- Worker health endpoint (full response) ---"
            curl -sf "http://localhost:${E2E_WORKER_PORT:-9881}/v1/health" 2>/dev/null | python3 -m json.tool 2>/dev/null || echo "(no response)"
            echo "--- Container status ---"
            docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml ps
            echo "--- Worker logs (last 100 lines) ---"
            docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml logs --tail=100 worker
            echo "--- Nginx logs (last 50 lines) ---"
            docker compose -f tools/e2e/docker-compose.yml \
              -f tools/e2e/docker-compose.prebuilt.yml logs --tail=50 nginx
          fi

      - name: Run E2E tests
        run: |
          # Stage a Linux CLI + compose plugin where the DAEMON can bind-mount them
          # (copies host binaries on Linux, downloads static builds on macOS; see the script).
          eval "$(tools/ci/stage-docker-cli.sh)"
          DOCKER_GID="$(stat -c '%g' /var/run/docker.sock 2>/dev/null || stat -f '%g' /var/run/docker.sock 2>/dev/null || echo 0)"
          case "$DOCKER_GID" in ''|*[!0-9]*) DOCKER_GID=0 ;; esac
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" --group-add "$DOCKER_GID" --group-add 0 -e HOME=/tmp \
            -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -v "$PWD":/repo -w /repo/tools/e2e \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$DOCKER_BIN":/usr/bin/docker:ro \
            -v "$COMPOSE_PLUGIN":/usr/local/lib/docker/cli-plugins/docker-compose:ro \
            -e E2E_NO_LIFECYCLE=1 \
            -e "NGINX_URL=http://localhost:${E2E_NGINX_PORT:-8083}" \
            -e "ORIGIN_URL=http://localhost:${E2E_ORIGIN_PORT:-8082}" \
            -e "WORKER_API_URL=http://localhost:${E2E_WORKER_PORT:-9881}" \
            python:3.12-slim \
            bash -c "export PATH=/tmp/.local/bin:\$PATH && pip install -q -r requirements.txt && \
              pytest test_user_stories.py test_configuration.py \
                -v --tb=short --junitxml=results.xml"

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/e2e/docker-compose.yml \
            -f tools/e2e/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

  # Workbench console browser tests (Playwright) against the workbench demo
  # stack: the website origin and demo origin built from this tree
  # (tools/workbench-demo/ builds website/ with PRICING_ALLOW_STALE, so no
  # credentials are needed), the worker and nginx from this run's arm64
  # bundle. Hosted arm64: nothing here needs the container socket.
  workbench-playwright:
    name: Workbench Playwright
    needs: periodic-build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several runner slots share one host and every stack publishes fixed
      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-arm64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-arm64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Build Docker images (prebuilt)
        run: |
          docker compose -f tools/workbench-demo/docker-compose.yml \
            -f tools/workbench-demo/docker-compose.prebuilt.yml build

      - name: Ensure no leftover containers
        run: |
          docker compose -f tools/workbench-demo/docker-compose.yml \
            -f tools/workbench-demo/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

      # The worker container mounts the built console from the checkout.
      - name: Build console dist (mounted into the worker container)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e COREPACK_HOME=/tmp/.corepack \
            -v "$PWD":/repo -w /repo/tools/workbench \
            node:22-slim \
            bash -c "mkdir -p /tmp/bin && corepack enable --install-directory /tmp/bin && export PATH=/tmp/bin:\$PATH && pnpm install --frozen-lockfile && pnpm -r build"

      - name: Start services
        run: |
          docker compose -f tools/workbench-demo/docker-compose.yml \
            -f tools/workbench-demo/docker-compose.prebuilt.yml up -d

      - name: Wait for services
        run: |
          COMPOSE=(docker compose -f tools/workbench-demo/docker-compose.yml
                   -f tools/workbench-demo/docker-compose.prebuilt.yml)
          echo "Waiting for the worker API (port ${WORKBENCH_API_PORT:-9880}) and nginx (port ${WORKBENCH_NGINX_PORT:-8084})..."
          deadline=$((SECONDS + 120))
          while [ $SECONDS -lt $deadline ]; do
            if curl -sf "http://localhost:${WORKBENCH_API_PORT:-9880}/v1/health" >/dev/null 2>&1; then
              echo "Worker API ready after ${SECONDS}s"
              break
            fi
            sleep 2
          done
          if ! curl -sf "http://localhost:${WORKBENCH_API_PORT:-9880}/v1/health" >/dev/null 2>&1; then
            echo "::error::worker API not ready after 120s"
            "${COMPOSE[@]}" ps
            "${COMPOSE[@]}" logs --tail=50
            exit 1
          fi
          deadline=$((SECONDS + 30))
          HTTP_CODE=000
          while [ $SECONDS -lt $deadline ]; do
            HTTP_CODE=$(curl -so /dev/null -w "%{http_code}" "http://localhost:${WORKBENCH_NGINX_PORT:-8084}/" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "Nginx ready (HTTP $HTTP_CODE)"
              break
            fi
            sleep 2
          done
          # nginx failing to start is a loud failure: a module/runtime ABI
          # skew kills nginx at startup while the worker stays healthy.
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::nginx did not become ready within 30s; dumping its logs"
            "${COMPOSE[@]}" ps
            NGINX_LOG="$("${COMPOSE[@]}" logs --no-color --tail=200 nginx 2>&1)"
            echo "$NGINX_LOG"
            if echo "$NGINX_LOG" | grep -q 'module.*version'; then
              echo "::error::nginx ABI skew detected: $(echo "$NGINX_LOG" | grep -m1 'module.*version')"
            fi
            exit 1
          fi
          deadline=$((SECONDS + 30))
          WORKER_READY=False
          while [ $SECONDS -lt $deadline ]; do
            WORKER_READY=$(curl -sf "http://localhost:${WORKBENCH_API_PORT:-9880}/v1/health" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(bool(d.get('ready', True)))" 2>/dev/null || echo "False")
            if [ "$WORKER_READY" = "True" ]; then
              echo "Worker ready"
              break
            fi
            sleep 1
          done
          if [ "$WORKER_READY" != "True" ]; then
            echo "::warning::worker not ready after 30s; some workbench tests may fail"
          fi

      - name: Resolve compose network name
        id: net
        run: |
          NET=$(docker network ls --filter name=workbench-demo_default --format '{{.Name}}' | head -1)
          echo "name=$NET" >> "$GITHUB_OUTPUT"
          echo "Compose network: $NET"

      - name: Run Playwright tests
        env:
          NET_NAME: ${{ steps.net.outputs.name }}
        run: |
          docker run --rm --network="${NET_NAME}" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e COREPACK_HOME=/tmp/.corepack \
            -v "$PWD":/repo -w /repo/tools/workbench \
            -e CI=true \
            -e PLAYWRIGHT_BASE_URL=http://nginx:8080 \
            -e PROXY_BASE=http://nginx:8080 \
            -e ORIGIN_BASE=http://origin:8081 \
            -e PLAYWRIGHT_BROWSERS_PATH=0 \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -c "mkdir -p /tmp/bin && corepack enable --install-directory /tmp/bin && export PATH=/tmp/bin:\$PATH && pnpm install --frozen-lockfile && pnpm -r build && cd packages/web-shell && pnpm exec playwright install chromium && pnpm exec playwright test"

      - name: Upload Playwright forensics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-workbench-playwright-forensics
          path: |
            tools/workbench/packages/web-shell/test-results/**
            tools/workbench/packages/web-shell/playwright-report/**
          retention-days: 3
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/workbench-demo/docker-compose.yml \
            -f tools/workbench-demo/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

  # ---------------------------------------------------------------------
  # x64 legs (fleet only: they mount the container socket or run privileged
  # containers). A failure here does not block the other lanes.
  # ---------------------------------------------------------------------
  stress-x64:
    name: Stress Tests (x64)
    needs: periodic-build-x64
    runs-on: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) && 'ubuntu-latest' || 'fleet-heavy' }}
    if: ${{ vars.FLEET_ENABLED != 'false' && !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]')) }}
    timeout-minutes: 120
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several runner slots share one host and every stack publishes fixed
      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-x64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-x64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Build Docker images (prebuilt)
        run: |
          docker compose -f tools/stress/docker-compose.yml \
            -f tools/stress/docker-compose.prebuilt.yml build

      - name: Generate test data and start services
        run: |
          cd tools/stress
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -v "$PWD/testdata:/testdata" -w /testdata python:3.12-slim \
            bash -c "pip install -q Pillow==13.0.0 && python3 generate_testdata.py"
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up -d
          STRESS_PORT="${STRESS_NGINX_PORT:-8190}"
          NGINX_READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${STRESS_PORT}/" >/dev/null 2>&1; then
              echo "Nginx ready after ${i}s"; NGINX_READY=1; break
            fi
            sleep 1
          done
          # Loud failure on startup skew, not a silent fall-through.
          if [ "$NGINX_READY" -ne 1 ]; then
            echo "::error::Nginx did not become ready within 60s - dumping nginx logs."
            docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml ps
            NGINX_LOG="$(docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml logs --no-color --tail=200 nginx 2>&1)"
            echo "--- docker compose logs nginx (last 200) ---"
            echo "$NGINX_LOG"
            if echo "$NGINX_LOG" | grep -q 'module.*version'; then
              echo "::error::nginx ABI skew detected (module vs runtime NGINX_VERSION_NUM): $(echo "$NGINX_LOG" | grep -m1 'module.*version')"
            fi
            exit 1
          fi
          sleep 2

      - name: Run stress tests
        run: |
          # Stage a Linux CLI + compose plugin where the DAEMON can bind-mount them
          # (copies host binaries on Linux, downloads static builds on macOS; see the script).
          eval "$(tools/ci/stage-docker-cli.sh)"
          DOCKER_GID="$(stat -c '%g' /var/run/docker.sock 2>/dev/null || stat -f '%g' /var/run/docker.sock 2>/dev/null || echo 0)"
          case "$DOCKER_GID" in ''|*[!0-9]*) DOCKER_GID=0 ;; esac
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" --group-add "$DOCKER_GID" --group-add 0 \
            -e HOME=/tmp \
            -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -e STRESS_COMPOSE_FILE="/repo/tools/stress/docker-compose.yml:/repo/tools/stress/docker-compose.prebuilt.yml" \
            -e STRESS_LATENCY_FACTOR=2.0 \
            -e "STRESS_NGINX_PORT=${STRESS_NGINX_PORT:-8190}" \
            -e "STRESS_ORIGIN_PORT=${STRESS_ORIGIN_PORT:-8191}" \
            -v "$PWD":/repo -w /repo/tools/stress \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$DOCKER_BIN":/usr/bin/docker:ro \
            -v "$COMPOSE_PLUGIN":/usr/local/lib/docker/cli-plugins/docker-compose:ro \
            python:3.12-slim \
            bash -c "export PATH=/tmp/.local/bin:\$PATH && pip install -q -r requirements.txt && python3 -m pytest . -v --tb=short"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f tools/stress/docker-compose.yml -f tools/stress/docker-compose.prebuilt.yml logs --no-color --tail=400 worker nginx 2>/dev/null || docker compose -f tools/stress/docker-compose.yml -f tools/stress/docker-compose.prebuilt.yml logs --no-color --tail=400 || true
          # The nginx error log is written to a file inside the container, not to stderr.
          docker compose -f tools/stress/docker-compose.yml -f tools/stress/docker-compose.prebuilt.yml exec -T nginx sh -c 'tail -n 200 /var/log/nginx/error.log' || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/stress/docker-compose.yml \
            -f tools/stress/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true
          rm -rf tools/stress/testdata/generated

