#
# pipeline-nightly.yml -- the nightly tier, as a reusable workflow, called
# by nightly.yml (schedule 21:00 UTC + workflow_dispatch). See
# docs/ci/pipelines.md. The caller serializes nightlies (one group, never
# cancelled); this file carries no concurrency block.
#
# Jobs by class:
#   macOS (hosted macos-15, arm64)
#                 macos-build, macos-unit-tests, macos-pkg-smoke
#   fleet-heavy   periodic-vendor, periodic-build-x64, lint-full,
#                 css-fuzz-nightly, css-fuzz-shadow (dispatch only),
#                 the x64 legs (fleet only, they mount the container
#                 socket or run privileged containers):
#                 stress-x64, production-tests-x64, realworld-tests-x64,
#                 e2e-tests-x64, daemon-rig-soak-x64
#   fleet-light   async-css-probe-rendered
#   hosted arm64  periodic-build-arm64 and the arm64 legs: stress,
#                 production-tests, realworld-tests, e2e-tests,
#                 workbench-playwright
#   hosted        dep-scan-images (pulls and scans images from the x64 bundle,
#                 no C++ compile), and the report jobs (dep-scan-report,
#                 async-css-probe-report, css-fuzz-report), the only jobs
#                 that write to GitHub
#
# Left out:
#   * frozen-scan (the weekly scan of the frozen 2.0 release line): it scans
#     a tag of a repository that is not this one. It moves to the repository
#     that owns that tag.
#
# Findings never reach GitHub from a fleet runner. A fleet job uploads a
# small artifact (findings text, plus a marker that the lane ran); a hosted
# report job holding `issues: write` downloads it and files or closes the
# one tracking issue. The caller grants `issues: write` and `actions: read`;
# this file narrows them to the jobs that need them.
#
# Routing expression and guards are copied verbatim from docs/ci/pipelines.md;
# tools/ci/check-workflow-shape.sh enforces both. Artifacts carry a
# `nightly-` prefix.

name: pipeline-nightly

on:
  workflow_call:
    inputs:
      fuzz_seconds:
        description: libFuzzer time budget in seconds
        required: false
        type: string
        default: "600"

permissions:
  contents: read

jobs:
  event-guard:
    name: Event guard (refuses merge_group, unexpected events, refs and actors)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse events, refs and actors this pipeline must never run on
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ALLOWED: "schedule workflow_dispatch"
          ALLOWED_REFS: "refs/heads/main"
        run: |
          set -euo pipefail
          set -f
          case " ${ALLOWED} " in *" ${EVENT} "*) ;; *) echo "::error::event ${EVENT} is not allowed in this pipeline"; exit 1;; esac
          case "${REF}" in refs/heads/gh-readonly-queue/*) echo "::error::merge queue refs never run this pipeline"; exit 1;; esac
          ok=no
          # shellcheck disable=SC2254  # the allowed refs are globs on purpose
          for r in ${ALLOWED_REFS}; do case "${REF}" in ${r}) ok=yes;; esac; done
          [ "${ok}" = yes ] || { echo "::error::ref ${REF} is not allowed in this pipeline"; exit 1; }
          if [ "${EVENT}" = workflow_dispatch ] && [ "${ACTOR}" = "github-actions[bot]" ]; then echo "::error::dispatches made with a workflow token are not allowed"; exit 1; fi
          if [ "${EVENT}" = pull_request ] && { [ "${PR_FORK}" = true ] || [ "${PR_HEAD_REPO}" != "${REPOSITORY}" ]; }; then echo "::error::pull requests from forks are not allowed in this pipeline"; exit 1; fi
          echo "event ${EVENT} on ${REF} accepted"

  # ---------------------------------------------------------------------
  # macOS, daily (hosted macos-15, arm64). The hosted runner has no remote
  # cache and no hub, so builds restore a Bazel disk cache by prefix and
  # save it even when a step runs out of time: a cold first night converges
  # over the next ones. The build and pkg-smoke jobs stay under 30 minutes;
  # macos-unit-tests gets 50 (test step 40) because the worker_test shards
  # run uncached at 200 to 575 s each on three slots. Each step carries its
  # own, shorter timeout so the cache save can still run. At most five
  # macOS jobs run at once across the organization.
  # ---------------------------------------------------------------------
  macos-build:
    name: macOS Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp GIT_COMMIT
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Ensure bazel
        run: |
          if ! command -v bazel >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazel --version

      - name: Restore the Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/optimizer-bazel-disk-macos
          key: optimizer-bazel-disk-macos-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            optimizer-bazel-disk-macos-

      # Only the two shipped targets: the unit-test job below builds the
      # rest of the tree as part of its tests.
      - name: Build the shipped binaries
        timeout-minutes: 22
        run: |
          mkdir -p "${HOME}/.cache/optimizer-bazel-disk-macos"
          bazel build \
            --config=macos --jobs=3 --nostamp \
            --disk_cache="${HOME}/.cache/optimizer-bazel-disk-macos" \
            --experimental_disk_cache_gc_max_size=3G \
            //lib/pagespeed:libpagespeed.so //src/worker:factory_worker

      - name: Save the Bazel disk cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/optimizer-bazel-disk-macos
          key: optimizer-bazel-disk-macos-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage the build bundle
        run: |
          STAGING=".ci-artifacts"
          rm -rf "$STAGING"; mkdir -p "$STAGING"
          # Bazel names the target .so; the macOS output is a dylib.
          cp -f bazel-bin/lib/pagespeed/libpagespeed.so "$STAGING/libpagespeed.dylib"
          cp -f bazel-bin/src/worker/factory_worker "$STAGING/factory_worker"
          cat > "$STAGING/metadata.json" <<EOF
          {"commit":"${GITHUB_SHA}","branch":"${GITHUB_REF_NAME}","run":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}","platform":"osx-arm64","config":"macos","timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          cd "$STAGING"
          files=()
          for f in *; do
            [ "$f" = checksums.sha256 ] || files+=("$f")
          done
          shasum -a 256 -- "${files[@]}" > checksums.sha256
          echo "CI artifacts (osx-arm64):"
          ls -lh

      - name: Upload the build bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-ci-artifacts-osx-arm64
          path: .ci-artifacts
          retention-days: 3
          include-hidden-files: true

  macos-unit-tests:
    name: macOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp GIT_COMMIT
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Ensure bazel
        run: |
          if ! command -v bazel >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazel --version

      - name: Restore the Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/optimizer-bazel-disk-macos
          key: optimizer-bazel-disk-macos-test-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            optimizer-bazel-disk-macos-

      - name: Run unit tests
        timeout-minutes: 75
        run: |
          mkdir -p "${HOME}/.cache/optimizer-bazel-disk-macos"
          FLAGS=(--config=macos --jobs=3 --nostamp
                 "--disk_cache=${HOME}/.cache/optimizer-bazel-disk-macos"
                 --experimental_disk_cache_gc_max_size=3G)
          rc=0
          bazel test "${FLAGS[@]}" --nocache_test_results //test/... || rc=$?
          # Exit 37 is a crashed Bazel server: retry once.
          if [ "$rc" -eq 37 ]; then
            echo "Bazel server crashed (exit 37), retrying..."
            sleep 5
            rc=0
            bazel test "${FLAGS[@]}" --nocache_test_results //test/... || rc=$?
          fi
          exit "$rc"

      - name: Save the Bazel disk cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/optimizer-bazel-disk-macos
          key: optimizer-bazel-disk-macos-test-${{ github.run_id }}-${{ github.run_attempt }}

  macos-pkg-smoke:
    name: macOS Pkg Smoke
    needs: macos-build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-osx-arm64
          path: .ci-artifacts

      - name: Stage the native assets
        run: |
          chmod +x .ci-artifacts/factory_worker
          NATIVE_DIR="samples/aspnetcore/src/WeAmp.PageSpeed.NativeAssets.macOS/runtimes/osx-arm64/native"
          mkdir -p "$NATIVE_DIR/console"
          cp -f .ci-artifacts/libpagespeed.dylib "$NATIVE_DIR/libpagespeed.dylib"
          cp -f .ci-artifacts/factory_worker "$NATIVE_DIR/factory_worker"
          echo "<html><body>CI placeholder</body></html>" > "$NATIVE_DIR/console/index.html"
          ls -lh "$NATIVE_DIR/"

      - name: Verify factory_worker and libpagespeed.dylib
        run: |
          tools/ci/verify-artifacts.sh "$GITHUB_SHA" \
            "binary:${GITHUB_WORKSPACE}/.ci-artifacts/factory_worker" \
            "sharedlib:${GITHUB_WORKSPACE}/.ci-artifacts/libpagespeed.dylib"

      - name: Ensure .NET 10 SDK
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          if dotnet --list-sdks 2>/dev/null | grep -q '10\.'; then
            echo ".NET 10 SDK already installed"
          else
            echo "Installing .NET 10 SDK..."
            curl -sSL --http1.1 -o "${RUNNER_TEMP}/dotnet-install.sh" https://dot.net/v1/dotnet-install.sh
            bash "${RUNNER_TEMP}/dotnet-install.sh" --channel 10.0
          fi
          dotnet --list-sdks

      - name: Pack NuGet packages
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          cd samples/aspnetcore
          WEBSHELL_DIST="${GITHUB_WORKSPACE}/tools/workbench/packages/web-shell/dist"
          mkdir -p "$WEBSHELL_DIST"
          [ -s "$WEBSHELL_DIST/index.html" ] || \
            echo '<!doctype html><html><body>pkg-smoke stub</body></html>' > "$WEBSHELL_DIST/index.html"
          rm -rf nupkg
          dotnet restore --source https://api.nuget.org/v3/index.json
          dotnet pack src/WeAmp.PageSpeed.NativeAssets.macOS/WeAmp.PageSpeed.NativeAssets.macOS.csproj \
            -o nupkg --no-build --no-restore -c Release
          dotnet pack src/WeAmp.PageSpeed.NativeAssets.Linux/WeAmp.PageSpeed.NativeAssets.Linux.csproj \
            -o nupkg --no-restore -c Release
          dotnet pack src/WeAmp.PageSpeed.NativeAssets.Windows/WeAmp.PageSpeed.NativeAssets.Windows.csproj \
            -o nupkg --no-restore -c Release
          dotnet pack src/WeAmp.PageSpeed/WeAmp.PageSpeed.csproj \
            -o nupkg --no-restore -c Release
          dotnet pack src/WeAmp.PageSpeed.AspNetCore/WeAmp.PageSpeed.AspNetCore.csproj \
            -o nupkg --no-restore -c Release
          ls -lh nupkg/

      - name: Run smoke tests
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          bash samples/aspnetcore/scripts/smoke-test.sh samples/aspnetcore/nupkg

      - name: Upload smoke crash dumps
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-smoke-crash-dump-macos
          path: ${{ runner.temp }}/smoke-crash-dumps/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Periodic lanes: build once with the optimized configuration, test
  # everywhere. The x64 build and legs run on the fleet; the arm64 build and
  # legs run on hosted arm64 runners.
  # ---------------------------------------------------------------------
  periodic-vendor:
    name: Vendor Dependencies (nightly)
    needs: event-guard
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 45
    outputs:
      short_sha: ${{ steps.stamp.outputs.short_sha }}
      channel: ${{ steps.renv.outputs.channel }}
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect runner environment
        id: renv
        run: |
          # The vendored tree reaches consumer jobs through a runner-local
          # vendor dir or the hub when the runner environment provides it,
          # and through actions/cache otherwise (docs/ci/runner-environment.md).
          channel=cache
          if [ -n "${CI_VENDOR_DIR:-}" ] || { [ -n "${CI_HUB_SSH:-}" ] && [ -n "${CI_HUB_VENDOR_DIR:-}" ]; }; then
            channel=hub
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "vendor distribution channel: ${channel}"

      - name: Ensure bazel
        run: |
          if command -v bazel >/dev/null 2>&1; then bazel --version; exit 0; fi
          if command -v npm >/dev/null 2>&1; then
            npm install -g @bazel/bazelisk@1.28.1 2>/dev/null || sudo npm install -g @bazel/bazelisk@1.28.1
          fi
          command -v bazel >/dev/null 2>&1 || {
            echo "::error::bazel is not on PATH and could not be installed via npm; see docs/ci/runner-environment.md"
            exit 1
          }
          bazel --version

      # Cache channel (hosted, or a fleet runner without hub configuration):
      # vendor/ rides actions/cache between jobs, keyed on the vendor
      # manifest so a dependency bump re-vendors exactly once.
      - name: Restore vendored dependencies (cache channel)
        if: steps.renv.outputs.channel == 'cache'
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: optimizer-vendor-${{ hashFiles('MODULE.bazel', '.bazelversion', 'bazel/**', 'third_party/**') }}

      - name: Cache the Bazel repository cache (cache channel)
        if: steps.renv.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/optimizer-bazel-repo
          key: optimizer-repo-cache-${{ hashFiles('MODULE.bazel', '.bazelversion', 'bazel/**', 'third_party/**') }}
          restore-keys: |
            optimizer-repo-cache-

      - name: Vendor all dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          bazel vendor --vendor_dir=vendor "--repository_cache=${HOME}/.cache/optimizer-bazel-repo" //...
          if [ -d vendor/cyclone ]; then
            echo "Cyclone commit: $(git -C vendor/cyclone rev-parse HEAD 2>/dev/null || echo 'not a git repo')"
          fi

      # Hub channel only: stamp + tar the tree (source, vendor/, GIT_COMMIT)
      # for the consumer jobs. On the cache channel consumers get the same
      # tree from their own checkout plus the cached vendor/.
      - name: Stamp GIT_COMMIT
        if: steps.renv.outputs.channel == 'hub'
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Create the source tarball
        if: steps.renv.outputs.channel == 'hub'
        id: tarball
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          LOCAL_DIR="${CI_VENDOR_DIR:-${RUNNER_TEMP}}"
          mkdir -p "${LOCAL_DIR}"
          TARBALL="${LOCAL_DIR}/pagespeed-optimizer-${SHORT_SHA}.tar.zst"
          # Short-circuit re-runs: a complete tarball for this SHA was
          # published atomically by a prior run. A readable file that fails
          # `zstd -t` is not trusted and is tarred again. Re-stamp it so the
          # age-based prunes count from now.
          if [ -r "$TARBALL" ] && zstd -t -q "$TARBALL" >/dev/null 2>&1; then
            echo "Tarball for ${SHORT_SHA} present and readable; skipping re-tar"
            touch "$TARBALL"
          else
            # The temp file is runner-private (the runner's own temp dir) and
            # carries the run id and attempt: the long write never happens in
            # the vendor dir that sibling runners prune and read, and the
            # publish step copies it in under a unique name before linking.
            TMP_TARBALL="${RUNNER_TEMP:-/tmp}/$(basename "$TARBALL").${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tmp"
            rm -f "${TMP_TARBALL}"
            # Stop the Bazel server the vendor step left running so nothing
            # writes to the tree while it is archived.
            bazel shutdown || true
            # Status 1 is accepted only when the sole complaint is the workspace
            # root directory changing (no file contents); a changed file is torn.
            TAR_ERR="${RUNNER_TEMP:-/tmp}/tar-err-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            set +e
            tar --zstd --dereference --mode='u+w' -cf "${TMP_TARBALL}" \
              --exclude='.git' \
              --exclude='bazel-*' \
              . 2>"${TAR_ERR}"
            tar_rc=$?
            set -e
            if [ "$tar_rc" -eq 1 ] && ! grep -v -x -e '' -e 'tar: .: file changed as we read it' "${TAR_ERR}" | grep -q .; then
              echo "::notice::workspace root changed during archiving; archive accepted"
            elif [ "$tar_rc" -ne 0 ]; then
              while IFS= read -r line; do echo "::error::${line}"; done < "${TAR_ERR}"
              echo "::error::tar failed with status ${tar_rc}"
              exit "$tar_rc"
            fi
          fi
          # Publish create-if-absent and write the digest sidecar
          # (tools/ci/publish-vendor-tarball.sh): a same-SHA tarball another
          # writer published first is adopted, never replaced.
          VENDOR_VERIFY_ZSTD=1 bash tools/ci/publish-vendor-tarball.sh "$TARBALL" ${TMP_TARBALL:+"$TMP_TARBALL"}
          # Prune other SHAs' tarballs from the shared local dir, but only
          # past a grace window (a recent tarball may still be extracting in
          # a concurrent run) and only while file times agree with this
          # host's clock (tools/ci/prune-vendor-dir.sh). Sidecars go with
          # their tarball; *.tmp sweeps cancelled runs.
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            bash tools/ci/prune-vendor-dir.sh "${CI_VENDOR_DIR}" pagespeed-optimizer "${SHORT_SHA}" 120
          fi
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          # Name and size only: the directory is a runner-local path.
          echo "Tarball: $(basename "$TARBALL") ($(du -h "$TARBALL" | cut -f1))"

      - name: Publish the tarball to the hub
        if: steps.renv.outputs.channel == 'hub'
        run: |
          # The ssh remote commands interpolate this runner's environment
          # client-side on purpose: the values are defined by the runner
          # environment contract (docs/ci/runner-environment.md), never
          # logged, and the remote side needs them as literals.
          if [ -z "${CI_HUB_SSH:-}" ] || [ -z "${CI_HUB_VENDOR_DIR:-}" ]; then
            echo "::notice::CI_HUB_SSH/CI_HUB_VENDOR_DIR not set: the vendor tarball stays on this runner. Consumers on other runners fail with a recovery hint; configure the runner environment or use the cache channel (docs/ci/runner-environment.md)."
            exit 0
          fi
          TARBALL="${{ steps.tarball.outputs.tarball }}"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o LogLevel=ERROR"
          F="$(basename "$TARBALL")"
          TMP_DEST="${CI_HUB_VENDOR_DIR}/${F}.${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME//[^A-Za-z0-9_.-]/_}.tmp"
          # The digest of the local tarball (the publish step above wrote its
          # sidecar): the hub side checks the transferred bytes against it.
          DIGEST="$(cut -d' ' -f1 "${TARBALL}.sha256")"
          # Publish ON the hub with the same script the local publish used,
          # streamed over ssh: create-if-absent (a sound published tarball is
          # never replaced), flushed before the link, digest checked, sidecar
          # written through a temp name. The remote commands expand
          # client-side on purpose.
          # SSH_OPTS is an intentional multi-token option list.
          # shellcheck disable=SC2029,SC2086
          for attempt in 1 2 3; do
            if ssh ${SSH_OPTS} "${CI_HUB_SSH}" "mkdir -p '${CI_HUB_VENDOR_DIR}'" \
               && rsync -a -e "ssh ${SSH_OPTS}" "$TARBALL" "${CI_HUB_SSH}:${TMP_DEST}" \
               && ssh ${SSH_OPTS} "${CI_HUB_SSH}" \
                    "GITHUB_RUN_ID='${GITHUB_RUN_ID}' GITHUB_RUN_ATTEMPT='${GITHUB_RUN_ATTEMPT}' VENDOR_EXPECT_SHA256='${DIGEST}' VENDOR_VERIFY_ZSTD=1 bash -s -- '${CI_HUB_VENDOR_DIR}/${F}' '${TMP_DEST}'" \
                    < tools/ci/publish-vendor-tarball.sh; then
              echo "Published ${F} to the CI hub (attempt ${attempt})"
              # Prune hub tarballs older than the retention window: the hub
              # copy is the only one a rerun-failed-jobs consumer can reach
              # once the local copy is gone.
              ssh ${SSH_OPTS} "${CI_HUB_SSH}" \
                "bash -s -- '${CI_HUB_VENDOR_DIR}' pagespeed-optimizer - ${CI_HUB_VENDOR_RETENTION_MIN:-1440}" \
                < tools/ci/prune-vendor-dir.sh 2>/dev/null || true
              exit 0
            fi
            echo "::warning::hub publish failed (attempt ${attempt}/3)"
            [ "$attempt" -lt 3 ] && sleep 5
          done
          echo "::error::hub publish failed after 3 attempts"
          exit 1

      - name: Stamp outputs
        id: stamp
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  periodic-build-x64:
    name: Build (x64)
    needs: periodic-vendor
    runs-on: ${{ (vars.FLEET_ENABLED == 'false' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'))) && 'ubuntu-latest' || 'fleet-heavy' }}
    timeout-minutes: 60
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vendored dependencies (cache channel)
        if: needs.periodic-vendor.outputs.channel == 'cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: optimizer-vendor-${{ hashFiles('MODULE.bazel', '.bazelversion', 'bazel/**', 'third_party/**') }}
          fail-on-cache-miss: true

      - name: Extract the vendored workspace (hub channel)
        if: needs.periodic-vendor.outputs.channel == 'hub'
        run: |
          args=(--sha "${{ needs.periodic-vendor.outputs.short_sha }}" --dest "${GITHUB_WORKSPACE}" --prefix pagespeed-optimizer)
          if [ -n "${CI_VENDOR_DIR:-}" ]; then
            args+=(--local "${CI_VENDOR_DIR}/pagespeed-optimizer-${{ needs.periodic-vendor.outputs.short_sha }}.tar.zst")
          fi
          bash tools/ci/extract-vendor-tarball.sh "${args[@]}"

      - name: Verify GIT_COMMIT stamp (hub channel)
        if: needs.periodic-vendor.outputs.channel == 'hub'
        run: bash tools/ci/verify-artifacts.sh "$GITHUB_SHA" "stamp:${GITHUB_WORKSPACE}/GIT_COMMIT"

      - name: Docker preflight
        run: tools/ci/docker-preflight.sh

      - name: Ensure the dev image
        run: |
          # Content-hashed tag and a per-host flock around the build
          # (tools/ci/ensure-dev-image.sh). A hosted runner builds it cold.
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest x64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      - name: Stamp GIT_COMMIT
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Build optimized test binaries
        run: |
          # Per-slot budget (CI_SLOT_CPUS / CI_SLOT_MEM_GB); legacy values when unset.
          source "${GITHUB_WORKSPACE}/tools/ci/slot-budget.sh"
          slot_budget 55g || exit 1
          OUT="${GITHUB_WORKSPACE}/.ci-artifacts"
          rm -rf "${OUT}"; mkdir -p "${OUT}"
          EXTRA_DOCKER=()
          BAZEL_CONFIG="--config=docker --config=opt --jobs=${SLOT_JOBS} --nostamp"
          if [ -n "${BAZEL_CACHE_HOST:-}" ]; then
            EXTRA_DOCKER+=(--add-host="bazel-remote-cache:${BAZEL_CACHE_HOST}")
            BAZEL_CONFIG="--config=ci --config=opt"
          else
            echo "::notice::BAZEL_CACHE_HOST not set: building without the remote cache (docs/ci/runner-environment.md)"
          fi
          docker run --rm --init "${EXTRA_DOCKER[@]}" \
            --memory="${SLOT_MEM}" --memory-swap="${SLOT_MEM}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace \
            -e BAZEL_CONFIG="${BAZEL_CONFIG}${SLOT_CPUS:+ --jobs=${SLOT_CPUS}}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out \
                build --vendor_dir=vendor ${BAZEL_CONFIG} \
                //lib/pagespeed:libpagespeed.so //src/worker:factory_worker \
                //src/nginx:ngx_pagespeed_module.so //tools:seed_test_cache
              ROOT=/tmp/bazel-out
              SO=$(find "$ROOT" -path "*/bin/lib/pagespeed/libpagespeed.so" -type f | head -1)
              FW=$(find "$ROOT" -path "*/bin/src/worker/factory_worker" -not -path "*.runfiles*" -type f | head -1)
              NGX=$(find "$ROOT" -path "*/bin/src/nginx/ngx_pagespeed_module.so" -type f | head -1)
              STC=$(find "$ROOT" -path "*/bin/tools/seed_test_cache" -not -path "*.runfiles*" -type f | head -1)
              OUT=/workspace/.ci-artifacts
              cp "$SO" "$OUT/libpagespeed.so"
              cp "$FW" "$OUT/factory_worker"
              cp "$NGX" "$OUT/ngx_pagespeed_module.so"
              # The prebuilt test image runs it in the nginx container for the
              # HTTP-compliance sidecar tests; deps are shared with
              # factory_worker so this is one small link on a warm cache.
              cp "$STC" "$OUT/seed_test_cache"
              # Record the exact nginx version this module was built against
              # so stage-artifacts.sh and the prebuilt runtime image pin their
              # nginx to it (a module refuses to load into another version).
              ls -d /nginx-src/nginx-*/ | head -1 | sed "s#.*/nginx-##; s#/##" > "$OUT/nginx-version"
              echo "Recorded module nginx-version: $(cat "$OUT/nginx-version")"
            '

      # Distinct platform name: this is the optimized bundle, which the
      # staging helper must not confuse with the PR tier's fastbuild bundle.
      - name: Finalize the build bundle
        run: |
          STAGING="${GITHUB_WORKSPACE}/.ci-artifacts"
          cat > "$STAGING/metadata.json" <<EOF
          {"commit":"${GITHUB_SHA}","branch":"${GITHUB_REF_NAME}","run":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}","platform":"linux-x64-periodic","config":"periodic+opt","timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          cd "$STAGING"
          files=()
          for f in *; do
            [ "$f" = checksums.sha256 ] || files+=("$f")
          done
          sha256sum -- "${files[@]}" > checksums.sha256
          echo "CI artifacts (linux-x64, periodic):"
          ls -lh "$STAGING/"

      - name: Upload the build bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-ci-artifacts-linux-x64
          path: .ci-artifacts
          retention-days: 3
          include-hidden-files: true

  periodic-build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp GIT_COMMIT
        run: echo -n "$GITHUB_SHA" > GIT_COMMIT

      - name: Restore the Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/optimizer-bazel-disk-arm64
          key: optimizer-bazel-disk-arm64-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            optimizer-bazel-disk-arm64-

      - name: Docker preflight
        run: tools/ci/docker-preflight.sh

      - name: Ensure the dev image
        run: |
          CONTENT_IMAGE=$(bash tools/ci/ensure-dev-image.sh --tag-latest arm64 docker)
          echo "DOCKER_IMAGE=${CONTENT_IMAGE}" >> "$GITHUB_ENV"

      - name: Build optimized test binaries
        run: |
          OUT="${GITHUB_WORKSPACE}/.ci-artifacts"
          rm -rf "${OUT}"; mkdir -p "${OUT}"
          mkdir -p "${HOME}/.cache/optimizer-bazel-disk-arm64"
          docker run --rm --init \
            --user "$(id -u):$(id -g)" -e HOME=/workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${HOME}/.cache/optimizer-bazel-disk-arm64:/cache" \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -e
              FLAGS="--vendor_dir=vendor --config=docker --config=opt --jobs=HOST_CPUS*.75 --nostamp --disk_cache=/cache --experimental_disk_cache_gc_max_size=2G"
              # vendor/ is absent on this hosted job; Bazel then fetches.
              [ -d vendor ] || FLAGS="${FLAGS/--vendor_dir=vendor /}"
              # shellcheck disable=SC2086
              bazel --output_user_root=/tmp/bazel-out build $FLAGS \
                //lib/pagespeed:libpagespeed.so //src/worker:factory_worker \
                //src/nginx:ngx_pagespeed_module.so //tools:seed_test_cache
              ROOT=/tmp/bazel-out
              SO=$(find "$ROOT" -path "*/bin/lib/pagespeed/libpagespeed.so" -type f | head -1)
              FW=$(find "$ROOT" -path "*/bin/src/worker/factory_worker" -not -path "*.runfiles*" -type f | head -1)
              NGX=$(find "$ROOT" -path "*/bin/src/nginx/ngx_pagespeed_module.so" -type f | head -1)
              STC=$(find "$ROOT" -path "*/bin/tools/seed_test_cache" -not -path "*.runfiles*" -type f | head -1)
              OUT=/workspace/.ci-artifacts
              cp "$SO" "$OUT/libpagespeed.so"
              cp "$FW" "$OUT/factory_worker"
              cp "$NGX" "$OUT/ngx_pagespeed_module.so"
              # The prebuilt test image runs it in the nginx container for the
              # HTTP-compliance sidecar tests; deps are shared with
              # factory_worker so this is one small link on a warm cache.
              cp "$STC" "$OUT/seed_test_cache"
              ls -d /nginx-src/nginx-*/ | head -1 | sed "s#.*/nginx-##; s#/##" > "$OUT/nginx-version"
              echo "Recorded module nginx-version: $(cat "$OUT/nginx-version")"
            '

      - name: Finalize the build bundle
        run: |
          STAGING="${GITHUB_WORKSPACE}/.ci-artifacts"
          cat > "$STAGING/metadata.json" <<EOF
          {"commit":"${GITHUB_SHA}","branch":"${GITHUB_REF_NAME}","run":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}","platform":"linux-arm64-periodic","config":"periodic+opt","timestamp":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          cd "$STAGING"
          files=()
          for f in *; do
            [ "$f" = checksums.sha256 ] || files+=("$f")
          done
          sha256sum -- "${files[@]}" > checksums.sha256
          echo "CI artifacts (linux-arm64, periodic):"
          ls -lh "$STAGING/"

      - name: Upload the build bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-ci-artifacts-linux-arm64
          path: .ci-artifacts
          retention-days: 3
          include-hidden-files: true

  # ---------------------------------------------------------------------
  # arm64 legs (hosted arm64). Each runs on its own runner, so the compose
  # ports and the container socket they use belong to that job alone.
  # ---------------------------------------------------------------------
  stress:
    name: Stress Tests
    needs: periodic-build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several runner slots share one host and every stack publishes fixed
      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-arm64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-arm64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Build Docker images (prebuilt)
        run: |
          docker compose -f tools/stress/docker-compose.yml \
            -f tools/stress/docker-compose.prebuilt.yml build

      - name: Generate test data and start services
        run: |
          cd tools/stress
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -v "$PWD/testdata:/testdata" -w /testdata python:3.12-slim \
            bash -c "pip install -q Pillow==13.0.0 && python3 generate_testdata.py"
          docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up -d
          STRESS_PORT="${STRESS_NGINX_PORT:-8190}"
          NGINX_READY=0
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${STRESS_PORT}/" >/dev/null 2>&1; then
              echo "Nginx ready after ${i}s"; NGINX_READY=1; break
            fi
            sleep 1
          done
          # Loud failure on startup skew, not a silent fall-through.
          if [ "$NGINX_READY" -ne 1 ]; then
            echo "::error::Nginx did not become ready within 60s - dumping nginx logs."
            docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml ps
            NGINX_LOG="$(docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml logs --no-color --tail=200 nginx 2>&1)"
            echo "--- docker compose logs nginx (last 200) ---"
            echo "$NGINX_LOG"
            if echo "$NGINX_LOG" | grep -q 'module.*version'; then
              echo "::error::nginx ABI skew detected (module vs runtime NGINX_VERSION_NUM): $(echo "$NGINX_LOG" | grep -m1 'module.*version')"
            fi
            exit 1
          fi
          sleep 2

      - name: Run stress tests
        run: |
          # Stage a Linux CLI + compose plugin where the DAEMON can bind-mount them
          # (copies host binaries on Linux, downloads static builds on macOS; see the script).
          eval "$(tools/ci/stage-docker-cli.sh)"
          DOCKER_GID="$(stat -c '%g' /var/run/docker.sock 2>/dev/null || stat -f '%g' /var/run/docker.sock 2>/dev/null || echo 0)"
          case "$DOCKER_GID" in ''|*[!0-9]*) DOCKER_GID=0 ;; esac
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" --group-add "$DOCKER_GID" --group-add 0 \
            -e HOME=/tmp \
            -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -e STRESS_COMPOSE_FILE="/repo/tools/stress/docker-compose.yml:/repo/tools/stress/docker-compose.prebuilt.yml" \
            -e STRESS_PROACTIVE_DEADLINE=240 \
            -e "STRESS_NGINX_PORT=${STRESS_NGINX_PORT:-8190}" \
            -e "STRESS_ORIGIN_PORT=${STRESS_ORIGIN_PORT:-8191}" \
            -v "$PWD":/repo -w /repo/tools/stress \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$DOCKER_BIN":/usr/bin/docker:ro \
            -v "$COMPOSE_PLUGIN":/usr/local/lib/docker/cli-plugins/docker-compose:ro \
            python:3.12-slim \
            bash -c "export PATH=/tmp/.local/bin:\$PATH && pip install -q -r requirements.txt && python3 -m pytest . -v --tb=short"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f tools/stress/docker-compose.yml -f tools/stress/docker-compose.prebuilt.yml logs --no-color --tail=400 worker nginx 2>/dev/null || docker compose -f tools/stress/docker-compose.yml -f tools/stress/docker-compose.prebuilt.yml logs --no-color --tail=400 || true
          # The nginx error log is written to a file inside the container, not to stderr.
          docker compose -f tools/stress/docker-compose.yml -f tools/stress/docker-compose.prebuilt.yml exec -T nginx sh -c 'tail -n 200 /var/log/nginx/error.log' || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/stress/docker-compose.yml \
            -f tools/stress/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true
          rm -rf tools/stress/testdata/generated

  production-tests:
    name: Production Readiness
    needs: periodic-build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several runner slots share one host and every stack publishes fixed
      # host ports; move this job's ports by a per-runner offset.
      - name: Per-runner host ports
        run: |
          . tools/ci/runner-ports.sh
          for v in $RUNNER_PORT_VARS; do eval "p=\${$v}"; echo "$v=$p"; done >> "$GITHUB_ENV"

      - name: Download the build bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ci-artifacts-linux-arm64
          path: ${{ runner.temp }}/bundle/.ci-artifacts

      - name: Stage CI artifacts
        env:
          CI_ARTIFACTS_PLATFORM: linux-arm64-periodic
        run: tools/ci/stage-artifacts.sh "${RUNNER_TEMP}/bundle"

      - name: Build Docker images (prebuilt)
        run: |
          docker compose -f tools/production-tests/docker-compose.yml \
            -f tools/production-tests/docker-compose.prebuilt.yml build

      - name: Start production stack
        run: |
          docker compose -f tools/production-tests/docker-compose.yml \
            -f tools/production-tests/docker-compose.prebuilt.yml up -d --no-build
          for i in $(seq 1 60); do
            if docker compose -f tools/production-tests/docker-compose.yml \
              -f tools/production-tests/docker-compose.prebuilt.yml ps --format json | python3 -c "
          import sys, json
          services = [json.loads(line) for line in sys.stdin if line.strip()]
          all_healthy = all(s.get('Health','') == 'healthy' for s in services if s.get('Health'))
          running = all(s.get('State','') == 'running' for s in services)
          sys.exit(0 if (all_healthy and running) else 1)
          " 2>/dev/null; then
                echo "All services healthy after ${i}s"
                break
            fi
            sleep 2
          done

      - name: Run production readiness tests
        run: |
          # Stage a Linux CLI + compose plugin where the DAEMON can bind-mount them
          # (copies host binaries on Linux, downloads static builds on macOS; see the script).
          eval "$(tools/ci/stage-docker-cli.sh)"
          DOCKER_GID="$(stat -c '%g' /var/run/docker.sock 2>/dev/null || stat -f '%g' /var/run/docker.sock 2>/dev/null || echo 0)"
          case "$DOCKER_GID" in ''|*[!0-9]*) DOCKER_GID=0 ;; esac
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" --group-add "$DOCKER_GID" --group-add 0 \
            -e HOME=/tmp \
            -e PIP_USER=1 -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -e "PRODTEST_NGINX_PORT=${PRODTEST_NGINX_PORT:-8200}" \
            -e "PRODTEST_ORIGIN_PORT=${PRODTEST_ORIGIN_PORT:-8201}" \
            -v "$PWD":/repo -w /repo/tools/production-tests \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$DOCKER_BIN":/usr/bin/docker:ro \
            -v "$COMPOSE_PLUGIN":/usr/local/lib/docker/cli-plugins/docker-compose:ro \
            python:3.12-slim \
            bash -c "export PATH=/tmp/.local/bin:\$PATH && pip install -q pytest==9.1.1 requests==2.34.2 && pytest tests/ -v --tb=short -p no:cacheprovider"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose -f tools/production-tests/docker-compose.yml -f tools/production-tests/docker-compose.prebuilt.yml logs --no-color --tail=400 worker nginx 2>/dev/null || docker compose -f tools/production-tests/docker-compose.yml -f tools/production-tests/docker-compose.prebuilt.yml logs --no-color --tail=400 || true
          # The nginx error log is written to a file inside the container, not to stderr.
          docker compose -f tools/production-tests/docker-compose.yml -f tools/production-tests/docker-compose.prebuilt.yml exec -T nginx sh -c 'tail -n 200 /var/log/nginx/error.log' || true

      - name: Teardown
        if: always()
        run: |
          docker compose -f tools/production-tests/docker-compose.yml \
            -f tools/production-tests/docker-compose.prebuilt.yml \
            down --remove-orphans -v 2>/dev/null || true

  realworld-tests:
    name: Real-World Proxy
    needs: periodic-build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Unlock a previous run's vendored toolchain files
        # bazel vendor leaves read-only toolchain directories under vendor/;
        # checkout's cleanup cannot remove them on a persistent runner.
        run: |
          [ -d "${GITHUB_WORKSPACE}/vendor" ] && chmod -R u+w "${GITHUB_WORKSPACE}/vendor" 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

