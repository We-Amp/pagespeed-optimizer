#
# Nightly caller: schedule and manual dispatch. The nightly jobs live in
# pipeline-nightly.yml and the full tier in pipeline-full.yml (job `full`),
# both pinned to main. Every scheduled night runs both; a dispatch runs the
# full tier only with full_tier set. See docs/ci/pipelines.md.

name: Nightly

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: libFuzzer time budget in seconds
        required: false
        default: "600"
      full_tier:
        description: Also run the full tier (default branch only)
        type: boolean
        default: false

# One nightly at a time; a running nightly is never cancelled.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    # The ceiling for the called workflow: it can narrow these, never widen
    # them. Only its hosted report jobs use issues: write, and only the
    # manual shadow lane reads actions.
    permissions:
      contents: read
      issues: write
      actions: read
    uses: We-Amp/pagespeed-optimizer/.github/workflows/pipeline-nightly.yml@main
    with:
      fuzz_seconds: ${{ inputs.fuzz_seconds || '600' }}

  # The full tier, named `full` like the push tier's call in ci.yml, so its
  # checks read `full / <job name>` in both. It runs on every scheduled night
  # and on a dispatch with full_tier set: the make-up path for a missed or
  # late night. The dispatch path also needs the default branch, so a
  # dispatch on ci-dev or any other ref never reaches it. It shares the
  # `nightly` concurrency group above, so it never starts while another
  # nightly is pending or running. A release-candidate nightly dispatch keeps
  # full_tier false: the candidate's CI dispatch with full=true covers the
  # full tier. pipeline-full.yml asks for no job-level permission beyond its
  # top-level contents: read; actions: read matches the grant of the push
  # tier's call in ci.yml. A called workflow cannot exceed what its caller
  # grants, and a missing grant fails the whole run at startup.
  full:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_tier && github.ref == 'refs/heads/main')
    permissions:
      actions: read
      contents: read
    uses: We-Amp/pagespeed-optimizer/.github/workflows/pipeline-full.yml@main
