# The daemon scopes its volume/sockets 0660
# owner+group.  In this TEST harness the worker container runs as root (the
# production peer model is group `pagespeed`, asserted by the package-smoke
# rig), so the nginx workers must run as root too to share the cache — the
# harness validates function, not the permission model.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_pagespeed_module.so;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    server {
        listen 8080;

        # Worker socket and HTML toggle auto-discovered from shared config
        pagespeed on;
        pagespeed_cache_path /shared/cache.vol;
        pagespeed_cache_mode aggressive;

        location / {
            proxy_pass http://origin:8081;
            proxy_set_header Host $host;

            # Ensure origin sends uncompressed; PageSpeed caches raw bytes
            proxy_set_header Accept-Encoding "";
        }

        # Compressed-origin location: deliberately does NOT strip
        # Accept-Encoding.  Tests the P0 Content-Encoding guard
        # (Phase 1.1) which prevents cache corruption.
        location /gzip-origin/ {
            pagespeed on;
            proxy_pass http://compressed-origin:8082/;
            proxy_set_header Host $host;
            # Force gzip from origin regardless of client headers,
            # simulating a misconfigured origin that always compresses.
            proxy_set_header Accept-Encoding "gzip";
        }
    }
}
