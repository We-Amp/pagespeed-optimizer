# Compose override: use pre-built CI artifacts instead of building from source.
#
# Usage:
#   docker compose -f tools/async-css-probe/docker-compose.yml \
#                  -f tools/async-css-probe/docker-compose.prebuilt.yml up -d

services:
  worker:
    build:
      context: ../../
      dockerfile: tools/e2e/Dockerfile.prebuilt
  nginx:
    build:
      context: ../../
      dockerfile: tools/e2e/Dockerfile.prebuilt
