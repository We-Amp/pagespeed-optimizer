# The daemon scopes its volume/sockets 0660
# owner+group.  In this TEST harness the worker container runs as root (the
# production peer model is group `pagespeed`, asserted by the package-smoke
# rig), so the nginx workers must run as root too to share the cache — the
# harness validates function, not the permission model.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_pagespeed_module.so;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    server {
        listen 8080;

        # System under test: the fixture served THROUGH PageSpeed.
        location / {
            # Worker socket and HTML toggle auto-discovered from the shared
            # config the worker writes.
            pagespeed on;
            pagespeed_cache_path /shared/cache.vol;

            proxy_pass http://origin:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # Origin must send uncompressed; PageSpeed caches raw bytes.
            proxy_set_header Accept-Encoding "";
        }

        # Control: the same bytes with PageSpeed off. The markup lane asserts
        # this path carries no rewrite markers, so a leak of PageSpeed into the
        # control path cannot go unnoticed. Nothing diffs renders against it
        # today — the rendered lane compares the served page against itself with
        # the deferred sheet demoted.
        location /baseline/ {
            pagespeed off;

            rewrite ^/baseline/(.*)$ /$1 break;

            proxy_pass http://origin:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";
        }
    }
}
