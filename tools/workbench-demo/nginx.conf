# The daemon scopes its volume/sockets 0660
# owner+group.  In this TEST harness the worker container runs as root (the
# production peer model is group `pagespeed`, asserted by the package-smoke
# rig), so the nginx workers must run as root too to share the cache - the
# harness validates function, not the permission model.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_pagespeed_module.so;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    # Astro's @astrojs/node SSR adapter uses the Host header to make
    # internal fetch() calls during error rendering (404 etc).  When the
    # Host value resolves to port 80 (no port suffix), the adapter
    # connects to the wrong port and hangs.  $astro_host always includes
    # the Astro port (4321) so internal fetches succeed.
    map $host $astro_host {
        default "$host:4321";
    }

    server {
        listen 8080;
        absolute_redirect off;

        # Worker socket and HTML toggle auto-discovered from shared config
        pagespeed on;
        pagespeed_cache_path /shared/cache.vol;

        # Internal error page handler - serves the Astro 404 page with
        # pagespeed bypassed.  Referenced by error_page directives in the
        # content-serving locations below (not at server scope, so /v1/
        # and /console/ return their own native error responses).
        location = /404.html {
            proxy_pass http://website:4321/404.html;
            proxy_set_header Host $astro_host;
            proxy_set_header Accept-Encoding "";
            pagespeed off;
            internal;
        }

        # The worker's management API requires a bearer
        # token, and it also gates /console/ -- so without a credential on the
        # path the console SPA never loads at all. This harness therefore does
        # what the intended topology does in production: a trusted reverse
        # proxy in front of the management API holds the credential and adds it
        # on the way through, so the browser never has to. Kept in lockstep
        # with the default in tools/workbench-demo/entrypoint-worker-demo.sh.
        set $ps_api_token "workbench-demo-token";

        # Web console - reverse proxy to worker SvelteKit SPA
        location /console/ {
            pagespeed off;
            proxy_pass http://worker:9880/console/;
            proxy_set_header Authorization "Bearer $ps_api_token";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Legal pages - frameable by console (strip X-Frame-Options for iframe embedding)
        location = /privacy/ {
            pagespeed off;
            proxy_pass http://website:4321;
            proxy_set_header Host $astro_host;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }
        location = /terms/ {
            pagespeed off;
            proxy_pass http://website:4321;
            proxy_set_header Host $astro_host;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # Worker API - used by the web console
        location /v1/ {
            pagespeed off;
            proxy_pass http://worker:9880/v1/;
            proxy_set_header Authorization "Bearer $ps_api_token";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Normalize /path/index.html → /path/ so both forms share the
        # same cache key.  Without this, explicit index.html requests
        # bypass the optimized cache entry.
        rewrite ^(.*/)index\.html$ $1 redirect;

        # ── SEO redirects ──────────────────────────────────────────
        # Astro 5 standalone adapter only runs middleware for SSR routes,
        # so redirect logic must live here in nginx.

        # Old /doc/* pages with new 2.0 equivalents
        location = /doc              { return 301 /docs/; }
        location = /doc/             { return 301 /docs/; }
        location = /doc/index        { return 301 /docs/; }
        location = /doc/configuration { return 301 /docs/configuration/; }
        location = /doc/build_ngx_pagespeed_from_source { return 301 /docs/installation-module/; }
        location = /doc/build_from_source { return 301 /docs/installation-module/; }
        location = /doc/build_mod_pagespeed_from_source { return 301 /docs/installation-module/; }
        location = /doc/download     { return 301 /docs/installation-docker/; }
        location = /doc/system       { return 301 /docs/deployment/; }
        location = /doc/faq          { return 301 /docs/troubleshooting/; }
        location = /doc/admin        { return 301 /docs/api-reference/; }
        location = /doc/console      { return 301 /docs/api-reference/; }

        # Catch-all: /doc/* → /1.0/doc/* (archive fallback)
        location /doc/ {
            return 301 /1.0$request_uri;
        }

        # Dropped sections
        location /examples/ { return 301 /features/; }
        location /psol/     { return 301 /docs/api-reference/; }

        # ── Legacy 1.0 docs ───────────────────────────────────────

        # Extensionless /1.0/doc/* URLs → serve .html transparently
        location ~ ^(/1\.0/doc/[^/.]+)$ {
            pagespeed off;
            error_page 404 502 504 =404 /404.html;
            proxy_intercept_errors on;
            proxy_pass http://website:4321$1.html;
            proxy_set_header Host $astro_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";
        }

        # Legacy 1.0 content - bypass PageSpeed, proxy to Astro
        location /1.0/ {
            pagespeed off;
            error_page 404 502 504 =404 /404.html;
            proxy_intercept_errors on;
            proxy_pass http://website:4321;
            proxy_set_header Host $astro_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";
        }

        # Demo content - proxy to origin (Python HTTP server)
        location /demos/ {
            error_page 404 502 504 =404 /404.html;
            proxy_intercept_errors on;
            proxy_pass http://origin:8081;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
        }

        # API endpoints (webhooks) - bypass PageSpeed
        location /api/ {
            pagespeed off;
            error_page 404 502 504 =404 /404.html;
            proxy_intercept_errors on;
            proxy_pass http://website:4321;
            proxy_set_header Host $astro_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Main location - proxy to Astro SSR website
        location / {
            error_page 404 502 504 =404 /404.html;
            proxy_intercept_errors on;
            proxy_pass http://website:4321;
            proxy_set_header Host $astro_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
        }
    }
}
