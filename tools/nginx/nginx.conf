# PageSpeed 2.0 - Sample nginx configuration
#
# This is a minimal configuration for testing the pagespeed module.
# Adjust paths and settings for your environment.
#
# Build the module:
#   NGINX_PATH=/path/to/nginx bazel build //src/nginx:ngx_pagespeed_module.so
#
# Run nginx:
#   nginx -c /path/to/this/nginx.conf

# load_module /path/to/ngx_http_brotli_filter_module.so;
load_module /path/to/ngx_pagespeed_module.so;

# The daemon scopes its volume/sockets 0660
# owner+group, so an nginx worker only reaches the cache as the daemon's
# user or a member of its group.  Started as root, nginx would otherwise
# drop its workers to the build's default unprivileged user and silently
# serve unoptimized — this keeps them where the local daemon is.  Started
# as yourself the directive is ignored with a warning, which is correct:
# workers already run as you, and so does the daemon.
user root;

worker_processes 1;
error_log /tmp/ps_nginx_error.log info;
pid /tmp/ps_nginx.pid;

events {
    worker_connections 64;
}

http {
    include       /usr/local/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log /tmp/ps_nginx_access.log;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name localhost;

        location / {
            # Worker socket and HTML toggle auto-discovered from shared config
            pagespeed on;
            pagespeed_cache_path /tmp/ps_cache;

            proxy_pass http://127.0.0.1:8081;

            # Ensure origin sends uncompressed; PageSpeed caches raw bytes
            proxy_set_header Accept-Encoding "";
        }
    }
}
