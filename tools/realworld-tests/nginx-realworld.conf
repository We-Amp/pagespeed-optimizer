# The daemon scopes its volume/sockets 0660
# owner+group.  In this TEST harness the worker container runs as root (the
# production peer model is group `pagespeed`, asserted by the package-smoke
# rig), so the nginx workers must run as root too to share the cache — the
# harness validates function, not the permission model.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_pagespeed_module.so;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    # DNS resolver for runtime upstream resolution inside Docker
    resolver 8.8.8.8 8.8.4.4 valid=60s ipv6=off;

    # Generous timeouts for real internet upstreams
    proxy_connect_timeout 15s;
    proxy_read_timeout    30s;
    proxy_send_timeout    15s;

    server {
        listen 8083;
        absolute_redirect off;

        pagespeed on;
        pagespeed_cache_path /shared/cache.vol;

        # Local health endpoint (no upstream dependency)
        location = /health {
            pagespeed off;
            return 200 "ok\n";
        }

        # ── example.com ──────────────────────────────────────────
        # Note: example.com serves at / so we rewrite to strip /example/
        location /example/ {
            set $upstream_example https://www.example.com;
            rewrite ^/example/(.*)$ /$1 break;
            proxy_pass $upstream_example;
            proxy_ssl_server_name on;
            proxy_set_header Host www.example.com;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
        }

        # ── httpbin (programmable responses) ─────────────────────
        # Proxies to the bundled go-httpbin container (compose service
        # "httpbin", :8080) for deterministic responses, replacing the public
        # httpbin.org host (which timed out under CI load).
        #
        # The service name is resolved at REQUEST time via Docker's embedded
        # DNS (127.0.0.11), mirroring the example.com path above. A literal
        # `proxy_pass http://httpbin:8080;` would instead resolve "httpbin" at
        # startup — and since depends_on only waits for the container to start
        # (not be ready), nginx could fail to come up. The variable form makes
        # nginx start cleanly regardless of go-httpbin startup ordering.
        location /httpbin/ {
            resolver 127.0.0.11 ipv6=off valid=10s;
            set $upstream_httpbin http://httpbin:8080;
            rewrite ^/httpbin/(.*)$ /$1 break;
            proxy_pass $upstream_httpbin;
            proxy_set_header Host httpbin;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
        }
    }
}
