# Nginx config for IETF cache-tests.
# The cache-tests server generates requests with its own origin;
# we need to proxy_pass to wherever the test server tells us.
# For proxy-cache-tests, nginx acts as a forward proxy.

# The daemon scopes its volume/sockets 0660
# owner+group.  In this TEST harness the worker container runs as root (the
# production peer model is group `pagespeed`, asserted by the package-smoke
# rig), so the nginx workers must run as root too to share the cache — the
# harness validates function, not the permission model.
user root;

worker_processes 1;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_pagespeed_module.so;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    server {
        listen 8080;

        # Worker socket and HTML toggle auto-discovered from shared config
        pagespeed on;
        pagespeed_cache_path /shared/cache.vol;

        location / {
            # The cache-tests framework sends requests with the origin
            # URL in the Host header. We proxy to whatever the test
            # framework's origin server is.
            resolver 127.0.0.11 valid=30s;
            proxy_pass http://$host$request_uri;
            proxy_set_header Host $host;

            # Ensure origin sends uncompressed; PageSpeed caches raw bytes
            proxy_set_header Accept-Encoding "";
        }
    }
}
