# The daemon scopes its volume/sockets 0660
# owner+group.  In this TEST harness the worker container runs as root (the
# production peer model is group `pagespeed`, asserted by the package-smoke
# rig), so the nginx workers must run as root too to share the cache — the
# harness validates function, not the permission model.
user root;
worker_processes 1;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_pagespeed_module.so;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    # Gzip for encoding tests
    gzip on;
    gzip_types text/css application/javascript text/html text/plain;
    gzip_min_length 256;
    gzip_vary on;

    # Brotli compression — better ratio than gzip for text resources.
    brotli on;
    brotli_comp_level 4;
    brotli_min_length 256;
    brotli_types text/css application/javascript text/html text/plain;

    # Safe mode (default) — primary system under test
    server {
        listen 8080;

        # PageSpeed enabled — safe mode (default)
        location / {
            # Worker socket and HTML toggle auto-discovered from shared config
            pagespeed on;
            pagespeed_cache_path /shared/cache.vol;

            proxy_pass http://origin:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # Ensure origin sends uncompressed; PageSpeed caches raw bytes
            proxy_set_header Accept-Encoding "";

            # Pass through conditional request headers
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # Baseline — pagespeed disabled, raw proxy for control tests
        location /baseline/ {
            pagespeed off;

            # Strip /baseline/ prefix before proxying
            rewrite ^/baseline/(.*)$ /$1 break;

            proxy_pass http://origin:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # Ensure origin sends uncompressed; PageSpeed caches raw bytes
            proxy_set_header Accept-Encoding "";

            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }
    }

    # Aggressive mode — tests aggressive cache control behavior
    server {
        listen 8083;

        location / {
            pagespeed on;
            pagespeed_cache_mode aggressive;
            pagespeed_cache_path /shared/cache.vol;

            proxy_pass http://origin:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Accept-Encoding "";

            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }
    }
}
