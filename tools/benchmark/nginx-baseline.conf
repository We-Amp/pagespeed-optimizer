server {
    listen 8086;
    root /usr/share/nginx/html;

    # Disable access log to match PageSpeed nginx config (fair comparison)
    access_log off;

    # Match sendfile behavior of production nginx
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    location / {
        try_files $uri $uri/ =404;
    }
}
