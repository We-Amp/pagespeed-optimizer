# The daemon scopes its volume/sockets 0660
# owner+group.  In this TEST harness the worker container runs as root (the
# production peer model is group `pagespeed`, asserted by the package-smoke
# rig), so the nginx workers must run as root too to share the cache — the
# harness validates function, not the permission model.
user root;
worker_processes 2;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_pagespeed_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format timed '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time';
    access_log /var/log/nginx/access.log timed;

    # Timeouts appropriate for streaming tests
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Temp file for large responses
    proxy_max_temp_file_size 20m;

    keepalive_timeout 65;

    server {
        listen 8080;

        # Worker socket and HTML toggle auto-discovered from shared config
        pagespeed on;
        pagespeed_cache_path /shared/cache.vol;

        location / {
            proxy_pass http://origin:8081;
            proxy_set_header Host $host;

            # Ensure origin sends uncompressed; PageSpeed caches raw bytes
            proxy_set_header Accept-Encoding "";
        }
    }
}
