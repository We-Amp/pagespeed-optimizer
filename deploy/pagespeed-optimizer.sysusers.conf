# pagespeed-optimizer daemon identity.
#
# One static system user+group named `pagespeed`.  The daemon runs as this
# user; the serving module's web-server user (www-data / apache / nginx)
# joins the GROUP as a supplementary group — that join is performed by the
# module packages' postinst, never here (this package may install before
# any web server exists).
#
# sysusers.d is declarative and idempotent: an existing `pagespeed` user is
# never modified.  Installed to usr/lib/sysusers.d/pagespeed-optimizer.conf.
#Type Name        ID  GECOS                   Home directory                Shell
u     pagespeed   -   "PageSpeed optimizer"   /var/cache/pagespeed-optimizer /usr/sbin/nologin
