# 20-browser-analysis.conf -- re-admit what headless Chrome's own sandbox
# needs, on top of the enforcing syscall profile.
#
# SHIPPED INSTALLED, as a vendor drop-in next to the unit (2.1 default):
#   /usr/lib/systemd/system/pagespeed-optimizer.service.d/  (rpm)
#   /lib/systemd/system/pagespeed-optimizer.service.d/      (deb)
# so browser analysis works under the enforcing unit without an extra step.
#
#   MEASURED WITH A RUNNING CHROME (Chromium 150 and 151, Debian 12 and
#   Ubuntu 24.04 host images, the shipped unit as systemd runs it,
#   sandbox=require).
#
# What is verified, and how:
#
#   * the sandbox PROBE flips correctly -- under the unit's profile alone
#     the daemon reports browser_sandbox="unavailable" and names the reason;
#     adding this file makes it report "on" again. So the drop-in ordering
#     and the RestrictNamespaces= reset do what they claim.
#   * each name below is NECESSARY. seccomp, chroot, pkey_alloc,
#     landlock_create_ruleset and mincore are outside @system-service;
#     capset, setuid, setresuid and setgroups are inside @privileged and
#     setpriority, sched_setaffinity and sched_setattr are inside @resources,
#     both of which the unit subtracts. The first four were read off the
#     unit's own SystemCallLog= records; the @resources three could
#     NOT have been -- see the note below -- and were found the hard way, as
#     SIGSYS kills of Chrome under the enforcing profile with an earlier,
#     shorter list (sched_setattr arrived with Chromium 151; 150 never called
#     it). mincore was found the hardest way of all: it IS visible to the
#     log-only soak, but Chromium's MemoryInfra thread calls it in a burst
#     every few minutes (observed 3-4 minutes apart), so every sub-minute
#     measurement window simply recorded zero calls -- until a burst landed
#     inside a rig leg's enforcing half and killed the browser process
#     mid-render (1.16.0-rc.11 CI). A periodic call is invisible to any soak
#     shorter than its period -- which is why the rig also carries a
#     long-idle soak leg (h6-browser-soak, #1485), run at a two-burst-period
#     window by CI Periodic rather than per-PR.
#   * the list is SUFFICIENT: with this file stacked on the unit's profile,
#     the daemon's own headless Chrome starts sandboxed, renders pages,
#     survives a service restart, and `journalctl -u pagespeed-optimizer`
#     shows no `Chrome exited` line and no SIGSYS. The daemon-install rig
#     (tools/packaging/verify-daemon-systemd.sh, leg h6-browser-analysis)
#     asserts that on every build of the package: a distro Chromium under
#     the enforcing unit with this profile, three renders across a service
#     restart, no Chrome exit, and a zero delta in the kernel's SIGSYS
#     records for Chrome processes. The bisect that produced the list itself
#     is this file's history, not something the rig repeats.
#
# THE SOAK CANNOT SEE EVERYTHING THIS FILE RE-ADMITS. The unit's
# SystemCallLog=~@system-service records calls OUTSIDE @system-service.
# setpriority, sched_setaffinity and sched_setattr are INSIDE it (they are
# removed by the unit's `~@privileged @resources` subtraction, not by the
# allow-list), so a log-only soak stays quiet about them however long it
# runs. A clean soak therefore proves the base allow-list; it does not prove
# the subtractions, which is what this file exists to repair for Chrome.
#
# If you enable browser analysis under the enforcing profile and Chrome
# still dies, this file is the first place to look. A missing name shows up
# as `Chrome exited (status=0, signal=31)` in the journal, and adding it
# here is the fix. Please report it with the Chrome version -- Chrome's
# sandbox is Chrome's to change.
#
# SAFE ON ITS OWN. The allow-list this file extends (`@system-service` minus
# `@privileged @resources`) lives in the shipped unit itself, enforcing by
# default since 2.1, so `SystemCallFilter=` lines here only ever ADD to it.
# There is no companion file to install first and none to remove with it.
# (Before 2.1 the allow-list was a separate opt-in drop-in, and this file
# installed without it defined a twelve-syscall allow-list that killed the
# daemon at startup; folding the list into the unit is what made that
# mis-install impossible.)
#
# The numeric prefix is still load-bearing: systemd applies drop-ins in
# lexical order, and the documented opt-out (90-syscall-filter-off.conf)
# RESETS SystemCallFilter= -- it must sort after this file for the reset to
# win, so do not rename either one.
#
# TURNING IT OFF (a host that does not run browser analysis and wants the
# narrower daemon-only profile with RestrictNamespaces=yes back in force):
# mask this vendor file with an EMPTY file of the same name under /etc --
# systemd lets a same-named drop-in in /etc replace the vendor one, and an
# empty drop-in contributes nothing.  The package never writes under
# /etc/systemd, so the mask survives every upgrade.
#   install -D -m 0644 /dev/null \
#     /etc/systemd/system/pagespeed-optimizer.service.d/20-browser-analysis.conf
#   systemctl daemon-reload && systemctl restart pagespeed-optimizer
# Remove the empty file and repeat the two commands to turn it back on.
# Masking this file is NOT the way to turn seccomp off -- it makes the
# profile tighter, not looser.  The opt-out is 90-syscall-filter-off.conf.
# Do not edit this file in place: an upgrade overwrites it.
#
# If browser analysis reports itself unavailable, the log line above the
# report names the cause. A refusal is never a fallback: browser analysis
# simply does not initialize, and the daemon keeps serving without it.

[Service]
# An empty assignment RESETS the directive rather than adding to it, so this
# clears the unit's RestrictNamespaces=yes.  Chrome's
# zygote clones with CLONE_NEWUSER|CLONE_NEWPID|CLONE_NEWNET and then
# unshares a mount namespace; a narrower spelling would have to enumerate
# those, and Chrome's set is Chrome's to change.
RestrictNamespaces=

# Re-admissions, by PLAIN SYSCALL NAME and never by group.
#
# The obvious spelling here is `@sandbox @mount`, and it is wrong: @sandbox
# does not exist before systemd 254.  On Debian 12 and AlmaLinux 9 (both
# systemd 252) `systemd-analyze syscall-filter @sandbox` answers `Filter set
# "@sandbox" not found`, and systemd loads the unit anyway with an "Unknown
# system call group, ignoring" warning -- silently dropping seccomp(2) from
# the allow-list and killing Chrome's layer-2 sandbox on exactly the distros
# this product targets most.  Plain names resolve on every version, and a rig
# leg now fails the build if `systemd-analyze verify` emits any such warning
# -- reading its STDERR, where the warning actually goes, and proving itself
# by planting an unknown group and asserting the warning is seen.
#
# What each name is for (measured, see
# deploy/pagespeed-optimizer.syscall-census.md):
#
#   seccomp        Chrome's layer-2 renderer filter.  NOT in @system-service,
#                  so it has to be added back explicitly.
#   chroot         the layer-1 sandbox chroots the child into an empty dir.
#                  In @mount AND in @privileged, so the unit's
#                  `~@privileged` removes it.  Note what is NOT here: the
#                  rest of @mount (mount, umount2, pivot_root, move_mount,
#                  the fs* family).  An earlier draft admitted the whole
#                  group, which would have made this profile barely tighter
#                  than no profile -- and it also disagreed with
#                  deploy/chrome-seccomp.json, which grants the container
#                  exactly chroot and nothing else from that family.  The two
#                  now say the same thing, deliberately.
#   capset         Chrome drops all capabilities inside the user namespace.
#                  In @system-service but ALSO in @privileged -- so the
#                  subtraction takes it away and this puts it back.  Same for
#                  the uid/gid calls the sandbox uses to become nobody.
#   setpriority    Chrome lowers the priority of its background threads.  In
#                  @resources, which the unit subtracts; without it the
#                  browser process is killed at startup, every time (the
#                  daemon's back-off then reports browser analysis
#                  UNAVAILABLE after three kills).
#   sched_setaffinity
#                  pinned by Chrome's thread pool.  Also @resources; without
#                  it a renderer child is killed mid-page.
#   sched_setattr  Chromium 151's thread-type plumbing (150 did not call
#                  it).  Also @resources; without it the browser process is
#                  killed at startup on that version -- the same failure
#                  shape as setpriority, one Chrome release later.
#   pkey_alloc     memory-protection keys for V8's code space (Chrome checks
#                  whether they are available; a kill is the wrong answer).
#   landlock_create_ruleset
#                  Chrome's sandbox probes Landlock the same way.  Both of
#                  the last two are outside @system-service.
#   mincore        the MemoryInfra thread's periodic (every few minutes) page
#                  residency probe.  Outside @system-service, so the shipped
#                  unit logs it -- but only if a burst happens to land inside
#                  the observation window, which a short render cycle almost
#                  never contains.  Under enforcement the first call is a
#                  SECCOMP_RET_KILL_PROCESS: the whole browser dies, not just
#                  the thread, a render in flight fails, and the daemon
#                  relaunches Chrome only after its back-off delay.
# Not re-admitted, and named so the omission is a decision rather than an
# oversight: setgid, setregid, setresgid and setreuid (all `~@privileged`)
# were NOT needed by Chromium 150 -- measured, not assumed -- and ptrace,
# which Chrome's crash handler (chrome_crashpad_handler) attempts only when
# a Chrome process has already died. That kill costs a crash report, not the
# browser, and re-admitting ptrace would widen this profile for nothing.
SystemCallFilter=seccomp chroot capset setuid setresuid setgroups
SystemCallFilter=setpriority sched_setaffinity sched_setattr pkey_alloc landlock_create_ruleset mincore
