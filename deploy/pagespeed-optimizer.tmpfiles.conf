# pagespeed-optimizer filesystem layout.
#
# The versioned cache directory: N in v<N> is the cache-directory
# generation, bumped on ownership-model or cyclone format-major changes.
# 3770 = setgid + sticky.  The setgid bit keeps group `pagespeed` on
# everything created inside, so the daemon and the web-server peers share one
# group boundary; the sticky bit means a group member (a web-server worker)
# can no longer delete or rename files it does not own, which matters
# precisely because the directory has to be group-writable at all.  New
# generations append one line; a retired generation's line is removed —
# tmpfiles never deletes the old CONTENT.
#
# Installed to usr/lib/tmpfiles.d/pagespeed-optimizer.conf.
#Type Path                              Mode User      Group      Age Argument
d     /var/cache/pagespeed-optimizer   0755 root      root       -   -
d     /var/cache/pagespeed-optimizer/v1 3770 pagespeed pagespeed -   -
# The secrets env file is NOT in the package payload: the maintainer script
# creates it (0600, then 0640) with generated tokens, because a
# package-generated secret must never be a conffile / %config.  This line
# re-scopes that created file to the daemon's group — the only other
# legitimate reader — declaratively, so no script ever chowns.  `z` is a
# no-op until the file exists, which is why the maintainer script creates it
# before applying tmpfiles.
z     /etc/pagespeed-optimizer/daemon.env 0640 root pagespeed -   -
# The /etc/default overrides file IS in the payload (a conffile / %config),
# and an upgrade REPLACES an operator-unedited one with payload ownership
# (root:root) whatever the previous install left behind (#1486).  Same
# treatment as the secrets file: payload 0640 root:root, this line re-scopes
# the group on every install, upgrade and boot.
z     /etc/default/pagespeed-optimizer 0640 root pagespeed -   -
