# 90-syscall-filter-off.conf -- turn the optimizer daemon's syscall profile
# from ENFORCING back into LOG-ONLY (the 2.1 default flip).
#
# The shipped unit enforces a system-call allow-list: the kernel kills the
# daemon (SIGSYS, exit status 31) on the first call outside systemd's
# @system-service group minus @privileged and @resources, and the packaged
# 20-browser-analysis.conf drop-in re-admits what headless Chrome's own
# sandbox needs on top of that.  This file is the documented way OFF.
#
# Install:
#   install -D -m 0644 \
#     /usr/share/doc/pagespeed-optimizer/90-syscall-filter-off.conf.example \
#     /etc/systemd/system/pagespeed-optimizer.service.d/90-syscall-filter-off.conf
#   systemctl daemon-reload
#   systemctl restart pagespeed-optimizer
#
# It survives every package upgrade: the package writes vendor configuration
# under /usr/lib/systemd (and /lib/systemd on Debian-family hosts) and NEVER
# under /etc/systemd, so nothing dpkg or rpm does on upgrade can touch or
# re-create anything here.  Remove the file and run the same two commands to
# go back to enforcing.
#
# WHY the `90-` prefix matters: systemd applies drop-ins in lexical order of
# their file names, regardless of the directory each one lives in, and an
# EMPTY assignment resets a list-valued directive instead of adding to it.
# This file has to sort after every vendor drop-in for its resets to win --
# renaming it to sort before `20-` would make it a no-op.
#
# WHAT it does not do: SystemCallLog= in the unit stays in force, so an
# opted-out host keeps recording, in the audit log, every call outside
# @system-service -- the same soak the default was decided on.  The daemon's
# `syscall_filter` field on /v1/health therefore still says "filtered" (a
# log-only filter is a seccomp filter too); it is not the way to tell the
# two postures apart.  This is:
#
#   systemctl show -p SystemCallFilter pagespeed-optimizer
#     -> SystemCallFilter=~        with this file installed (nothing filtered)
#     -> a long allow-list         without it (enforcing)
#
# WHEN to install it: a SIGSYS kill you can attribute to this profile --
# `systemctl status` says `code=dumped, status=31/SYS`, or the journal says
# `Chrome exited (status=0, signal=31)`.  Install this, restart, then read
# the syscall NAME out of the audit record (type 1326; `ausearch -m SECCOMP
# -i` when auditd runs, `journalctl -k | grep 'type=1326'` when it does not --
# a kill carries `sig=31`, `sig=0` lines are the log filter's records --
# `ausyscall <N>` to name a bare number) and report it with the
# Chrome version if the victim was the browser.  A missing name is a bug in
# the shipped profile, and the fix is a name in 20-browser-analysis.conf,
# not a host that stays opted out.
#
# Do not add SystemCallFilter= lines to an override.conf that sorts after this
# file (e.g. one written by `systemctl edit`): after the reset above, a bare
# list there becomes the whole allow-list again.
#
# WHAT NOT TO DO instead: do not edit the unit under /usr/lib or /lib -- an
# upgrade overwrites it -- and do not remove or mask the vendor
# 20-browser-analysis.conf to "turn off seccomp".  That file only widens the
# profile for Chrome; masking it leaves the daemon's own allow-list fully in
# force with browser analysis refused (a legitimate, tighter posture for a
# host that does not run browser analysis -- but it is not an opt-out).

[Service]
# Empty assignments RESET.  Every SystemCallFilter= line accumulated by the
# unit and by earlier-sorting drop-ins is cleared, so no filter is installed
# from this directive at all; RestrictNamespaces= goes back to unrestricted.
SystemCallFilter=
RestrictNamespaces=
