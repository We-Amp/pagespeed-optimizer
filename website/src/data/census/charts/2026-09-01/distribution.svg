<svg class="census" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="100%" aria-labelledby="census-distribution-title census-distribution-desc"><style>
svg.census{--census-accent:var(--color-interactive,#0e6f89);--census-gray:#8a8478;--census-ink:var(--color-text-body,#15171a);--census-muted:var(--color-text-muted,#55606b);--census-grid:var(--color-border,#e2ded7);--census-axis:var(--color-border-strong,#cfcabf);font-family:inherit;font-size:12px}
.dark svg.census{--census-gray:#8a9099}
svg.census .census-grid{stroke:var(--census-grid);stroke-width:1}
svg.census .census-axis{stroke:var(--census-axis);stroke-width:1}
svg.census .census-line{fill:none;stroke:var(--census-accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.census .census-line[data-bucket="hidden"]{stroke:var(--census-gray)}
svg.census .census-bar{fill:var(--census-accent)}
svg.census .census-bar[data-bucket="hidden"]{fill:var(--census-gray)}
svg.census .census-point{fill:transparent}
svg.census text{fill:var(--census-muted)}
svg.census .census-label,svg.census .census-panel-title{fill:var(--census-ink)}
svg.census .census-panel-title{font-weight:600}
