<svg class="census" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" aria-labelledby="census-ranks-title census-ranks-desc"><style>
svg.census{--census-accent:var(--color-interactive,#0e6f89);--census-gray:#8a8478;--census-ink:var(--color-text-body,#15171a);--census-muted:var(--color-text-muted,#55606b);--census-grid:var(--color-border,#e2ded7);--census-axis:var(--color-border-strong,#cfcabf);font-family:inherit;font-size:12px}
.dark svg.census{--census-gray:#8a9099}
svg.census .census-grid{stroke:var(--census-grid);stroke-width:1}
svg.census .census-axis{stroke:var(--census-axis);stroke-width:1}
svg.census .census-line{fill:none;stroke:var(--census-accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.census .census-line[data-bucket="hidden"]{stroke:var(--census-gray)}
svg.census .census-bar{fill:var(--census-accent)}
svg.census .census-bar[data-bucket="hidden"]{fill:var(--census-gray)}
svg.census .census-point{fill:transparent}
svg.census text{fill:var(--census-muted)}
svg.census .census-label,svg.census .census-panel-title{fill:var(--census-ink)}
svg.census .census-panel-title{font-weight:600}
</style><title id="census-ranks-title">PageSpeed share within each exclusive rank band</title><desc id="census-ranks-desc">Horizontal bars of the share of origins per exclusive rank band that serve PageSpeed.</desc><line class="census-axis" x1="250" y1="16" x2="250" y2="324"/><path class="census-bar" d="M250 21.0 H247.0 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>top 1k: 0.0%</title></path><text class="census-label" x="242" y="35.0" text-anchor="end">top 1k</text><path class="census-bar" d="M250 49.0 H508.3 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>1k–5k: 0.3%</title></path><text class="census-label" x="242" y="63.0" text-anchor="end">1k–5k</text><path class="census-bar" d="M250 77.0 H362.9 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>5k–10k: 0.1%</title></path><text class="census-label" x="242" y="91.0" text-anchor="end">5k–10k</text><path class="census-bar" d="M250 105.0 H404.6 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>10k–50k: 0.2%</title></path><text class="census-label" x="242" y="119.0" text-anchor="end">10k–50k</text><path class="census-bar" d="M250 133.0 H445.1 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>50k–100k: 0.2%</title></path><text class="census-label" x="242" y="147.0" text-anchor="end">50k–100k</text><path class="census-bar" d="M250 161.0 H494.3 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>100k–500k: 0.3%</title></path><text class="census-label" x="242" y="175.0" text-anchor="end">100k–500k</text><path class="census-bar" d="M250 189.0 H493.7 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>500k–1M: 0.3%</title></path><text class="census-label" x="242" y="203.0" text-anchor="end">500k–1M</text><path class="census-bar" d="M250 217.0 H501.3 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>1M–5M: 0.3%</title></path><text class="census-label" x="242" y="231.0" text-anchor="end">1M–5M</text><path class="census-bar" d="M250 245.0 H474.4 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>5M–10M: 0.3%</title></path><text class="census-label" x="242" y="259.0" text-anchor="end">5M–10M</text><path class="census-bar" d="M250 273.0 H438.6 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>10M–50M: 0.2%</title></path><text class="census-label" x="242" y="287.0" text-anchor="end">10M–50M</text><path class="census-bar" d="M250 301.0 H247.0 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H250 Z"><title>unranked: 0.0%</title></path><text class="census-label" x="242" y="315.0" text-anchor="end">unranked</text></svg>
