<svg viewBox="0 0 720 420" width="100%" height="auto" role="img" aria-labelledby="bevTitle bevDesc" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <title id="bevTitle">CDN vs self-hosted image optimization: monthly cost break-even</title>
  <desc id="bevDesc">CDN cost rises linearly from $35 at 100K requests to $3,500 at 10M requests, crossing the flat self-hosted line in the 100K to 170K band. Above that volume self-hosting is cheaper.</desc>

  <!-- panel ground -->
  <rect x="0" y="0" width="720" height="420" rx="0" fill="#0b0c0e"/>
  <rect x="0.5" y="0.5" width="719" height="419" fill="#121417" stroke="#2a2e34" stroke-width="1"/>

  <!-- corner registration ticks (instrument frame) -->
  <g stroke="#3a3f47" stroke-width="1">
    <path d="M8 8 H22 M8 8 V22"/>
    <path d="M712 8 H698 M712 8 V22"/>
    <path d="M8 412 H22 M8 412 V398"/>
    <path d="M712 412 H698 M712 412 V398"/>
  </g>

  <!-- header readout -->
  <text x="24" y="34" fill="#e8eaed" font-size="13" letter-spacing="0.5">COST / MONTH  —  CDN vs SELF-HOSTED</text>
  <text x="24" y="50" fill="#8a9099" font-size="10" letter-spacing="1">USD · MONTHLY IMAGE REQUESTS · LINEAR EGRESS @ $0.35/1K</text>

  <!-- plot region: x 96..672 , y 72..360 ; y 0..3500 -->
  <!-- recessed plot well -->
  <rect x="96" y="72" width="576" height="288" fill="#070809" stroke="#2a2e34" stroke-width="1"/>

  <!-- Y gridlines + labels (0..3500 step 500). yPx = 360 - val/3500*288 -->
  <g font-size="10" fill="#8a9099">
    <!-- 0 -->
    <line x1="96" y1="360" x2="672" y2="360" stroke="#2a2e34" stroke-width="1"/>
    <text x="88" y="363" text-anchor="end">0</text>
    <!-- 500 -->
    <line x1="96" y1="318.86" x2="672" y2="318.86" stroke="#191c20" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="88" y="321.86" text-anchor="end">500</text>
    <!-- 1000 -->
    <line x1="96" y1="277.71" x2="672" y2="277.71" stroke="#191c20" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="88" y="280.71" text-anchor="end">1,000</text>
    <!-- 1500 -->
    <line x1="96" y1="236.57" x2="672" y2="236.57" stroke="#191c20" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="88" y="239.57" text-anchor="end">1,500</text>
    <!-- 2000 -->
    <line x1="96" y1="195.43" x2="672" y2="195.43" stroke="#191c20" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="88" y="198.43" text-anchor="end">2,000</text>
    <!-- 2500 -->
    <line x1="96" y1="154.29" x2="672" y2="154.29" stroke="#191c20" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="88" y="157.29" text-anchor="end">2,500</text>
    <!-- 3000 -->
    <line x1="96" y1="113.14" x2="672" y2="113.14" stroke="#191c20" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="88" y="116.14" text-anchor="end">3,000</text>
    <!-- 3500 -->
    <line x1="96" y1="72" x2="672" y2="72" stroke="#2a2e34" stroke-width="1"/>
    <text x="88" y="75" text-anchor="end">3,500</text>
  </g>

  <!-- Y axis title -->
  <text x="30" y="216" fill="#a7aeb6" font-size="10" letter-spacing="1" transform="rotate(-90 30 216)" text-anchor="middle">USD / MONTH</text>

  <!-- X categorical ticks: evenly spaced. -->
  <!-- positions: 100K=153.6, 500K=268.8, 1M=384, 5M=499.2, 10M=614.4 -->
  <g font-size="10" fill="#a7aeb6" text-anchor="middle">
    <g stroke="#2a2e34" stroke-width="1">
      <line x1="153.6" y1="360" x2="153.6" y2="366"/>
      <line x1="268.8" y1="360" x2="268.8" y2="366"/>
      <line x1="384" y1="360" x2="384" y2="366"/>
      <line x1="499.2" y1="360" x2="499.2" y2="366"/>
      <line x1="614.4" y1="360" x2="614.4" y2="366"/>
    </g>
    <text x="153.6" y="380">100K</text>
    <text x="268.8" y="380">500K</text>
    <text x="384" y="380">1M</text>
    <text x="499.2" y="380">5M</text>
    <text x="614.4" y="380">10M</text>
  </g>
  <text x="384" y="400" fill="#a7aeb6" font-size="10" letter-spacing="1" text-anchor="middle">MONTHLY IMAGE REQUESTS</text>

  <!-- ===== BREAK-EVEN BAND (~100K-170K), drawn behind lines ===== -->
  <rect x="153.6" y="72" width="20.16" height="288" fill="#5EB1C9" fill-opacity="0.07"/>
  <line x1="153.6" y1="72" x2="153.6" y2="360" stroke="#5EB1C9" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <line x1="173.76" y1="72" x2="173.76" y2="360" stroke="#5EB1C9" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <text x="163.7" y="92" fill="#84c7db" font-size="9.5" text-anchor="middle" letter-spacing="0.5">BREAK-EVEN</text>
  <text x="163.7" y="104" fill="#8a9099" font-size="9" text-anchor="middle">~100–170K</text>

  <!-- ===== SELF-HOSTED FLAT LINE (VM only, ~$45) ===== y = 360 - 45/3500*288 = 356.30 -->
  <line x1="96" y1="356.3" x2="672" y2="356.3" stroke="#6fbf8f" stroke-width="2"/>
  <rect x="667" y="352.3" width="8" height="8" fill="#6fbf8f"/>
  <g>
    <rect x="440" y="332" width="150" height="15" fill="#121417" stroke="#2a2e34" stroke-width="1"/>
    <text x="447" y="343" fill="#6fbf8f" font-size="10">SELF-HOSTED · flat cost</text>
  </g>

  <!-- ===== CDN LINE (cyan, rising) ===== -->
  <polyline points="153.6,357.12 268.8,345.6 384,331.2 499.2,216 614.4,72" fill="none" stroke="#5EB1C9" stroke-width="2"/>
  <g>
    <rect x="150.6" y="354.12" width="6" height="6" fill="#5EB1C9"/>
    <text x="153.6" y="349" fill="#a7aeb6" font-size="9" text-anchor="middle">$35</text>

    <rect x="265.8" y="342.6" width="6" height="6" fill="#5EB1C9"/>
    <text x="278" y="338" fill="#a7aeb6" font-size="9" text-anchor="start">$175</text>

    <rect x="381" y="328.2" width="6" height="6" fill="#5EB1C9"/>
    <text x="384" y="323" fill="#a7aeb6" font-size="9" text-anchor="middle">$350</text>

    <rect x="496.2" y="213" width="6" height="6" fill="#5EB1C9"/>
    <text x="499.2" y="208" fill="#a7aeb6" font-size="9" text-anchor="middle">$1,750</text>

    <rect x="611.4" y="69" width="6" height="6" fill="#5EB1C9"/>
    <text x="614.4" y="65" fill="#e8eaed" font-size="9.5" text-anchor="end">$3,500</text>
  </g>

  <!-- crossover node marker on flat line within band -->
  <circle cx="161.8" cy="356.3" r="3.2" fill="#07080a" stroke="#84c7db" stroke-width="1.6"/>

  <!-- legend (top-right, inside frame) -->
  <g font-size="10">
    <rect x="486" y="70" width="180" height="40" fill="#191c20" stroke="#2a2e34" stroke-width="1"/>
    <line x1="496" y1="84" x2="516" y2="84" stroke="#5EB1C9" stroke-width="2"/>
    <rect x="503" y="81" width="6" height="6" fill="#5EB1C9"/>
    <text x="522" y="88" fill="#e8eaed">CDN  (scales with requests)</text>
    <line x1="496" y1="100" x2="516" y2="100" stroke="#6fbf8f" stroke-width="2"/>
    <text x="522" y="104" fill="#e8eaed">SELF-HOSTED  (flat)</text>
  </g>

  <!-- footer note -->
  <text x="672" y="50" fill="#8a9099" font-size="9" text-anchor="end" letter-spacing="0.5">CHEAPER ABOVE ~100–170K REQ/mo →</text>
</svg>
