[package]
name = "vtracer_ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "C FFI wrapper around VTracer for raster-to-SVG vectorization"

[lib]
name = "vtracer_ffi"
crate-type = ["staticlib"]

[dependencies]
vtracer = "0.6.5"

[profile.release]
panic = "abort"
opt-level = 2

[profile.dev]
panic = "abort"
